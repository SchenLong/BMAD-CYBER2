# BMGD (Game Development) Module Configuration
# This file defines installation questions and module configuration values

code: "bmgd"
name: "BMAD Game Development"
default_selected: false

# Welcome message shown during installation
prompt:
  - "BMAD Game Development (BMGD) Module Installation"
  - ""
  - "This module provides 6 specialized game development agents:"
  - ""
  - "  Design & Production:"
  - "  - Samus Shepard (Game Designer - GDD & Mechanics)"
  - "  - Max (Game Scrum Master - Sprint Management)"
  - ""
  - "  Technical:"
  - "  - Winston (Game Architect - Engine & Systems)"
  - "  - Devon (Game Developer - Implementation)"
  - "  - GLaDOS (Game QA - Testing & Certification)"
  - ""
  - "  Solo Development:"
  - "  - Solo Dev (Game Solo Developer - Fast Prototyping)"
  - ""
  - "Supports Unity, Unreal Engine, and Godot workflows."
  - "From game brief to launch certification."

# Core config values are automatically inherited from installer:
## user_name
## communication_language
## document_output_language

# ============================================================================
# CONFIGURATION FIELDS
# ============================================================================

# INTERACTIVE: Primary output location
output_folder:
  prompt: "Where should BMGD save game development artifacts?"
  default: "_bmad-output/games"
  result: "{project-root}/{value}"

# INTERACTIVE: Target game engine
game_engine:
  prompt: "What is your primary game engine?"
  default: "unity"
  result: "{value}"
  single-select:
    - value: "unity"
      label: "Unity - C# game development"
    - value: "unreal"
      label: "Unreal Engine - C++/Blueprints"
    - value: "godot"
      label: "Godot - GDScript/C#"
    - value: "custom"
      label: "Custom/Other engine"

# STATIC: Module identification
module_code:
  result: "bmgd"

module_version:
  result: "1.0.0"

# STATIC: Module paths
agents_path:
  result: "{project-root}/_bmad/bmgd/agents"

workflows_path:
  result: "{project-root}/_bmad/bmgd/workflows"

# STATIC: Automatic subdirectory configuration
design:
  result: "{output_folder}/design"

technical:
  result: "{output_folder}/technical"

testing:
  result: "{output_folder}/testing"

assets:
  result: "{output_folder}/assets"
