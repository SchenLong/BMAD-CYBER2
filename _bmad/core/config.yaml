# =============================================================================
# PACKAGE MANAGEMENT SYSTEM (Optional)
# =============================================================================

package_manager:
  # Master switch for package management functionality
  enabled: false

  # Development mode (enables additional debugging and validation)
  development_mode: true

  # Package repository configuration
  repository:
    # Local development repository
    local:
      enabled: true
      path: "{project-root}/packages"
      auto_discovery: true

    # Enterprise repository (for licensed customers)
    enterprise:
      enabled: false
      url: "https://packages.bmad.enterprise"
      auth_required: true
      api_key: null

    # Public community repository (for open source packages)
    community:
      enabled: false
      url: "https://packages.bmad.community"
      auth_required: false

  # Package validation and security
  validation:
    # Require digital signatures for all packages
    require_signatures: true

    # Allowed package sources (security whitelist)
    trusted_sources:
      - "blackunicorn.tech"
      - "localhost"

    # Security scanning
    security_scan:
      enabled: true
      block_on_vulnerabilities: true
      scan_timeout_seconds: 300

  # Package activation/deactivation
  activation:
    # Allow dynamic loading/unloading of packages
    dynamic_loading: true

    # Require restart for package changes
    require_restart: false

    # Rollback capability
    enable_rollback: true

    # Backup configuration before changes
    backup_config: true

  # Licensing and monetization
  licensing:
    # License validation
    validate_licenses: true

    # Grace period for license violations (days)
    grace_period_days: 7

    # Telemetry for usage tracking
    usage_telemetry:
      enabled: false
      endpoint: null
      anonymize_data: true

# =============================================================================
# INTEGRATION CONFIGURATION
# =============================================================================

integrations:
  # Cross-module collaboration settings
  cross_module:
    # Allow modules to invoke workflows from other modules
    cross_workflow_calls: true

    # Shared context between modules
    shared_context: true

    # Module dependency resolution
    dependency_resolution: "auto"

  # External system integrations
  external:
    # GitHub integration for code operations
    github:
      enabled: false
      api_token: null
      default_org: null

    # Slack integration for notifications
    slack:
      enabled: false
      webhook_url: null
      default_channel: "#bmad-ops"

    # Email notifications
    email:
      enabled: false
      smtp_server: null
      username: null
      password: null
