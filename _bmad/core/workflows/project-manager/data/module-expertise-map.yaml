# Module Expertise Map
# Maps topics, keywords, and scenarios to appropriate modules and agents
# Used by Abdul for intelligent cross-module recommendations

expertise_areas:

  # Security & Compliance
  security:
    primary_module: "cybersec-team"
    triggers:
      - security
      - vulnerability
      - threat
      - penetration
      - attack
      - exploit
      - breach
      - malware
      - ransomware
      - phishing
      - encryption
      - authentication
      - authorization
    suggested_agents:
      - name: security-architect
        display: "Bastion"
        use_case: "Architecture review, defense design"
      - name: threat-analyst
        display: "Cipher"
        use_case: "Threat intelligence, adversary analysis"
      - name: penetration-tester
        display: "Ghost"
        use_case: "Offensive testing, vulnerability assessment"
    suggested_workflows:
      - security-architecture-review
      - stride-threat-model
      - vulnerability-management

  compliance:
