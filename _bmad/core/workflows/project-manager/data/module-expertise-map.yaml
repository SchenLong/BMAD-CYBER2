# Cross-module recommendation triggers
# When to suggest involving additional modules
cross_module_triggers:

  - scenario: "Architecture phase of software project"
    trigger_phase: "solutioning"
    trigger_artifact: "architecture.md"
    recommend_modules: ["cybersec-team"]
    reason: "Security review should happen during architecture design"
    suggested_action: "Security architecture review"

  - scenario: "Before implementation phase"
    trigger_phase: "implementation"
    recommend_modules: ["legal-team"]
    reason: "Compliance check before development starts"
    suggested_action: "Compliance requirements review"

  - scenario: "High-stakes product decisions"
    trigger_keywords: ["enterprise", "b2b", "regulated", "healthcare", "finance"]
    recommend_modules: ["strategy-team", "legal-team"]
    reason: "Strategic and legal counsel for high-stakes decisions"
    suggested_action: "Strategic decision workshop with legal input"

  - scenario: "Threat modeling"
    trigger_workflow: "stride-threat-model"
    recommend_modules: ["intel-team"]
    reason: "Threat intelligence can inform threat modeling"
    suggested_action: "Threat actor profiling for realistic threat scenarios"

  - scenario: "Incident occurred"
    trigger_keywords: ["incident", "breach", "attack", "compromised"]
    recommend_modules: ["cybersec-team", "legal-team", "strategy-team"]
    reason: "Coordinated response across technical, legal, and communications"
    suggested_action: "Incident response with legal and comms support"
