# Shared Decision Frameworks
# Cross-module decision templates for consistent multi-domain decision making
# Used by team orchestration workflows and party mode presets

name: decision-frameworks
version: "1.0"
description: "Standardized decision frameworks for cross-module decisions"

# ═══════════════════════════════════════════════════════════════════════════
# RISK PRIORITIZATION FRAMEWORK
# Standard approach to prioritizing risks across domains
# ═══════════════════════════════════════════════════════════════════════════

risk_prioritization:

  name: "Cross-Module Risk Prioritization"
  description: "Unified framework for prioritizing risks identified by different modules"

  risk_dimensions:
    - dimension: "Business Impact"
      owner: "Strategy Team"
      scale: [1, 2, 3, 4, 5]
      levels:
        1: "Negligible - No measurable business impact"
        2: "Minor - Temporary inconvenience, <$10K impact"
        3: "Moderate - Short-term business disruption, $10K-$100K"
        4: "Significant - Major business impact, $100K-$1M"
        5: "Severe - Existential threat, >$1M or reputation damage"

    - dimension: "Legal/Regulatory Exposure"
      owner: "Legal Team"
      scale: [1, 2, 3, 4, 5]
      levels:
        1: "None - No legal implications"
        2: "Low - Minor compliance gap, easily remediated"
        3: "Moderate - Regulatory attention possible, fines <$100K"
        4: "High - Regulatory action likely, fines $100K-$1M"
        5: "Critical - Criminal liability, major litigation, fines >$1M"

    - dimension: "Security Risk"
      owner: "Cybersec Team"
      scale: [1, 2, 3, 4, 5]
      levels:
        1: "Minimal - No security impact"
        2: "Low - Minor vulnerability, limited exploitability"
        3: "Medium - Exploitable vulnerability, moderate impact"
        4: "High - Active threat, significant data at risk"
        5: "Critical - Active exploitation, major breach potential"

    - dimension: "Intelligence Assessment"
      owner: "Intel Team"
      scale: [1, 2, 3, 4, 5]
      levels:
        1: "No external threat indicators"
        2: "Low - Theoretical threat, no active indicators"
        3: "Medium - Credible threat, some indicators"
        4: "High - Active threat campaign, strong indicators"
        5: "Critical - Confirmed targeting, imminent threat"

  scoring_matrix:
    calculation: "Average of all applicable dimensions"
    priority_mapping:
      critical: "Average >= 4.5"
      high: "Average >= 3.5"
      medium: "Average >= 2.5"
      low: "Average < 2.5"

  template: |
    ## Risk Prioritization Assessment

    | Dimension | Score | Rationale |
    |-----------|-------|-----------|
    | Business Impact | [1-5] | [explanation] |
    | Legal Exposure | [1-5] | [explanation] |
    | Security Risk | [1-5] | [explanation] |
    | Intel Assessment | [1-5] | [explanation] |

    **Average Score:** [X.X]
    **Priority:** [Critical/High/Medium/Low]

    **Cross-Module Consensus:** [Yes/No - if No, explain dissent]

# ═══════════════════════════════════════════════════════════════════════════
# NOTIFICATION/ESCALATION PROTOCOL
# When and how to escalate across modules
# ═══════════════════════════════════════════════════════════════════════════

escalation_protocol:

  name: "Cross-Module Escalation Protocol"
  description: "When and how to escalate issues across module boundaries"

  escalation_levels:

    - level: "L1 - Informational"
      criteria: "FYI for awareness, no action required"
      notification_method: "Async update to relevant module lead"
      response_time: "Within 24 hours"
      example: "Compliance audit scheduled for next quarter"

    - level: "L2 - Advisory"
      criteria: "Input requested, decision needed within days"
      notification_method: "Direct message to relevant agent"
      response_time: "Within 8 hours"
      example: "Contract clause needs security review"

    - level: "L3 - Urgent"
      criteria: "Action required, time-sensitive"
      notification_method: "Party mode session"
      response_time: "Within 2 hours"
      example: "Potential data breach discovered"

    - level: "L4 - Crisis"
      criteria: "Immediate action, all hands"
      notification_method: "War room activation"
      response_time: "Immediate"
      example: "Active ransomware attack"

  escalation_triggers:

    from_cybersec:
      - trigger: "Personal data potentially exposed"
        escalate_to: ["Legal (Covenant)", "Strategy (Giuseppe)"]
        level: "L3 - Urgent"
        preset: "incident-war-room"

      - trigger: "Critical vulnerability in production"
        escalate_to: ["BMM (Architect)"]
        level: "L2 - Advisory"

      - trigger: "Active attack detected"
        escalate_to: ["Legal", "Strategy", "Intel"]
        level: "L4 - Crisis"
        preset: "crisis-response-party"

    from_legal:
      - trigger: "Litigation threat received"
        escalate_to: ["Strategy (Giuseppe)"]
        level: "L3 - Urgent"
        preset: "litigation-war-room"

      - trigger: "Regulatory inquiry received"
        escalate_to: ["Cybersec (Sentinel)", "Strategy"]
        level: "L3 - Urgent"

      - trigger: "Contract with security implications"
        escalate_to: ["Cybersec (Sentinel)"]
        level: "L2 - Advisory"
        preset: "contract-review-party"

    from_strategy:
      - trigger: "Major strategic decision with security implications"
        escalate_to: ["Cybersec (Bastion)", "Legal (Covenant)"]
        level: "L2 - Advisory"
        preset: "strategic-decision-validated"

      - trigger: "Crisis with multiple dimensions"
        escalate_to: ["Cybersec", "Legal", "Intel"]
        level: "L4 - Crisis"
        preset: "crisis-response-party"

    from_intel:
      - trigger: "Credible threat targeting organization"
        escalate_to: ["Cybersec (Phoenix)"]
        level: "L3 - Urgent"
        preset: "threat-ecosystem-party"

      - trigger: "Attribution with legal implications"
        escalate_to: ["Legal (Covenant)"]
        level: "L2 - Advisory"

  template: |
    ## Escalation Notice

    **From:** [Module/Agent]
    **To:** [Module/Agent(s)]
    **Level:** [L1-L4]
    **Timestamp:** [datetime]

    **Trigger:** [what triggered escalation]
    **Context:** [brief background]
    **Action Requested:** [what is needed]
    **Response Deadline:** [when]

    **Recommended Party Mode Preset:** [if applicable]

# ═══════════════════════════════════════════════════════════════════════════
# EVIDENCE STANDARDS FRAMEWORK
# Standards for evidence that may be used in legal proceedings
# ═══════════════════════════════════════════════════════════════════════════

evidence_standards:

  name: "Legal-Grade Evidence Standards"
  description: "Standards for documentation that may be needed in legal proceedings"

  principles:
    - "Contemporaneous documentation (recorded at time of occurrence)"
    - "Immutability (tamper-evident, timestamped)"
    - "Chain of custody (who handled, when, where)"
    - "Completeness (full context, not cherry-picked)"
    - "Authenticity (verifiable source)"

  requirements_by_type:

    incident_evidence:
      required_elements:
        - "Timestamps (UTC with timezone noted)"
        - "Actor identification (user, system, external)"
        - "Action taken"
        - "Evidence hash (SHA-256)"
        - "Collector identification"
        - "Collection method"
        - "Storage location"
      chain_of_custody:
        required: true
        format: "custody-log.md"

    communications_evidence:
      required_elements:
        - "Complete thread (not excerpts)"
        - "Sender/recipient identification"
        - "Timestamps"
        - "Delivery confirmation (if available)"
        - "Attachment inventory"
      preservation:
        - "Original format preservation"
        - "Metadata preservation"
        - "Legal hold notification"

    decision_evidence:
      required_elements:
        - "Decision description"
        - "Participants/decision makers"
        - "Information considered"
        - "Alternatives evaluated"
        - "Rationale for decision"
        - "Approval chain"
      formats:
        - "Decision brief (strategy)"
        - "Meeting minutes"
        - "Approval records"

    compliance_evidence:
      required_elements:
        - "Control description"
        - "Testing methodology"
        - "Test results with timestamps"
        - "Tester identification"
        - "Exception documentation"
        - "Remediation tracking"
      retention: "Per compliance framework requirements"

  template: |
    ## Evidence Documentation

    **Evidence ID:** [unique identifier]
    **Type:** [incident/communications/decision/compliance]
    **Created:** [timestamp UTC]
    **Created By:** [collector name/role]

    ### Description
    [What this evidence contains]

    ### Collection Method
    [How this was collected]

    ### Chain of Custody
    | Timestamp | Custodian | Action | Location |
    |-----------|-----------|--------|----------|
    | [time] | [name] | [action] | [location] |

    ### Integrity
    **Hash (SHA-256):** [hash]
    **Storage Location:** [path]
    **Access Controls:** [who can access]

    ### Legal Considerations
    **Privilege:** [Y/N - type if Y]
    **Legal Hold:** [Y/N - if Y, reference hold]
    **Disclosure Restrictions:** [any restrictions]

# ═══════════════════════════════════════════════════════════════════════════
# CROSS-MODULE APPROVAL FRAMEWORK
# Multi-domain approval workflows
# ═══════════════════════════════════════════════════════════════════════════

approval_framework:

  name: "Cross-Module Approval Framework"
  description: "Approval workflows requiring sign-off from multiple modules"

  approval_types:

    security_release_approval:
      description: "Approval for releasing product/feature with security implications"
      required_approvers:
        - module: "cybersec-team"
          agent: "security-architect"
          criteria: "Security review complete, no critical findings"
        - module: "legal-team"
          agent: "counsel"
          criteria: "Compliance requirements met"
          conditional: "If personal data involved"
        - module: "bmm"
          agent: "tea"
          criteria: "Testing complete, acceptance criteria met"
      escalation: "If any approver objects, escalate to executive sponsor"

    public_statement_approval:
      description: "Approval for external communications during incident/crisis"
      required_approvers:
        - module: "legal-team"
          agent: "counsel"
          criteria: "Legal review complete, no liability issues"
        - module: "strategy-team"
          agent: "communications-director"
          criteria: "Messaging aligned with strategy"
        - module: "cybersec-team"
          agent: "incident-commander"
          criteria: "Technical accuracy verified"
          conditional: "If security incident"
      timing: "All approvals before any external release"

    vendor_security_approval:
      description: "Approval for vendors with access to sensitive data/systems"
      required_approvers:
        - module: "cybersec-team"
          agent: "compliance-guardian"
          criteria: "Security assessment complete"
        - module: "legal-team"
          agent: "counsel"
          criteria: "Contract includes required security terms"
        - module: "strategy-team"
          agent: "policy-analyst"
          criteria: "Aligned with vendor management policy"
          conditional: "If policy requires"

    attribution_publication_approval:
      description: "Approval for publishing threat actor attribution"
      required_approvers:
        - module: "intel-team"
          agent: "osint-lead"
          criteria: "Attribution confidence meets threshold"
        - module: "strategy-team"
          agent: "debate-coach"
          criteria: "Attribution logic validated"
        - module: "legal-team"
          agent: "counsel"
          criteria: "Legal implications assessed"
        - module: "strategy-team"
          agent: "political-strategist"
          criteria: "Geopolitical implications considered"

  template: |
    ## Cross-Module Approval Request

    **Request ID:** [unique identifier]
    **Approval Type:** [type]
    **Requested By:** [name/module]
    **Request Date:** [date]
    **Decision Deadline:** [date]

    ### Request Description
    [What is being requested for approval]

    ### Supporting Documentation
    - [Document 1]
    - [Document 2]

    ### Required Approvals

    | Module | Agent | Status | Date | Comments |
    |--------|-------|--------|------|----------|
    | [module] | [agent] | [Pending/Approved/Rejected] | [date] | [comments] |

    ### Approval Status
    **Overall Status:** [Pending/Approved/Rejected/Escalated]
    **Escalation Required:** [Y/N - reason if Y]

# ═══════════════════════════════════════════════════════════════════════════
# CONFLICT RESOLUTION FRAMEWORK
# Resolving disagreements between modules
# ═══════════════════════════════════════════════════════════════════════════

conflict_resolution:

  name: "Cross-Module Conflict Resolution"
  description: "Framework for resolving disagreements between modules"

  resolution_approaches:

    timeline_conflict:
      description: "When modules have competing timeline requirements"
      approach: "Risk-based prioritization"
      mediator: "Abdul (Project Manager)"
      resolution_steps:
        1: "Document each module's timeline requirement and rationale"
        2: "Identify dependencies and critical path"
        3: "Assess risk of each timeline option"
        4: "Propose parallel execution if possible"
        5: "Escalate to executive if unresolvable"

    priority_conflict:
      description: "When modules have competing priorities"
      approach: "Strategic alignment"
      mediator: "Strategy Team (Sun Tzu)"
      resolution_steps:
        1: "Map priorities to strategic objectives"
        2: "Assess trade-offs of each priority"
        3: "Identify win-win options"
        4: "If zero-sum, escalate for executive decision"

    resource_conflict:
      description: "When multiple modules need same resource"
      approach: "Time-slicing and delegation"
      mediator: "Abdul (Project Manager)"
      resolution_steps:
        1: "Quantify resource requirements from each module"
        2: "Explore delegation or alternative resources"
        3: "Propose time-slicing if single resource required"
        4: "Prioritize based on urgency and impact"

    technical_conflict:
      description: "When modules disagree on technical approach"
      approach: "Evidence-based evaluation"
      mediator: "Party Mode with affected experts"
      resolution_steps:
        1: "Each party presents their approach with evidence"
        2: "Identify evaluation criteria"
        3: "Proof of concept if feasible"
        4: "Expert panel recommendation"

    compliance_conflict:
      description: "When compliance requirement conflicts with business need"
      approach: "Risk acceptance or compensating control"
      mediator: "Legal Team (Covenant)"
      resolution_steps:
        1: "Document compliance requirement and rationale"
        2: "Document business need and impact"
        3: "Explore compensating controls"
        4: "If no alternative, formal risk acceptance process"
        5: "Document decision and accountability"

  template: |
    ## Conflict Resolution Record

    **Conflict ID:** [identifier]
    **Type:** [timeline/priority/resource/technical/compliance]
    **Parties:** [modules involved]
    **Mediator:** [agent/module]

    ### Conflict Description
    [What is the disagreement]

    ### Position A ([Module])
    [Their position and rationale]

    ### Position B ([Module])
    [Their position and rationale]

    ### Resolution Process
    [Steps taken to resolve]

    ### Resolution Outcome
    **Decision:** [what was decided]
    **Trade-offs Accepted:** [what each party gave up]
    **Risks Acknowledged:** [risks of this decision]

    ### Accountability
    **Decision Made By:** [who]
    **Accountability For Outcome:** [who]
    **Review Date:** [when to revisit]
