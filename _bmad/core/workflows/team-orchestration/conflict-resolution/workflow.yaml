# Conflict Resolution Workflow
name: conflict-resolution
description: "Resolve conflicts between modules or teams during orchestration"
author: "BMad"

# Critical variables from config
config_source: "{project-root}/_bmad/core/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/_bmad/core/workflows/team-orchestration/conflict-resolution"
instructions: "{installed_path}/instructions.md"

# Party mode for discussion
party_mode_workflow: "{project-root}/_bmad/core/workflows/party-mode/workflow.md"

# Conflict types and resolution strategies
conflict_types:
  timeline:
    description: "Competing deadlines or timeline pressures"
    example: "GDPR 72-hour notification vs investigation needs"
    default_escalation: "strategy-team"

  priority:
    description: "Competing priorities between teams"
    example: "Security wants blocking fix, business wants feature first"
    default_escalation: "strategic-decision-workshop"

  resource:
    description: "Same resource needed by multiple teams"
    example: "Security architect needed for review AND incident"
    default_escalation: "abdul"

  technical:
    description: "Disagreement on technical approach"
    example: "Architecture decision with security implications"
    default_escalation: "party-mode"

  compliance:
    description: "Compliance requirement vs business need"
    example: "Data retention vs storage costs"
    default_escalation: "legal-team"

standalone: true
