        name: "John"
        role: "Product owner - feature completeness and customer impact"
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security architecture - validates security design"
      - module: cybersec-team
        agent: penetration-tester
        name: "Ghost"
        role: "Offensive security - validates through testing"
      - module: bmm
        agent: tea
        name: "Murat"
        role: "Quality assurance - test coverage validation"
    artifacts_needed:
      - "architecture.md"
      - "security-review-findings.md"
      - "test-reports/"
    expected_outputs:
      - "security-launch-approval.md"
      - "known-issues.md"
      - "security-recommendations.md"

  # Legal Risk Assessment
  legal-risk-team:
