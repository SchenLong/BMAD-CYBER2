# ═══════════════════════════════════════════════════════════════════════════
  # NEW PRESETS FROM PARTY MODE DISCUSSION (Jan 2025)
  # Identified through structured debate: Abdul, Bastion, Winston, Covenant, Cicero
  # Criteria: Documented failure mode + 3+ domains + ad-hoc would miss key perspective
  # ═══════════════════════════════════════════════════════════════════════════

  # Security-Aware Architecture Workshop
  secure-architecture-workshop:
    name: "Security-Aware Architecture Workshop"
    description: "Multi-perspective security and architecture design review - shift-left security"
    use_when: "New system architecture, major refactoring, or security-critical design decisions"
    recommended_for:
      - "Greenfield architecture design"
      - "Major system refactoring"
      - "Security-critical feature design"
      - "Cloud migration architecture"
      - "Integration architecture with external systems"
    failure_mode_addressed: "Security vulnerabilities discovered late in development when costly to fix"
    agents:
      - module: bmm
        agent: architect
        name: "Winston"
        role: "Technical architecture ownership - design presentation and trade-offs"
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security design validation - defense-in-depth review"
      - module: cybersec-team
        agent: threat-analyst
        name: "Cipher"
        role: "Threat landscape context - real-world attack mapping"
      - module: strategy-team
        agent: debate-coach
        name: "Cicero"
        role: "Challenge assumptions - rigorous design validation"
    artifacts_needed:
      - "architecture.md (draft or initial)"
      - "prd.md (for context)"
    expected_outputs:
      - "security-validated-architecture.md"
      - "threat-model.yaml"
      - "security-requirements.md"
      - "design-assumptions-challenged.md"

  # Technology Stack Evaluation Board
  tech-stack-evaluation-board:
    name: "Technology Stack Evaluation Board"
    description: "Multi-domain technology selection review - prevent technology regret"
    use_when: "Technology selection, framework adoption, infrastructure decisions, or major dependency additions"
    recommended_for:
      - "Framework or language selection"
      - "Database technology decisions"
      - "Cloud provider evaluation"
      - "Major library or SDK adoption"
      - "Build vs buy evaluations"
      - "Open source adoption with licensing implications"
    failure_mode_addressed: "Technology choices that optimize for features but miss security, legal, or long-term implications"
    agents:
      - module: bmm
        agent: architect
        name: "Winston"
        role: "Architecture fit and long-term maintainability assessment"
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security implications - vulnerability history, security model"
      - module: legal-team
        agent: covenant
        name: "Covenant"
        role: "Licensing and compliance - GPL, AGPL contamination, export controls"
      - module: strategy-team
        agent: debate-coach
        name: "Cicero"
        role: "Challenge assumptions - vendor lock-in, hidden costs"
    artifacts_needed:
      - "tech-options.md (candidates being evaluated)"
      - "requirements.md (what you need)"
    expected_outputs:
      - "tech-selection-decision.md"
      - "license-compliance-review.md"
      - "security-assessment.md"
      - "total-cost-analysis.md"

  # Production Readiness Review (Generalized)
  production-readiness-review:
    name: "Production Readiness Review"
    description: "Cross-functional launch readiness validation for any product or service"
    use_when: "Product launch, major release, or public-facing deployment"
    recommended_for:
      - "SaaS product launches"
      - "API public release"
      - "Mobile app store submission"
      - "Major feature releases"
      - "Customer-facing service deployments"
    failure_mode_addressed: "Launches that miss legal, compliance, or quality gates causing post-launch crises"
    agents:
      - module: legal-team
        agent: counsel
        name: "Counsel"
        role: "Legal and compliance clearance - ToS, privacy policy, regulatory"
      - module: strategy-team
        agent: communications-director
        name: "Giuseppe"
        role: "Launch messaging and crisis prep - communications readiness"
      - module: cybersec-team
        agent: compliance-guardian
        name: "Sentinel"
        role: "Security and compliance verification - control validation"
      - module: bmm
        agent: tea
        name: "Murat"
        role: "Quality and testing validation - release criteria"
    artifacts_needed:
      - "release-notes.md"
      - "test-reports/"
      - "security-review.md"
    expected_outputs:
      - "launch-approval.md"
      - "known-issues.md"
      - "rollback-plan.md"
      - "post-launch-monitoring.md"

  # Game Launch Review (Specialized)
  game-launch-review:
    name: "Game Launch Review"
    description: "Game-specific production readiness with regulatory and monetization focus"
    use_when: "Game launch preparation, especially with monetization, multiplayer, or UGC features"
    recommended_for:
      - "Mobile games with in-app purchases"
      - "Games with loot box mechanics"
      - "Multiplayer game launches"
      - "Games with user-generated content"
      - "Cross-platform game releases"
      - "Games targeting regulated markets (EU, China, etc.)"
    failure_mode_addressed: "Game launches that violate regional regulations or miss age rating requirements"
    agents:
      - module: bmgd
        agent: game-qa
        name: "GLaDOS"
        role: "Gameplay quality and stability - certification readiness"
      - module: legal-team
        agent: counsel
        name: "Counsel"
        role: "ToS, age ratings, regional compliance - PEGI, ESRB, regulatory"
      - module: strategy-team
        agent: communications-director
        name: "Giuseppe"
        role: "Launch messaging strategy - community and press"
      - module: bmgd
        agent: game-scrum-master
        name: "Max"
        role: "Release coordination - milestone tracking"
    artifacts_needed:
      - "gdd.md"
      - "monetization-design.md (if applicable)"
      - "test-reports/"
    expected_outputs:
      - "game-launch-checklist.md"
      - "regulatory-compliance-review.md"
      - "launch-communications-plan.md"
      - "post-launch-monitoring.md"

# ═══════════════════════════════════════════════════════════════════════════
  # STRATEGIC WORKFLOW CROSS-MODULE PRESETS (Jan 2025)
  # Identified through Creative Council analysis of strategy-team workflows
  # These presets support the new cross-module optional steps in strategy workflows
  # ═══════════════════════════════════════════════════════════════════════════

  # Strategic Intelligence Council - For Competitive Warfare workflow
  strategic-intelligence-council:
    name: "Strategic Intelligence Council"
    description: "Cross-module intelligence integration for strategic warfare and competitive analysis"
    use_when: "Deep competitor analysis requiring professional intelligence capabilities"
    recommended_for:
      - "Competitive warfare campaigns"
      - "Major competitor threat assessment"
      - "Market intelligence synthesis"
      - "Strategic positioning decisions"
    failure_mode_addressed: "Strategic assumptions not verified, competitor blind spots leading to failed campaigns"
    agents:
      - module: intel-team
        agent: osint-lead
        name: "Vector"
        role: "Intelligence synthesis - coordinate overall intelligence picture"
      - module: intel-team
        agent: threat-actor-profiler
        name: "Dossier"
        role: "Leadership profiling - behavioral patterns and decision-making analysis"
      - module: intel-team
        agent: corporate-intel-specialist
        name: "Proxy"
        role: "Corporate intelligence - financial, ownership, and organizational mapping"
      - module: intel-team
        agent: social-media-analyst
        name: "Echo"
        role: "Communications analysis - public messaging and sentiment"
      - module: strategy-team
        agent: the-master-strategist
        name: "Sun Tzu"
        role: "Strategic integration - translate intelligence into strategic action"
    artifacts_needed:
      - "competitive-warfare-{campaign}.md (in progress)"
      - "enemy-analysis.md (from Step 2)"
    expected_outputs:
      - "osint-assessment.md"
      - "leadership-profiles.md"
      - "corporate-intelligence.md"
      - "intelligence-synthesis.md"

  # M&A Diligence Board - For M&A Due Diligence workflow
  m-and-a-diligence-board:
    name: "M&A Due Diligence Board"
    description: "Multi-domain due diligence for acquisition evaluation - security, legal, and strategic"
    use_when: "M&A due diligence requiring comprehensive risk assessment across domains"
    recommended_for:
      - "Technology company acquisitions"
      - "Companies with significant IP or data assets"
      - "Acquisitions with regulatory implications"
      - "Targets in cybersecurity or sensitive industries"
    failure_mode_addressed: "M&A blind spots in security, compliance, or legal leading to value destruction post-acquisition"
    agents:
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security due diligence - architecture, vulnerabilities, incident history"
      - module: cybersec-team
        agent: compliance-guardian
        name: "Sentinel"
        role: "Compliance due diligence - framework alignment, audit findings"
      - module: legal-team
        agent: counsel
        name: "Covenant"
        role: "Legal due diligence - contracts, IP, litigation, regulatory"
      - module: strategy-team
        agent: the-master-strategist
        name: "Sun Tzu"
        role: "Strategic synthesis - integrate findings into deal recommendations"
    artifacts_needed:
      - "due-diligence-{target}.md (in progress)"
      - "operational-diligence.md (from Step 4)"
    expected_outputs:
      - "security-diligence-report.md"
      - "compliance-diligence-report.md"
      - "legal-diligence-report.md"
      - "value-at-risk-assessment.md"
      - "deal-recommendations.md"

  # Board Presentation Validation - For Board Presentation Prep workflow
  board-presentation-validation:
    name: "Board Presentation Validation"
    description: "Cross-module validation of board presentation content before delivery"
    use_when: "Board presentations requiring validation to avoid embarrassment or legal exposure"
    recommended_for:
      - "Presentations with technology or security claims"
      - "Presentations involving market analysis or competitive intelligence"
      - "Presentations with financial projections or commitments"
      - "Presentations discussing regulatory or compliance matters"
    failure_mode_addressed: "Board presentations with indefensible claims, legal exposure, or security misrepresentations"
    agents:
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security claims review - validate accuracy of security statements"
      - module: legal-team
        agent: counsel
        name: "Covenant"
        role: "Legal exposure review - identify liability and compliance issues"
      - module: strategy-team
        agent: policy-analyst
        name: "Augustus"
        role: "Evidence quality review - assess defensibility of claims"
      - module: intel-team
        agent: osint-lead
        name: "Vector"
        role: "Intelligence validation - verify market and competitive claims"
    artifacts_needed:
      - "presentation-outline-{topic}.md (in progress)"
      - "archetype-review.md (from Step 5)"
    expected_outputs:
      - "validation-summary.md"
      - "required-adjustments.md"
      - "additional-qa-prep.md"
      - "risk-score.md"

  # Policy Validation Board - For Policy Development workflow
  policy-validation-board:
    name: "Policy Validation Board"
    description: "Cross-module security and legal validation for policy enforceability and compliance"
    use_when: "Policy development requiring validation before final drafting"
    recommended_for:
      - "Policies affecting data handling, privacy, or information security"
      - "Policies creating compliance or regulatory obligations"
      - "Policies involving access controls, authentication, or authorization"
      - "Policies with employment law implications"
    failure_mode_addressed: "Policies that are unenforceable, create legal exposure, or have security gaps"
    agents:
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security impact assessment - enforcement and vulnerability review"
      - module: cybersec-team
        agent: compliance-guardian
        name: "Sentinel"
        role: "Compliance framework mapping - audit and regulatory alignment"
      - module: legal-team
        agent: counsel
        name: "Covenant"
        role: "Legal enforceability review - employment law and liability"
      - module: strategy-team
        agent: ethics-advisor
        name: "Sophia"
        role: "Ethics-legal synthesis - balance compliance with fairness"
    artifacts_needed:
      - "policy-{name}.md (in progress)"
      - "reform-perspective.md (from Step 5)"
    expected_outputs:
      - "security-review.md"
      - "compliance-mapping.md"
      - "legal-enforceability.md"
      - "ethics-legal-alignment.md"
      - "policy-readiness-assessment.md"

  # Decision Retrospective Board - For learning from past decisions
  decision-retrospective-board:
    name: "Decision Retrospective Board"
    description: "Multi-perspective review of past strategic decisions for organizational learning"
    use_when: "Reviewing past decisions to extract lessons and improve future decision-making"
    recommended_for:
      - "Post-project retrospectives"
      - "Annual strategic reviews"
      - "After major initiatives succeed or fail"
      - "Leadership development and coaching"
    failure_mode_addressed: "Organizations repeating strategic mistakes due to lack of structured learning"
    agents:
      - module: strategy-team
        agent: the-master-strategist
        name: "Sun Tzu"
        role: "Strategic analysis - evaluate decision quality and alternatives not taken"
      - module: strategy-team
        agent: debate-coach
        name: "Cicero"
        role: "Argument reconstruction - challenge original reasoning"
      - module: strategy-team
        agent: ethics-advisor
        name: "Sophia"
        role: "Values alignment - assess ethical dimensions of decisions"
      - module: strategy-team
        agent: policy-analyst
        name: "Augustus"
        role: "Evidence review - what was known vs. what should have been known"
    artifacts_needed:
      - "decision-brief.md (original decision)"
      - "outcomes-summary.md (what actually happened)"
    expected_outputs:
      - "decision-retrospective.md"
      - "lessons-learned.md"
      - "decision-framework-improvements.md"

