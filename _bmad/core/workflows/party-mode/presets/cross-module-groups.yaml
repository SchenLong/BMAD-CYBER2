# Cross-Module Party Mode Presets
# Pre-configured agent groups for common multi-module scenarios
# Used by Abdul for quick team assembly and Party Mode for preset invocation

version: "1.0"
description: "Cross-module agent groups for structured team collaboration"

presets:

  # Security & Architecture Review
  security-review-team:
    name: "Security Review Team"
    description: "Architecture and security assessment - review system design for security posture"
    use_when: "Reviewing system architecture for security vulnerabilities and design flaws"
    recommended_for:
      - "Architecture review before implementation"
      - "Security assessment of existing systems"
      - "Threat modeling sessions"
    agents:
      - module: bmm
        agent: architect
        name: "Winston"
        role: "Technical architecture owner - presents the design"
      - module: cybersec-team
        agent: security-architect
        name: "Bastion"
        role: "Security design review - identifies vulnerabilities"
      - module: cybersec-team
        agent: threat-analyst
        name: "Cipher"
        role: "Threat intelligence context - maps to real-world threats"
    artifacts_needed:
      - "architecture.md"
      - "prd.md (optional)"
    expected_outputs:
      - "security-review-findings.md"
      - "threat-model.yaml"

  # Incident Response War Room
  incident-war-room:
    name: "Incident Response War Room"
    description: "Coordinated incident response team for security incidents requiring multi-domain expertise"
    use_when: "Active security incident requiring coordinated response across technical, legal, and communications"
    recommended_for:
      - "Data breaches"
      - "Ransomware attacks"
      - "Significant security incidents"
      - "Any incident with regulatory implications"
    agents:
      - module: cybersec-team
        agent: incident-commander
        name: "Phoenix"
        role: "Lead incident response - coordinates technical containment"
      - module: intel-team
        agent: osint-lead
        name: "Vector"
        role: "Attribution and intelligence - identifies threat actors"
      - module: strategy-team
        agent: communications-director
        name: "Giuseppe"
        role: "External communications - manages stakeholder messaging"
      - module: legal-team
        agent: counsel
        name: "Counsel"
        role: "Legal obligations - ensures regulatory compliance"
    artifacts_needed:
      - "incident-summary.md (created during session)"
      - "iocs.yaml (if available)"
    expected_outputs:
      - "incident-response-plan.md"
      - "attribution-report.md"
      - "notification-timeline.md"
      - "communications-plan.md"
    timeline_constraints:
      - "GDPR: 72-hour notification deadline"
      - "HIPAA: 60-day notification deadline"
      - "PCI-DSS: Immediate card brand notification"

  # Compliance Audit Team
  compliance-audit-team:
    name: "Compliance Audit Team"
    description: "Multi-domain compliance review for audit preparation or regulatory assessment"
    use_when: "Preparing for compliance audit or assessing regulatory posture"
    recommended_for:
      - "SOC 2 audit preparation"
      - "GDPR compliance assessment"
      - "PCI-DSS certification"
      - "HIPAA compliance review"
    agents:
      - module: legal-team
        agent: europa
        name: "Europa"
        role: "GDPR/privacy compliance - EU regulatory expertise"
      - module: cybersec-team
        agent: compliance-guardian
        name: "Sentinel"
        role: "Security controls - technical compliance verification"
      - module: bmm
        agent: tea
        name: "Murat"
        role: "Testing/evidence - validates control implementation"
    artifacts_needed:
      - "architecture.md"
      - "security-controls.yaml (if exists)"
    expected_outputs:
      - "compliance-gap-analysis.md"
      - "control-mapping.yaml"
      - "audit-readiness-report.md"

  # Strategic Advisory Board
  strategic-advisors:
    name: "Strategic Advisory Board"
    description: "High-stakes decision making with multi-perspective analysis"
    use_when: "Major strategic decisions requiring executive-level analysis"
    recommended_for:
      - "Build vs Buy decisions"
      - "M&A evaluation"
      - "Market entry decisions"
      - "Major product pivots"
      - "Organizational restructuring"
    agents:
      - module: strategy-team
        agent: the-master-strategist
        name: "Sun Tzu"
        role: "Strategic framework - competitive positioning and long-term strategy"
      - module: strategy-team
        agent: political-strategist
        name: "Magnus"
        role: "Stakeholder dynamics - political landscape and coalition building"
      - module: legal-team
        agent: counsel
        name: "Counsel"
        role: "Legal guardrails - risk assessment and liability"
      - module: bmm
        agent: pm
        name: "John"
        role: "Product perspective - market fit and execution feasibility"
    artifacts_needed:
      - "market-research.md (if available)"
      - "strategic-options.md (if available)"
    expected_outputs:
      - "decision-brief.md"
      - "risk-assessment.md"
      - "implementation-roadmap.md"

  # Game Launch Team
  game-launch-team:
    name: "Game Launch Team"
    description: "Multiplayer/monetization launch review for game releases"
    use_when: "Preparing for game launch with monetization or multiplayer features"
    recommended_for:
      - "Games with in-app purchases"
      - "Multiplayer game launches"
      - "Games with user-generated content"
      - "Cross-platform releases"
    agents:
      - module: bmgd
        agent: game-designer
        name: "Samus Shepard"
        role: "Gameplay experience - player journey and engagement"
      - module: legal-team
        agent: counsel
        name: "Counsel"
        role: "ToS and regulatory - EULA, age ratings, loot box compliance"
      - module: strategy-team
        agent: communications-director
        name: "Giuseppe"
        role: "Launch messaging - marketing and community management"
    artifacts_needed:
      - "gdd.md"
      - "monetization-strategy.md (if exists)"
    expected_outputs:
      - "launch-readiness-checklist.md"
      - "legal-compliance-review.md"
      - "launch-communications-plan.md"

  # Threat Intelligence Fusion
  threat-intel-fusion:
