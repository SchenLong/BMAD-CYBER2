        name: "Vector"
        role: "Intelligence fusion - coordinates multi-source analysis"
      - module: intel-team
        agent: threat-actor-profiler
        name: "Dossier"
        role: "Actor profiling - behavioral patterns and attribution"
      - module: cybersec-team
        agent: threat-analyst
        name: "Cipher"
        role: "Technical threat analysis - malware and TTP mapping"
      - module: cybersec-team
        agent: forensic-investigator
        name: "Trace"
        role: "Digital forensics - evidence collection and chain of custody"
    artifacts_needed:
      - "iocs.yaml"
      - "incident-summary.md (if post-incident)"
    expected_outputs:
      - "threat-actor-profile.md"
      - "attribution-assessment.md"
      - "threat-constellation.yaml"

  # Product Security Launch
  product-security-launch:
    name: "Product Security Launch"
    description: "Security validation for product release readiness"
    use_when: "Final security validation before product launch"
    recommended_for:
      - "Pre-release security review"
      - "Security certification preparation"
      - "Customer-facing product launches"
    agents:
