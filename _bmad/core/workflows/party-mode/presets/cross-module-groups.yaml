      - module: legal-team
        agent: advocate
        name: "Advocate"
        role: "Dispute risk - litigation and liability assessment"
      - module: strategy-team
        agent: policy-analyst
        name: "Augustus"
        role: "Policy analysis - regulatory landscape and trends"
    artifacts_needed:
      - "initiative-brief.md"
      - "market-analysis.md (if available)"
    expected_outputs:
      - "legal-risk-assessment.md"
      - "jurisdiction-analysis.md"
      - "risk-mitigation-plan.md"

