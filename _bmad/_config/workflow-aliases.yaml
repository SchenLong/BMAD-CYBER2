# =============================================================================
# RESERVED NAMES BLOCKLIST
# =============================================================================
# These MUST NOT be used as aliases (VULN-008, Ghost Command Injection)
# Collision with security validators could bypass security guards.
# Any attempt to register an alias matching a reserved name MUST be rejected.

reserved_names:
  # Security validator entry points (from .claude/validators-node/bin/)
  - anomaly-detector
  - archival-cli
  - audit-integrity
  - bash-safety
  - confidence-tracker
  - context-manager
  - env-protection
  - jailbreak
  - outside-repo
  - pii
  - plugin-permissions
  - production
  - prompt-injection
  - rate-limiter
  - recursion-guard
  - resource-limits
  - secret
  - session-init
  - settings-integrity
  - supply-chain
  - telemetry
  - token-validator
  # System commands (prevent hijacking built-in commands)
  - help
  - bmad-help
  - clear
  - exit
  - status
  # BMAD core agent names (prevent confusion between agents and workflows)
  - abdul
  - bmad-master

# =============================================================================
# INPUT VALIDATION RULES
# =============================================================================
# All alias names MUST pass these checks before resolution.

validation:
  # Alias name pattern: lowercase alphanumeric, hyphens, colons allowed mid-string
  pattern: "^[a-z0-9][a-z0-9:-]*[a-z0-9]$"
  max_length: 100
  min_length: 2

