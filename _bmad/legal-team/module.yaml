# Legal Team Module Configuration
# This file defines installation questions and module configuration values

code: "legal-team"
name: "Legal Team - Multi-Jurisdictional Legal Advisory"
default_selected: false

# Welcome message shown during installation
prompt:
  - "Legal Team Module Installation"
  - ""
  - "This module provides 13 specialized legal advisors:"
  - ""
  - "  Core Legal Team (Phase 1):"
  - "  - Counsel (General Counsel - Director & Routing)"
  - "  - Liberty (US Corporate & Civil Law)"
  - "  - Europa (EU Law & Cross-Border)"
  - "  - Castile (Spanish Corporate Law)"
  - "  - Covenant (Contract Specialist)"
  - "  - Advocate (Litigation Strategist)"
  - "  - Tribute (Tax Counsel)"
  - ""
  - "  Extended Team (Phase 2):"
  - "  - Iberia (Spanish Civil Law)"
  - "  - Gremio (Spanish Labor Law)"
  - "  - Baltic (Estonian Corporate Law)"
  - "  - Charter (Corporate Governance)"
  - "  - Insignia (IP Counsel)"
  - "  - Deed (Real Estate/Property)"
  - ""
  - "Jurisdictions: USA, EU, Spain (deep), Estonia"
  - "Scope: Corporate + Civil matters (NO criminal law)"
  - ""
  - "14 legal workflows for contracts, disputes, tax planning, and more."

# Core config values are automatically inherited from installer:
## user_name
## communication_language
## document_output_language

# ============================================================================
# CONFIGURATION FIELDS
# ============================================================================
# Each field can be:
# 1. INTERACTIVE (has 'prompt' - asks user during installation)
# 2. STATIC (no 'prompt' - just uses 'result' value)
# ============================================================================

# INTERACTIVE: Primary output location
output_folder:
  prompt: "Where should Legal Team save documents and reports?"
  default: "_bmad-output/legal-team"
  result: "{project-root}/{value}"

# INTERACTIVE: Primary jurisdiction (default routing)
primary_jurisdiction:
  prompt: "What is your primary jurisdiction?"
  default: "es"
  result: "{value}"
  single-select:
    - value: "es"
      label: "Spain - Spanish law as primary focus"
    - value: "us"
      label: "United States - US federal/state law focus"
    - value: "eu"
      label: "European Union - General EU law focus"
    - value: "ee"
      label: "Estonia - Estonian corporate/digital focus"

# INTERACTIVE: Detail level for outputs
detail_level:
  prompt: "How detailed should legal analysis be?"
  default: "standard"
  result: "{value}"
  single-select:
    - value: "brief"
      label: "Brief - Executive summary only"
    - value: "standard"
      label: "Standard - Balanced analysis"
    - value: "comprehensive"
      label: "Comprehensive - Full legal memorandum style"

# STATIC: Module identification
module_code:
  result: "legal-team"

module_version:
  result: "1.0.0"

# STATIC: Module paths
agents_path:
  result: "{project-root}/_bmad/legal-team/agents"

workflows_path:
  result: "{project-root}/_bmad/legal-team/workflows"

# STATIC: Automatic subdirectory configuration
contracts_output:
  result: "{output_folder}/contracts"

legal_memos:
  result: "{output_folder}/memos"

compliance_reports:
  result: "{output_folder}/compliance"

# STATIC: Legal disclaimer mode (always enabled - non-negotiable)
disclaimer_mode:
  result: "enabled"

# STATIC: Disclaimer text to include in all outputs
disclaimer_text:
  result: |
    DISCLAIMER: This analysis is provided for informational purposes only and does not
    constitute legal advice. The Legal Team module provides general legal information and
    guidance but is not a substitute for consultation with a qualified attorney. No
    attorney-client relationship is created through use of this module. For specific legal
    matters, please consult with a licensed attorney in the relevant jurisdiction.
