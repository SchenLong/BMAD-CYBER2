# Intel-Team Module Configuration
# Module for intelligence collection and analysis operations

module_name: intel-team
full_name: Intelligence Team Module
version: 1.0.0
created_date: 2026-01-12
status: production

# Project Configuration
project_name: BMAD-INTEL
output_folder: "{project-root}/_output/intel-team"
bmb_creations_output_folder: "{project-root}/_bmad-output/bmb-creations"

# User Configuration
user_name: User
communication_language: English
document_output_language: English

# Module Paths
module_root: "{project-root}/_bmad/intel-team"
workflows_path: "{project-root}/_bmad/intel-team/workflows"
agents_path: "{project-root}/_bmad/intel-team/agents"

# Workflow Registry
workflows:
  - name: flash-assessment
    full_name: Flash Assessment
    path: workflows/flash-assessment
    type: linear
    status: production
    version: 1.0.0
    description: Rapid 15-minute OSINT triage providing immediate hits, exposures, and risk assessment

  - name: campaign-planner-person
    full_name: Campaign Planner (Person)
    path: workflows/campaign-planner-person
    type: linear
    status: production
    version: 1.0.0
    description: Systematic OSINT campaign planning for investigating an individual

  - name: campaign-planner-org
    full_name: Campaign Planner (Organization)
    path: workflows/campaign-planner-org
    type: linear
    status: production
    version: 1.0.0
    description: Comprehensive OSINT campaign planning for corporate, government, or organizational entities

  - name: campaign-ai
    full_name: Campaign Planner (AI)
    path: workflows/campaign-ai
    type: linear
    status: production
    version: 1.0.0
    description: OSINT Campaign Planning for AI Systems, Models, Companies & Entities

  - name: operation-mosaic
    full_name: Operation Mosaic
    path: workflows/operation-mosaic
    type: linear
    status: production
    version: 1.0.0
    description: Full spectrum target package using all 11 agents in coordinated intelligence collection and analysis

  - name: spider-web
    full_name: Spider Web
    path: workflows/spider-web
    type: linear
    status: production
    version: 1.0.0
    description: Network mapping and expansion - start with single node, systematically expand connections

  - name: breach-archaeology
    full_name: Breach Archaeology
    path: workflows/breach-archaeology
    type: linear
    status: production
    version: 1.0.0
    description: Comprehensive data exposure assessment across all breach sources with timeline and risk scoring

  - name: infrastructure-genealogy
    full_name: Infrastructure Genealogy
    path: workflows/infrastructure-genealogy
    type: linear
    status: production
    version: 1.0.0
    description: Trace complete history of digital infrastructure - ownership chains, hosting migrations, connections to other assets

  - name: pattern-of-life
    full_name: Pattern of Life
    path: workflows/pattern-of-life
    type: linear
    status: production
    version: 1.0.0
    description: Behavioral Analysis & Prediction through Multi-Source Pattern Analysis

  - name: doppelganger-hunt
    full_name: Doppelganger Hunt
    path: workflows/doppelganger-hunt
    type: linear
    status: production
    version: 1.0.0
    description: Identify fake accounts, sock puppets, bots, and impersonators through multi-factor authenticity analysis

  - name: attribution-chain
    full_name: Attribution Chain
    path: workflows/attribution-chain
    type: linear
    status: production
    version: 1.0.0
    description: Build evidence-based attribution from indicators to actor identity through systematic analysis chain

  - name: digital-necromancy
    full_name: Digital Necromancy
    path: workflows/digital-necromancy
    type: linear
    status: production
    version: 1.0.0
    description: Recover and reconstruct deleted, hidden, or historical digital presence

  - name: counter-intel-audit
    full_name: Counter-Intelligence Audit
    path: workflows/counter-intel-audit
    type: linear
    status: production
    version: 1.0.0
    description: Turn intelligence capabilities inward to assess organization exposure, vulnerabilities, and operational security gaps

  - name: approach-vector
    full_name: Approach Vector
    path: workflows/approach-vector
    type: linear
    status: production
    version: 1.0.0
    description: HUMINT Operation Planning - Identify vulnerabilities, social entry points, physical access, cover stories

  - name: ground-truth
    full_name: Ground Truth
    path: workflows/ground-truth
    type: linear
    status: production
    version: 1.0.0
    description: Field Operation Preparation - Complete preparation package for physical/field operations

  - name: threat-constellation
    full_name: Threat Constellation
    path: workflows/threat-constellation
    type: linear
    status: production
    version: 1.0.0
    description: Map complete threat actor ecosystem - relationships, shared infrastructure, tool reuse, and evolution over time

  - name: the-synthesis
    full_name: The Synthesis
    path: workflows/the-synthesis
    type: linear
    status: production
    version: 1.0.0
    description: Multi-Source Intelligence Fusion - Correlate, resolve conflicts, assess confidence, produce unified product

  - name: signal-landscape
    full_name: Signal Landscape
    path: workflows/signal-landscape
    type: linear
    status: production
    version: 1.0.0
    description: SIGINT Opportunity Mapping - Map target electronic footprint and collection opportunities

  - name: tripwire
    full_name: Tripwire
    path: workflows/tripwire
    type: linear
    status: production
    version: 1.0.0
    description: Alerting & Monitoring Configuration - Configure comprehensive monitoring for target changes with alerting thresholds

