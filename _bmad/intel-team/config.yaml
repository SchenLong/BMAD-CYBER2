  party_mode_agents:
    - vector     # OSINT Lead
    - proxy      # Corporate Intel
    - shadow     # Dark Web Analyst
    - resolver   # Domain Intel
    - specter    # Field Operative
    - atlas      # Geospatial Analyst
    - viper      # HUMINT Specialist
    - sigil      # SIGINT Specialist
    - echo       # Social Media Analyst
    - probe      # Technical Researcher
    - dossier    # Threat Actor Profiler

# Tool Integration
tools:
  core_bmad:
    - party-mode
    - advanced-elicitation
    - brainstorming
  llm_features:
    - web-browsing
    - file-io
    - sidecar-file

# Output Configuration
output:
  base_path: "{project-root}/_output/intel-team"
  intelligence_products: products
  target_packages: targets
  campaign_plans: campaigns
  assessments: assessments

  formats:
    - markdown

  include_metadata: true
  include_timestamps: true
  version_control: true

# Continuation Support
continuation:
  enabled: true
  state_tracking: frontmatter
  sidecar_files: true
  auto_resume: true

# Security Settings
security:
  opsec_mode: true
  evidence_hashing: SHA256
  chain_of_custody: true
  access_control: true
  sensitive_data_handling: strict

# Quality Assurance
quality:
  require_source_attribution: true
  require_confidence_levels: true
  require_evidence_documentation: true
  require_executive_summary: true

# Performance Settings
performance:
  recommended_model: claude-sonnet-4-5
  min_context_window: 200000
  parallel_processing: true
  caching: true

# Feature Flags
features:
  multi_session_continuation: true
  party_mode_integration: true
  web_browsing: true
  advanced_elicitation: true
  brainstorming: true
  sidecar_timeline: true

# Module Metadata
metadata:
  author: BMAD Framework + Claude Opus 4.5
  created_by: workflow-builder
  total_workflows: 19
  total_agents: 11
  production_ready: true
  tested: true
  documented: true

# Update Information
last_updated: 2026-01-12
update_notes: v1.0.0 - Initial release with 11 agents and 19 workflows
next_review_date: 2026-04-12  # Quarterly review
