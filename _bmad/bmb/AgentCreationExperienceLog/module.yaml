# Executive Operations (Exec-Ops) Module Configuration
# This file defines installation questions and module configuration values

code: "exec-ops"
name: "Executive Leadership & Decision-Making (Exec-Ops)"
default_selected: false

# Welcome message shown during installation
prompt:
  - "Executive Leadership & Decision-Making (Exec-Ops) Module"
  - ""
  - "This module provides 14 specialized executive advisory agents:"
  - ""
  - "  Modern Professional Advisors:"
  - "  - Augustus (Evidence-Based Policy Expert)"
  - "  - Magnus (Campaign & Political Strategy)"
  - "  - Cicero (Argumentation & Rhetoric Master)"
  - "  - Geneva (Negotiation & Consensus Builder)"
  - "  - Sophia (Political Ethics & Values Counsel)"
  - "  - Joseph (Public Messaging & Media Strategy)"
  - ""
  - "  Historical Archetype Advisors:"
  - "  - Niccolo (The Realist - Master of Realpolitik)"
  - "  - Charles (The Liberator - Moral Transformer)"
  - "  - Maximilien (The Revolutionary - Agent of Change)"
  - "  - Burke (The Conservative - Guardian of Tradition)"
  - "  - Lee (The Technocrat - Builder of Systems)"
  - "  - Musashi (The Strategist-Warrior - Master of Timing)"
  - "  - Sun (The Master Strategist - Supreme Strategist)"
  - "  - Jean-Luc (The Principled Commander - Diplomat Captain)"
  - ""
  - "Strategic executive counsel integrated into your BMAD workflow."

# Core config values are automatically inherited from installer:
## user_name
## communication_language
## document_output_language

# ============================================================================
# CONFIGURATION FIELDS
# ============================================================================
# Each field can be:
# 1. INTERACTIVE (has 'prompt' - asks user during installation)
# 2. STATIC (no 'prompt' - just uses 'result' value)
# ============================================================================

# INTERACTIVE: Primary output location
output_folder:
  prompt: "Where should exec-ops save executive artifacts and documentation?"
  default: "_bmad-output/executive"
  result: "{project-root}/{value}"

# STATIC: Module identification
module_code:
  result: "exec-ops"

module_version:
  result: "1.0.0"

# STATIC: Module paths
agents_path:
  result: "{project-root}/_bmad/exec-ops/agents"

# STATIC: Automatic subdirectory configuration
# These are derived from output_folder and created automatically by agents
planning_artifacts:
  result: "{output_folder}/planning"

decision_logs:
  result: "{output_folder}/decisions"

documentation:
  result: "{output_folder}/docs"
