# MULTI-TEAM SCENARIOS
multi_team_scenarios:
  cybersecurity_incident:
    description: "Major security incident requiring coordinated response"
    primary_team: "cybersec-team"
    supporting_teams: ["intel-team", "legal-team", "strategy-team"]
    keywords:
      - "major breach"
      - "security incident"
      - "data breach"
      - "cyber attack"
      - "ransomware attack"
      - "critical infrastructure"
      - "incident response"
      - "security crisis"
      - "cyber emergency"
    workflow: "incident-response-coordination"

  regulatory_investigation:
    description: "Regulatory investigation with legal and compliance implications"
    primary_team: "legal-team"
    supporting_teams: ["cybersec-team", "strategy-team"]
    keywords:
      - "regulatory investigation"
      - "compliance audit"
      - "government inquiry"
    workflow: "regulatory-response-coordination"

  threat_actor_campaign:
    description: "Advanced persistent threat requiring intelligence and security coordination"
    primary_team: "intel-team"
    supporting_teams: ["cybersec-team", "legal-team"]
    keywords:
      - "apt"
      - "advanced persistent threat"
      - "nation state"
      - "sophisticated attack"
    workflow: "threat-actor-response"

  merger_acquisition:
    description: "M&A activity requiring strategic, legal, and security due diligence"
    primary_team: "strategy-team"
    supporting_teams: ["legal-team", "cybersec-team", "intel-team"]
    keywords:
      - "merger"
      - "acquisition"
      - "due diligence"
      - "m&a"
    workflow: "ma-coordination"

# ROUTING ALGORITHMS
routing_algorithms:
  exact_match:
    priority: 1
    description: "Direct keyword match"

  fuzzy_match:
    priority: 2
    description: "Approximate keyword match"
    threshold: 0.7

  context_analysis:
    priority: 3
    description: "Analyze full request context"

  multi_keyword:
    priority: 4
    description: "Multiple keyword pattern matching"

  fallback:
    priority: 5
    description: "Default to strategy team for analysis"

# ESCALATION RULES
escalation_rules:
  multi_match:
    action: "present_options"
    prompt: "Multiple teams could help with this request. Which approach would you prefer?"

  no_match:
    action: "fallback_with_analysis"
    team: "strategy-team"
    prompt: "I'll route this to our strategic advisors for initial analysis and proper routing."

  high_priority:
    keywords: ["urgent", "critical", "emergency", "asap"]
    action: "expedite"
    notify_all_teams: true

# CROSS-REFERENCE MAPPINGS
cross_reference:
  security_compliance:
    keywords: ["security compliance", "cyber regulation", "security audit"]
    teams: ["cybersec-team", "legal-team"]

  threat_legal:
    keywords: ["legal threat", "litigation threat", "regulatory threat"]
    teams: ["legal-team", "intel-team"]

  strategic_security:
    keywords: ["security strategy", "cyber strategy", "strategic risk"]
    teams: ["strategy-team", "cybersec-team"]

  intelligence_legal:
    keywords: ["legal intelligence", "litigation intelligence", "regulatory intelligence"]
    teams: ["intel-team", "legal-team"]