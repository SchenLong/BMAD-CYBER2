# BMAD Project Status Dashboard Workflow
# Provides comprehensive project status and progress monitoring across all teams
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Project Status Dashboard
    id: project-status
    version: "2.0.0"
    description: "Comprehensive project status monitoring and reporting across all BMAD teams"
    category: "project-management"
    estimated_duration: "2-5 minutes"
    complexity: "medium"

  # Workflow Inputs
  inputs:
    - name: project_filter
      type: string
      required: false
      options: ["active", "all", "completed", "on_hold"]
      default: "active"
    - name: team_filter
      type: array
      required: false
      options: ["cybersec-team", "intel-team", "legal-team", "strategy-team"]
    - name: detail_level
      type: string
      required: false
      options: ["summary", "detailed", "comprehensive"]
      default: "detailed"
    - name: time_period
      type: string
      required: false
      options: ["current", "week", "month", "quarter"]
      default: "current"

  # Workflow Outputs
  outputs:
    - name: project_summary
      type: object
      description: "Overall project portfolio summary"
    - name: team_status
      type: object
      description: "Status by team with workload and progress"
    - name: critical_issues
      type: array
      description: "Issues requiring immediate attention"
    - name: upcoming_milestones
      type: array
      description: "Key milestones approaching"
    - name: resource_utilization
      type: object
      description: "Team and agent resource utilization"

# Workflow Steps
steps:
  - number: 1
    name: "Load Project Registry"
    description: "Load and analyze the current project registry"
    action: "load_registry"
    logic: |
      1. Load project registry from output folder
      2. Filter projects based on input criteria
      3. Validate project data integrity
      4. Identify active and inactive projects
      5. Extract key metadata for analysis

  - number: 2
    name: "Analyze Project Status"
    description: "Analyze individual project status and progress"
    action: "analyze_projects"
    logic: |
      For each project:
      1. Check project folder for recent activity
      2. Analyze deliverable completion status
      3. Review milestone progress
      4. Identify blockers or delays
      5. Calculate completion percentage

  - number: 3
    name: "Team Workload Assessment"
    description: "Assess current workload and capacity for each team"
    action: "assess_workloads"
    logic: |
      For each team:
      1. Count active project assignments
      2. Analyze task distribution across agents
      3. Identify resource bottlenecks
      4. Calculate capacity utilization
      5. Flag overcommitted resources

  - number: 4
    name: "Critical Issues Identification"
    description: "Identify projects and tasks requiring immediate attention"
    action: "identify_issues"
    logic: |
      1. Check for overdue milestones
      2. Identify projects with no recent activity
      3. Flag resource conflicts or overcommitment
      4. Review cross-team dependency blockers
      5. Prioritize issues by impact and urgency

  - number: 5
    name: "Progress Analytics"
    description: "Calculate progress metrics and trends"
    action: "calculate_metrics"
    logic: |
      1. Calculate overall portfolio health score
      2. Analyze completion velocity trends
      3. Measure team productivity metrics
      4. Assess cross-team collaboration effectiveness
      5. Generate performance insights

  - number: 6
    name: "Generate Status Dashboard"
    description: "Create comprehensive status dashboard"
    action: "generate_dashboard"
    output_format: |
      ## 📊 BMAD Project Status Dashboard

      **Report Generated:** {current_timestamp}
      **Active Projects:** {active_project_count}
      **Filter:** {project_filter} | **Period:** {time_period}

      ---

      ## 🎯 Portfolio Health Summary

      **Overall Health Score:** {portfolio_health_score}/100
      **Projects On Track:** {on_track_count}/{total_projects} ({on_track_percentage}%)
      **Critical Issues:** {critical_issues_count}
      **Upcoming Deadlines:** {upcoming_deadlines_count}

      ### Health Indicators
      - 🟢 **On Track:** {on_track_count} projects
      - 🟡 **At Risk:** {at_risk_count} projects
      - 🔴 **Behind Schedule:** {behind_schedule_count} projects
      - ⏸️ **On Hold:** {on_hold_count} projects

      ---

      ## 📈 Active Projects Overview

      {for project in active_projects}
      ### {project.name}
      **Status:** {project.status_indicator} | **Progress:** {project.completion_percentage}%
      **Team:** {project.primary_team} | **Lead:** {project.lead_agent}
      **Timeline:** {project.timeline_status}

      **Recent Activity:**
      {for activity in project.recent_activities}
      - {activity.date}: {activity.description}
      {/for}

      {if project.blockers}
      **⚠️ Current Blockers:**
      {for blocker in project.blockers}
      - {blocker.description} (Impact: {blocker.impact})
      {/for}
      {/if}

      {if project.next_milestones}
      **🎯 Upcoming Milestones:**
      {for milestone in project.next_milestones}
      - {milestone.date}: {milestone.title}
      {/for}
      {/if}

      ---
      {/for}

      ## 👥 Team Status & Workload

      ### Cybersecurity Team
      **Active Projects:** {cybersec_projects_count}
      **Utilization:** {cybersec_utilization}%
      **Status:** {cybersec_status_indicator}

      **Agent Workload:**
      {for agent in cybersec_agents}
      - **{agent.name}:** {agent.active_tasks} tasks ({agent.utilization}%)
      {/for}

      ### Intelligence Team
      **Active Projects:** {intel_projects_count}
      **Utilization:** {intel_utilization}%
      **Status:** {intel_status_indicator}

      **Agent Workload:**
      {for agent in intel_agents}
      - **{agent.name}:** {agent.active_tasks} tasks ({agent.utilization}%)
      {/for}

      ### Legal Team
      **Active Projects:** {legal_projects_count}
      **Utilization:** {legal_utilization}%
      **Status:** {legal_status_indicator}

      **Agent Workload:**
      {for agent in legal_agents}
      - **{agent.name}:** {agent.active_tasks} tasks ({agent.utilization}%)
      {/for}

      ### Strategy Team
      **Active Projects:** {strategy_projects_count}
      **Utilization:** {strategy_utilization}%
      **Status:** {strategy_status_indicator}

      **Agent Workload:**
      {for agent in strategy_agents}
      - **{agent.name}:** {agent.active_tasks} tasks ({agent.utilization}%)
      {/for}

      ---

      ## 🚨 Critical Issues Requiring Attention

      {for issue in critical_issues}
      ### {issue.priority} Priority: {issue.title}
      **Project:** {issue.project_name}
      **Team:** {issue.affected_team}
      **Impact:** {issue.impact_description}
      **Recommended Action:** {issue.recommended_action}
      **Due Date:** {issue.due_date}
      {/for}

      ---

      ## 📅 Upcoming Milestones (Next 7 Days)

      {for milestone in upcoming_milestones}
      **{milestone.date}** - **{milestone.project_name}**
      {milestone.title} ({milestone.team})
      {/for}

      ---

      ## 📊 Performance Metrics

      ### This Period
      **Projects Completed:** {completed_this_period}
      **Average Completion Time:** {avg_completion_time}
      **Team Collaboration Score:** {collaboration_score}/10
      **Client Satisfaction:** {satisfaction_score}/10

      ### Trends (vs. Previous Period)
      **Velocity Change:** {velocity_change}%
      **Quality Score Change:** {quality_change}%
      **Resource Efficiency Change:** {efficiency_change}%

      ---

      ## 🔄 Recommended Actions

      ### Immediate (Next 24 Hours)
      {for action in immediate_actions}
      - {action.description} (Owner: {action.owner})
      {/for}

      ### Short Term (This Week)
      {for action in short_term_actions}
      - {action.description} (Owner: {action.owner})
      {/for}

      ### Strategic (This Month)
      {for action in strategic_actions}
      - {action.description} (Owner: {action.owner})
      {/for}

      ---

      **Dashboard Actions:**
      1. **[R]** Refresh dashboard with latest data
      2. **[D]** Drill down into specific project
      3. **[T]** View detailed team analysis
      4. **[E]** Export report for stakeholders
      5. **[A]** Take action on critical issue

# Status Analysis Algorithms
status_analysis:
  project_health_calculation:
    factors:
      milestone_adherence: 30
      deliverable_quality: 25
      resource_utilization: 20
      stakeholder_satisfaction: 15
      team_collaboration: 10

  risk_indicators:
    red_flags:
      - "milestone_overdue_3_days"
      - "no_activity_7_days"
      - "resource_utilization_over_90"
      - "cross_team_dependency_blocked"
      - "stakeholder_escalation"

    warning_signs:
      - "milestone_approaching_no_progress"
      - "resource_utilization_over_75"
      - "team_communication_gaps"
      - "scope_creep_detected"
      - "external_dependency_risk"

  progress_tracking:
    completion_metrics:
      - "deliverables_completed"
      - "milestones_achieved"
      - "quality_gates_passed"
      - "stakeholder_approvals"

    velocity_indicators:
      - "tasks_completed_per_week"
      - "average_task_cycle_time"
      - "rework_percentage"
      - "first_time_quality_rate"

# Team Capacity Models
team_capacity_models:
  cybersec_team:
    standard_capacity: 40  # hours per week per agent
    peak_capacity: 50     # maximum sustainable hours
    agents:
      security_architect: { capacity: 40, specializations: ["architecture", "design"] }
      threat_analyst: { capacity: 35, specializations: ["analysis", "intelligence"] }
      penetration_tester: { capacity: 45, specializations: ["testing", "assessment"] }
      compliance_guardian: { capacity: 40, specializations: ["compliance", "audit"] }
      incident_responder: { capacity: 50, specializations: ["response", "forensics"] }

  intel_team:
    standard_capacity: 38
    peak_capacity: 48
    agents:
      osint_lead: { capacity: 40, specializations: ["coordination", "methodology"] }
      threat_actor_profiler: { capacity: 35, specializations: ["attribution", "profiling"] }
      dark_web_analyst: { capacity: 40, specializations: ["underground", "cryptocurrency"] }
      social_media_analyst: { capacity: 35, specializations: ["socmint", "monitoring"] }
      technical_researcher: { capacity: 38, specializations: ["technical", "tools"] }

  legal_team:
    standard_capacity: 40
    peak_capacity: 55
    agents:
      counsel: { capacity: 45, specializations: ["strategy", "coordination"] }
      covenant: { capacity: 40, specializations: ["contracts", "negotiation"] }
      liberty: { capacity: 42, specializations: ["us_law", "federal"] }
      europa: { capacity: 40, specializations: ["eu_law", "international"] }
      advocate: { capacity: 38, specializations: ["litigation", "disputes"] }

  strategy_team:
    standard_capacity: 42
    peak_capacity: 52
    agents:
      master_strategist: { capacity: 45, specializations: ["strategy", "analysis"] }
      political_strategist: { capacity: 40, specializations: ["politics", "negotiation"] }
      ethics_advisor: { capacity: 35, specializations: ["ethics", "values"] }
      communications_director: { capacity: 42, specializations: ["messaging", "crisis"] }
      stakeholder_mediator: { capacity: 38, specializations: ["mediation", "relationships"] }

# Dashboard Personalization
dashboard_views:
  executive_summary:
    focus: ["portfolio_health", "critical_issues", "resource_utilization"]
    detail_level: "summary"
    refresh_frequency: "daily"

  team_lead_view:
    focus: ["team_projects", "agent_workload", "upcoming_milestones"]
    detail_level: "detailed"
    refresh_frequency: "real_time"

  project_manager_view:
    focus: ["project_status", "cross_team_dependencies", "resource_conflicts"]
    detail_level: "comprehensive"
    refresh_frequency: "hourly"

  stakeholder_view:
    focus: ["project_progress", "delivery_timeline", "quality_metrics"]
    detail_level: "summary"
    refresh_frequency: "weekly"

# Integration Points
integrations:
  project_registry:
    purpose: "Source of project data and status"
    path: "{output_folder}/project-registry.yaml"

  team_workflows:
    purpose: "Integration with team-specific progress tracking"
    paths:
      - "cybersec-team/workflows/"
      - "intel-team/workflows/"
      - "legal-team/workflows/"
      - "strategy-team/workflows/"

  agent_manifest:
    purpose: "Agent capacity and specialization data"
    path: "{project-root}/_bmad/_config/agent-manifest.csv"