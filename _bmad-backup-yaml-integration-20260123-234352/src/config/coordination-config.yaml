# BMAD Cross-Team Coordination Configuration
# Central configuration for Abdul's orchestration capabilities
# Version: 2.0.0

schema_version: "1.0"
format_version: "coordination-config.yaml"

# Coordination System Metadata
coordination_system:
  version: "2.0.0"
  orchestrator: "abdul"
  supported_teams: ["cybersec-team", "intel-team", "legal-team", "strategy-team"]
  coordination_modes: ["project_management", "intelligent_routing", "team_orchestration", "party_mode"]

# Abdul's 12 Menu Options Integration
menu_system:
  orchestration_capabilities:
    # Project Management Functions (Menu items 1-4)
    project_management:
      - id: "NP"
        capability: "create_project"
        workflow: "project-manager/create-project"
        teams_involved: "intelligent_routing_determines"

      - id: "OP"
        capability: "open_project"
        workflow: "built_in_action"
        teams_involved: "registry_based"

      - id: "LP"
        capability: "list_projects"
        workflow: "built_in_action"
        teams_involved: "all_teams"

      - id: "PS"
        capability: "project_status"
        workflow: "project-manager/project-status"
        teams_involved: "all_teams"

    # Intelligent Routing & Delegation (Menu items 5-7)
    intelligent_coordination:
      - id: "WN"
        capability: "whats_next_routing"
        workflow: "project-manager/whats-next"
        teams_involved: "intelligent_analysis"

      - id: "AT"
        capability: "assign_task"
        workflow: "project-manager/assign-task"
        teams_involved: "intelligent_routing_determines"

      - id: "CM"
        capability: "cross_module_consultation"
        workflow: "cross-module/consultation"
        teams_involved: "multi_team_collaboration"

    # Team Orchestration (Menu items 8-10)
    team_orchestration:
      - id: "TO"
        capability: "team_orchestration_templates"
        workflow: "team-orchestration/select-template"
        teams_involved: "template_specific"

      - id: "PP"
        capability: "party_mode_presets"
        workflow: "party-mode/select-preset"
        teams_involved: "preset_specific"

      - id: "PG"
        capability: "phase_gate_validation"
        workflow: "team-orchestration/phase-gate"
        teams_involved: "validation_specific"

    # Standard Functions (Menu items 11-12)
    standard_functions:
      - id: "PM"
        capability: "party_mode"
        workflow: "party-mode/workflow.md"
        teams_involved: "all_teams"

      - id: "MH"
        capability: "menu_help"
        workflow: "built_in_display"
        teams_involved: "none"

# Cross-Team Integration Matrix
team_integration_matrix:
  cybersec_team:
    primary_keywords: ["security", "threat", "vulnerability", "incident", "compliance"]
    coordination_strength: "high"
    collaboration_teams: ["intel-team", "legal-team", "strategy-team"]
    orchestration_role: "technical_security_lead"

  intel_team:
    primary_keywords: ["intelligence", "research", "investigation", "attribution", "osint"]
    coordination_strength: "high"
    collaboration_teams: ["cybersec-team", "legal-team", "strategy-team"]
    orchestration_role: "information_gathering_lead"

  legal_team:
    primary_keywords: ["legal", "compliance", "contract", "regulatory", "dispute"]
    coordination_strength: "medium"
    collaboration_teams: ["strategy-team", "cybersec-team", "intel-team"]
    orchestration_role: "legal_and_compliance_lead"

  strategy_team:
    primary_keywords: ["strategy", "planning", "stakeholder", "decision", "leadership"]
    coordination_strength: "very_high"
    collaboration_teams: ["legal-team", "cybersec-team", "intel-team"]
    orchestration_role: "strategic_coordination_lead"

# Workflow Orchestration Patterns
orchestration_patterns:
  security_incident:
    trigger_keywords: ["breach", "attack", "incident", "compromise"]
    primary_team: "cybersec-team"
    coordination_sequence: ["immediate_response", "investigation", "containment", "recovery", "lessons_learned"]
    required_teams: ["cybersec-team", "intel-team", "legal-team", "strategy-team"]
    escalation_thresholds: ["severity_high", "regulatory_impact", "public_exposure"]

  legal_crisis:
    trigger_keywords: ["lawsuit", "regulatory", "compliance_violation", "investigation"]
    primary_team: "legal-team"
    coordination_sequence: ["assessment", "response_strategy", "stakeholder_communication", "resolution"]
    required_teams: ["legal-team", "strategy-team", "intel-team"]
    escalation_thresholds: ["material_impact", "regulatory_enforcement", "reputation_risk"]

  strategic_initiative:
    trigger_keywords: ["strategic", "planning", "transformation", "growth"]
    primary_team: "strategy-team"
    coordination_sequence: ["analysis", "planning", "stakeholder_alignment", "execution", "monitoring"]
    required_teams: ["strategy-team", "legal-team", "cybersec-team", "intel-team"]
    escalation_thresholds: ["resource_constraints", "stakeholder_resistance", "timeline_pressure"]

  threat_assessment:
    trigger_keywords: ["threat", "risk", "vulnerability", "assessment"]
    primary_team: "intel-team"
    coordination_sequence: ["intelligence_gathering", "analysis", "assessment", "recommendations", "monitoring"]
    required_teams: ["intel-team", "cybersec-team", "strategy-team"]
    escalation_thresholds: ["critical_threat", "immediate_risk", "widespread_impact"]

# Intelligent Routing Configuration
intelligent_routing:
  keyword_database_path: "core/workflows/intelligent-routing/keyword-mappings.yaml"
  routing_algorithm: "multi_factor_analysis"
  confidence_threshold: 0.7
  fallback_team: "strategy-team"

  routing_factors:
    keyword_matching: 40
    context_analysis: 25
    urgency_assessment: 20
    team_capacity: 15

  multi_team_scenarios:
    threshold: 0.4
    max_teams: 3
    coordination_overhead_factor: 1.2

# Project Lifecycle Integration
project_lifecycle:
  registry_path: "{output_folder}/project-registry.yaml"
  default_phases: ["initiation", "planning", "execution", "monitoring", "closure"]

  phase_transitions:
    require_gate_validation: true
    multi_team_signoff: true
    stakeholder_approval: "phase_dependent"

  tracking_mechanisms:
    progress_monitoring: "continuous"
    milestone_tracking: "enabled"
    resource_utilization: "monitored"
    cross_team_dependencies: "tracked"

# Communication and Coordination Protocols
coordination_protocols:
  meeting_cadence:
    daily_standups: "active_projects_only"
    weekly_reviews: "all_teams"
    monthly_strategic: "strategy_team_lead"
    quarterly_assessment: "full_portfolio"

  escalation_procedures:
    team_level: ["resource_conflict", "timeline_delay", "quality_issue"]
    abdul_level: ["cross_team_conflict", "scope_change", "stakeholder_escalation"]
    executive_level: ["critical_failure", "major_crisis", "strategic_pivot"]

  communication_channels:
    project_updates: "weekly_digest"
    urgent_notifications: "immediate_alert"
    coordination_requests: "real_time_routing"
    status_reporting: "dashboard_based"

# Quality Assurance and Metrics
quality_assurance:
  coordination_effectiveness:
    metrics: ["response_time", "resolution_rate", "stakeholder_satisfaction", "team_collaboration_score"]
    measurement_frequency: "monthly"
    improvement_threshold: "10_percent_quarterly"

  routing_accuracy:
    metrics: ["correct_team_assignment", "optimal_agent_selection", "resolution_efficiency"]
    measurement_frequency: "per_request"
    feedback_integration: "continuous_learning"

  project_success:
    metrics: ["on_time_delivery", "budget_adherence", "quality_standards", "stakeholder_acceptance"]
    measurement_frequency: "per_project"
    benchmark_comparison: "industry_standards"

# Integration Points and Dependencies
integrations:
  bmad_core_system:
    config_path: "{project-root}/_bmad/core/config.yaml"
    agent_manifest: "{project-root}/_bmad/_config/agent-manifest.csv"
    workflow_manifest: "{project-root}/_bmad/_config/workflow-manifest.csv"

  team_modules:
    cybersec_path: "cybersec-team/"
    intel_path: "intel-team/"
    legal_path: "legal-team/"
    strategy_path: "strategy-team/"

  external_systems:
    notification_hooks: "{project-root}/.claude/hooks/bmad-speak.sh"
    reporting_integration: "dashboard_api"
    stakeholder_communication: "email_templates"

# Coordination Capabilities Summary
capabilities_summary:
  total_workflows: 7
  routing_keywords: "330+"
  team_presets: 9
  orchestration_templates: 6
  coordination_patterns: 4

  cross_team_scenarios: "unlimited"
  project_lifecycle_phases: 5
  quality_gates: "phase_dependent"
  escalation_levels: 3

# Deployment and Operations
deployment_config:
  initialization_sequence:
    - "load_coordination_config"
    - "validate_team_connections"
    - "initialize_routing_system"
    - "setup_project_registry"
    - "activate_orchestration_capabilities"

  operational_requirements:
    memory_allocation: "moderate"
    processing_overhead: "low_to_medium"
    network_dependencies: "team_module_access"
    storage_requirements: "project_registry_and_logs"

  maintenance_tasks:
    keyword_mapping_updates: "quarterly"
    preset_optimization: "semi_annual"
    workflow_enhancement: "continuous"
    performance_tuning: "monthly"