# NPM Publishing Pipeline for bmad-cybersec NPX package
# Triggered when a GitHub release is published
# Publishes to npm with provenance attestation for supply chain security

name: Publish NPX Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/npx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from release
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # Check if pre-release (contains hyphen like -alpha, -beta, -rc)
          if [[ "$VERSION" == *"-"* ]]; then
            echo "DIST_TAG=next" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "DIST_TAG=latest" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

          echo "Detected version: $VERSION"
          echo "Dist tag: $(grep DIST_TAG $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Sync version to package.json
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test --if-present
        continue-on-error: false

      - name: Verify package contents
        run: |
          echo "=== Package Contents ==="
          npm pack --dry-run

          # Check package size
          PACKED=$(npm pack 2>&1)
          echo "$PACKED"

          # Extract and check size (warn if over 100KB)
          SIZE_INFO=$(echo "$PACKED" | grep -E 'package size|total files' || echo "")
          echo "Package info: $SIZE_INFO"

      - name: Publish to npm
        run: |
          echo "Publishing bmad-cybersec@${{ steps.version.outputs.VERSION }} with tag: ${{ steps.version.outputs.DIST_TAG }}"
          npm publish \
            --provenance \
            --access public \
            --tag ${{ steps.version.outputs.DIST_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        run: |
          echo "Waiting for npm registry to update..."
          sleep 15

          echo "=== Verifying package on npm ==="
          npm view bmad-cybersec@${{ steps.version.outputs.VERSION }} || echo "Package may take a moment to appear"

          echo ""
          echo "=== Installation command ==="
          if [ "${{ steps.version.outputs.IS_PRERELEASE }}" = "true" ]; then
            echo "npx bmad-cybersec@next install"
          else
            echo "npx bmad-cybersec install"
          fi
        working-directory: ${{ github.workspace }}

      - name: Update release notes
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.VERSION }}';
            const distTag = '${{ steps.version.outputs.DIST_TAG }}';
            const isPrerelease = '${{ steps.version.outputs.IS_PRERELEASE }}' === 'true';

            const installCmd = isPrerelease
              ? `npx bmad-cybersec@next install`
              : `npx bmad-cybersec install`;

            const body = context.payload.release.body || '';
            const npmBadge = `\n\n---\n\n**npm:** [\`bmad-cybersec@${version}\`](https://www.npmjs.com/package/bmad-cybersec/v/${version})\n\n**Install:**\n\`\`\`bash\n${installCmd}\n\`\`\``;

            // Only update if not already containing npm info
            if (!body.includes('npmjs.com/package/bmad-cybersec')) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                body: body + npmBadge
              });
              console.log('Updated release notes with npm installation info');
            }

  # Notify on failure
  notify-failure:
    runs-on: ubuntu-latest
    needs: publish
    if: failure()
    steps:
      - name: Create issue on publish failure
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ github.event.release.tag_name }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `NPM publish failed for ${version}`,
              body: `The npm publish workflow failed for release ${version}.\n\nPlease check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n**Manual recovery:**\n1. Fix the issue\n2. Run \`npm publish\` manually from \`tools/npx\`\n3. Or re-trigger the workflow`,
              labels: ['bug', 'ci/cd']
            });
