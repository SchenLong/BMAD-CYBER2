name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "PRERELEASE=$( [[ "$VERSION" == *"-"* ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Create tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist

          # Follow package.json files list - build tarball with same structure
          npm pack --dry-run | head -1

          # Actually create the tarball that npm pack would create
          npm pack

          # List what we created
          echo "Tarball created:"
          ls -la *.tgz

      - name: Generate checksums
        run: |
          for file in *.tgz; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # v2.5.0
        with:
          files: |
            *.tgz
            *.sha256
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
