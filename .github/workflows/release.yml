name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present
        continue-on-error: false

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}  # Remove 'v' prefix
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "PRERELEASE=$( [[ "$VERSION" == *"-"* ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # v2.5.0
        with:
          files: |
            bmad-cybersec-${{ steps.version.outputs.VERSION }}.tar.gz
            bmad-cybersec-${{ steps.version.outputs.VERSION }}.tar.gz.sha256
            bmad-cybersec-${{ steps.version.outputs.VERSION }}.sbom.json
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
