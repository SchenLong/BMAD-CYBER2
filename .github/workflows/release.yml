name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "PRERELEASE=$( [[ "$VERSION" == *"-"* ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Build tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          npm pack
          echo "Tarball created:"
          ls -la *.tgz

      - name: Generate checksums
        run: |
          for file in *.tgz; do
            sha256sum "$file" > "$file.sha256"
            cat "$file.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2 # v2.5.0
        with:
          files: |
            *.tgz
            *.sha256
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on success (optional)
        if: success() && vars.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -X POST "${{ vars.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"New BMAD-CYBER release: ${{ steps.version.outputs.VERSION }}\"}"
