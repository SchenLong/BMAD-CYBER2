name: Code Quality Gate
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow this workflow to be called by other workflows (e.g., release.yml)
  workflow_call:
    outputs:
      quality_passed:
        description: "Whether all quality checks passed"
        value: ${{ jobs.quality-gate.outputs.passed }}

env:
  NODE_VERSION: '20'

jobs:
  quality-check:
    name: Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        id: unit_tests
        run: |
          OUTPUT=$(npm run test:unit 2>&1)
          echo "$OUTPUT"
          PASSED=$(echo "$OUTPUT" | grep -oE '[0-9]+ passed' | tail -1 | grep -oE '[0-9]+')
          echo "count=${PASSED:-0}" >> $GITHUB_OUTPUT

      - name: Run integration tests
        id: integration_tests
        run: |
          OUTPUT=$(npm run test:integration 2>&1)
          echo "$OUTPUT"
          PASSED=$(echo "$OUTPUT" | grep -oE '[0-9]+ passed' | tail -1 | grep -oE '[0-9]+')
          echo "count=${PASSED:-0}" >> $GITHUB_OUTPUT

      - name: Assert minimum test count
        run: |
          UNIT=${{ steps.unit_tests.outputs.count }}
          INT=${{ steps.integration_tests.outputs.count }}
          TOTAL=$(( ${UNIT:-0} + ${INT:-0} ))
          MIN=$(cat .github/test-minimum.txt | head -1 | tr -d '[:space:]')
          echo "Unit: $UNIT, Integration: $INT, Total: $TOTAL (minimum: $MIN)"
          if [ "$TOTAL" -lt "$MIN" ]; then
            echo "::error::Test count $TOTAL is below minimum $MIN. Update .github/test-minimum.txt if tests were intentionally removed."
            exit 1
          fi

      - name: Check test coverage
        run: npm run test:coverage

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Build framework
        run: npm run build

      - name: Validate framework exports
        run: npm run validate:exports

      - name: Validate schemas (agents, workflows, modules)
        run: npm run test:schemas

      - name: Lint markdown
        run: npm run lint:md

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Regression Quick Check
        run: bash scripts/security-regression.sh

      - name: Run security scan
        run: npm run security:scan

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@6641d4ba5b684fffe195b9820345de1bf19f3181 # v3.89.2
        with:
          path: ./
          base: main
          head: HEAD

      - name: Validate framework security
        run: npm run security:validate-framework

      - name: Hook content hash drift detection
        run: |
          node -e "
            var fs = require('fs');
            var crypto = require('crypto');
            var p = require('path');
            var b = JSON.parse(fs.readFileSync('tests/baselines/hook-content-hashes.json', 'utf-8'));
            var d = 0;
            Object.entries(b.hashes).forEach(function(e) {
              var rel = e[0], exp = e[1], full = p.resolve(rel);
              if (!fs.existsSync(full)) { console.log('MISSING: ' + rel); d++; return; }
              var act = crypto.createHash('sha256').update(fs.readFileSync(full, 'utf-8'), 'utf-8').digest('hex');
              if (act !== exp) { console.log('DRIFTED: ' + rel); d++; }
            });
            if (d > 0) { console.error(d + ' hook file(s) drifted from baseline'); process.exit(1); }
            console.log('All ' + b.fileCount + ' hook hashes match baseline');
          "

  performance-check:
    name: Performance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build framework
        run: npm run build

      - name: Run performance tests
        run: npm run test:performance

      - name: Check bundle size
        run: npm run check:bundle-size

      - name: Memory usage test
        run: npm run test:memory

  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs
        run: npm run docs:generate

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check README completeness
        run: npm run docs:check-readme

  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan, performance-check, documentation-check]
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.gate-status.outputs.passed }}

    steps:
      - name: Quality Gate Passed
        id: gate-status
        run: |
          echo "✅ All quality checks passed!"
          echo "Code is ready for production deployment."
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Generate quality report
        run: |
          echo "## Quality Gate Report" > quality-report.md
          echo "All quality checks have passed successfully:" >> quality-report.md
          echo "- ✅ Code Quality & Testing" >> quality-report.md
          echo "- ✅ Security Analysis" >> quality-report.md
          echo "- ✅ Performance Validation" >> quality-report.md
          echo "- ✅ Documentation Check" >> quality-report.md
          echo "" >> quality-report.md
          echo "Framework is production ready! 🚀" >> quality-report.md

      - name: Upload quality report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-report
          path: quality-report.md