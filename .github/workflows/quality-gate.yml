name: Code Quality Gate
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'

jobs:
  quality-check:
    name: Quality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Check test coverage
        run: npm run test:coverage

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Build framework
        run: npm run build

      - name: Validate framework exports
        run: npm run validate:exports

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security scan
        run: npm run security:scan

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

      - name: Validate framework security
        run: npm run security:validate-framework

  performance-check:
    name: Performance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build framework
        run: npm run build

      - name: Run performance tests
        run: npm run test:performance

      - name: Check bundle size
        run: npm run check:bundle-size

      - name: Memory usage test
        run: npm run test:memory

  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate API docs
        run: npm run docs:generate

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check README completeness
        run: npm run docs:check-readme

  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan, performance-check, documentation-check]
    timeout-minutes: 5

    steps:
      - name: Quality Gate Passed
        run: |
          echo "✅ All quality checks passed!"
          echo "Code is ready for production deployment."

      - name: Generate quality report
        run: |
          echo "## Quality Gate Report" > quality-report.md
          echo "All quality checks have passed successfully:" >> quality-report.md
          echo "- ✅ Code Quality & Testing" >> quality-report.md
          echo "- ✅ Security Analysis" >> quality-report.md
          echo "- ✅ Performance Validation" >> quality-report.md
          echo "- ✅ Documentation Check" >> quality-report.md
          echo "" >> quality-report.md
          echo "Framework is production ready! 🚀" >> quality-report.md

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.md