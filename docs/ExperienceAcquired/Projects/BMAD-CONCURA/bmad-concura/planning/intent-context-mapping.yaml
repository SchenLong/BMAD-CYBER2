# Intent-Aware Context Selection Mapping
# BMAD-CONCURA Project - Story CONCURA-2.3
# Author: Dr. Quinn (Master Problem Solver)
# Date: 2026-01-17
# Version: 1.0
#
# This file defines the mapping between detected user intents and the
# context components that should be loaded. Used by the rules engine
# to generate context manifests.

version: "1.0"
description: "Intent to context component mapping for BMAD framework"

# =============================================================================
# SECTION 1: Context Component Definitions
# =============================================================================

context_components:
  # Base system components (always or frequently loaded)
  SYS_BASE:
    description: "Claude Code base system instructions"
    estimated_tokens: 15000
    loading_strategy: eager
    cacheable: true
    location: system

  TOOL_DEFS:
    description: "Tool definitions and descriptions"
    estimated_tokens: 12000
    loading_strategy: eager
    cacheable: true
    location: system

  SKILL_LIST:
    description: "Available skills listing"
    estimated_tokens: 9400
    variants:
      full: 9400
      minimal: 2000  # Top skills only
    loading_strategy: conditional
    cacheable: true
    location: "{project-root}/_bmad/_config/workflow-manifest.csv"

  SEC_RULES:
    description: "Shared security rules"
    estimated_tokens: 500
    loading_strategy: eager
    cacheable: true
    location: shared

  GIT_STATUS:
    description: "Current git branch and changes"
    estimated_tokens: 800
    loading_strategy: conditional
    cacheable: false  # Changes frequently
    location: system

  # Project context
  PROJ_CTX:
    description: "Project context file (project-context.md)"
    estimated_tokens: 3000
    loading_strategy: conditional
    condition: "file_exists"
    cacheable: true
    location: "{output_folder}/project-context.md"

  # Agent components
  AGENT_FILE:
    description: "Full agent persona file"
    estimated_tokens: 2500  # Average
    range: [1500, 14000]
    loading_strategy: on_demand
    cacheable: true
    location_pattern: "{project-root}/_bmad/{module}/agents/{agent}.md"

  AGENT_SUM:
    description: "Compressed agent identity summary"
    estimated_tokens: 200
    loading_strategy: on_demand
    cacheable: true
    derived_from: AGENT_FILE

  AGENT_MANIFEST:
    description: "Full agent manifest with all personas"
    estimated_tokens: 16000
    loading_strategy: avoid  # Use AGENT_INDEX instead
    cacheable: true
    location: "{project-root}/_bmad/_config/agent-manifest.csv"

  AGENT_INDEX:
    description: "Minimal agent ID to path mapping"
    estimated_tokens: 500
    loading_strategy: fallback
    cacheable: true
    location: "{project-root}/_bmad/_config/agent-index.yaml"

  # Workflow components
  WF_FILE:
    description: "Workflow entry file"
    estimated_tokens: 4000  # Average
    range: [2000, 15000]
    loading_strategy: on_demand
    cacheable: true
    location_pattern: "{project-root}/_bmad/{module}/workflows/{workflow}/workflow.md"

  WF_STEP:
    description: "Individual workflow step file"
    estimated_tokens: 3500  # Average
    range: [1000, 10000]
    loading_strategy: progressive
    cacheable: true
    location_pattern: "{workflow_path}/steps/step-{n}.md"

  WF_MANIFEST:
    description: "Full workflow manifest"
    estimated_tokens: 7400
    loading_strategy: avoid  # Use WF_INDEX instead
    cacheable: true
    location: "{project-root}/_bmad/_config/workflow-manifest.csv"

  WF_INDEX:
    description: "Minimal workflow ID to path mapping"
    estimated_tokens: 300
    loading_strategy: fallback
    cacheable: true
    location: "{project-root}/_bmad/_config/workflow-index.yaml"

  # Party mode components
  PARTY_ORCHESTRATOR:
    description: "Party mode orchestration rules"
    estimated_tokens: 1000
    loading_strategy: on_demand
    cacheable: true
    location: "{project-root}/_bmad/core/workflows/party-mode/workflow.md"

  PARTY_PRESETS:
    description: "Cross-module team presets"
    estimated_tokens: 11000
    loading_strategy: conditional
    condition: "using_preset"
    cacheable: true
    location: "{project-root}/_bmad/core/workflows/party-mode/presets/cross-module-groups.yaml"

  # Knowledge bases
  KNOWLEDGE:
    description: "Domain-specific knowledge files"
    estimated_tokens: 6000  # Average
    range: [2000, 25000]
    loading_strategy: lazy
    cacheable: true
    examples:
      - "{project-root}/_bmad/intel-team/knowledge/osint-knowledgebase.md"
      - "{project-root}/_bmad/bmm/testarch/knowledge/*.md"

  # Integrity checking (rarely needed)
  FILES_MANIFEST:
    description: "File integrity manifest"
    estimated_tokens: 25600
    loading_strategy: avoid
    condition: "security_verification_requested"
    cacheable: true
    location: "{project-root}/_bmad/_config/files-manifest.csv"

# =============================================================================
# SECTION 2: Intent Definitions
# =============================================================================

intents:
  AGENT_ACTIVATE:
    description: "User wants to work with a specific BMAD agent"
    token_budget:
      minimum: 29500
      typical: 32000
      maximum: 38000

  WORKFLOW_EXECUTE:
    description: "User wants to run a structured workflow"
    token_budget:
      minimum: 32000
      typical: 42000
      maximum: 60000

  PARTY_MODE:
    description: "User wants multiple agents in conversation"
    token_budget:
      minimum: 35000
      typical: 45000
      maximum: 55000

  QUICK_CHAT:
    description: "User has a quick question, no formal process"
    token_budget:
      minimum: 27000
      typical: 28000
      maximum: 30000

  RESEARCH:
    description: "User wants deep research on a topic"
    token_budget:
      minimum: 40000
      typical: 60000
      maximum: 100000

  PROJECT_MGMT:
    description: "User wants to manage projects/tasks"
    token_budget:
      minimum: 32000
      typical: 36000
      maximum: 45000

  CODE_DEV:
    description: "User wants to write/review code"
    token_budget:
      minimum: 35000
      typical: 45000
      maximum: 80000

  DOCUMENTATION:
    description: "User wants to create/update docs"
    token_budget:
      minimum: 33000
      typical: 38000
      maximum: 50000

  SECURITY_OPS:
    description: "User needs security assessment/response"
    token_budget:
      minimum: 40000
      typical: 55000
      maximum: 85000

  INTEL_OPS:
    description: "User needs OSINT/intelligence work"
    token_budget:
      minimum: 45000
      typical: 65000
      maximum: 100000

# =============================================================================
# SECTION 3: Intent Detection Rules
# =============================================================================

detection_rules:
  # Signal weights for scoring
  signal_weights:
    explicit_command: 1.0    # /command or direct invocation
    keyword_match: 0.7       # Keywords from intent vocabulary
    pattern_match: 0.5       # Regex patterns
    context_continuation: 0.8  # Continuing previous intent
    project_state: 0.3       # Project phase suggests intent
    history_inference: 0.4   # Based on conversation history

  # Confidence thresholds
  thresholds:
    high_confidence: 0.7     # Proceed without clarification
    medium_confidence: 0.4   # May need clarification
    low_confidence: 0.3      # Default to QUICK_CHAT
    ambiguity_gap: 0.2       # Gap between top 2 for ambiguity

  # Keyword vocabularies per intent
  keywords:
    AGENT_ACTIVATE:
      primary:
        - "talk to"
        - "speak with"
        - "get"
        - "bring in"
        - "activate"
        - "start"
        - "need"
        - "want"
        - "call"
        - "summon"
      role_based:
        - "architect"
        - "developer"
        - "analyst"
        - "designer"
        - "manager"
        - "expert"
        - "specialist"

    WORKFLOW_EXECUTE:
      primary:
        - "run"
        - "execute"
        - "start workflow"
        - "begin"
        - "do"
        - "perform"
      creation:
        - "create"
        - "generate"
        - "build"
        - "make"
        - "produce"

    PARTY_MODE:
      primary:
        - "party mode"
        - "team discussion"
        - "group"
        - "together"
        - "collaborate"
        - "all agents"
        - "multiple agents"
        - "team meeting"

    QUICK_CHAT:
      questions:
        - "what is"
        - "what's"
        - "how do"
        - "how does"
        - "can you"
        - "could you"
        - "explain"
        - "help"
        - "tell me"
      modifiers:
        - "question"
        - "quick"
        - "just"
        - "simply"
        - "briefly"

    RESEARCH:
      primary:
        - "research"
        - "investigate"
        - "find out"
        - "analyze"
        - "study"
        - "explore"
        - "deep dive"
        - "look into"
      domains:
        - "market"
        - "competitor"
        - "technical"
        - "domain"

    PROJECT_MGMT:
      project:
        - "project"
        - "status"
        - "progress"
        - "track"
        - "manage"
      agile:
        - "sprint"
        - "epic"
        - "story"
        - "backlog"
      routing:
        - "what's next"
        - "next step"
        - "what should"
        - "assign"

    CODE_DEV:
      development:
        - "implement"
        - "code"
        - "develop"
        - "build"
        - "write"
      maintenance:
        - "fix"
        - "bug"
        - "refactor"
        - "update"
        - "modify"
      quality:
        - "test"
        - "review"
        - "check"
        - "verify"

    DOCUMENTATION:
      primary:
        - "document"
        - "docs"
        - "readme"
        - "write up"
        - "technical writing"
      types:
        - "api docs"
        - "user guide"
        - "reference"
        - "tutorial"

    SECURITY_OPS:
      threats:
        - "security"
        - "vulnerability"
        - "threat"
        - "exploit"
        - "attack"
        - "breach"
        - "incident"
        - "malware"
      processes:
        - "audit"
        - "assessment"
        - "penetration"
        - "pentest"
        - "red team"
        - "blue team"
      compliance:
        - "compliance"
        - "gdpr"
        - "hipaa"
        - "pci"
        - "soc"
        - "nist"

    INTEL_OPS:
      intelligence:
        - "osint"
        - "intelligence"
        - "recon"
        - "reconnaissance"
      investigation:
        - "target"
        - "investigate"
        - "attribution"
        - "campaign"
        - "actor"
        - "adversary"
      analysis:
        - "threat actor"
        - "indicator"
        - "ioc"
        - "ttp"

  # Command patterns (regex)
  patterns:
    WORKFLOW_EXECUTE: "^/[\\w-]+"
    AGENT_ACTIVATE: "(?:@|talk\\s+to\\s+)\\w+"
    PARTY_MODE: "(?:party|team)\\s+mode"
    PROJECT_MGMT: "(?:project|sprint|epic)\\s+\\w+"

  # Pivot detection phrases
  pivot_phrases:
    - "actually"
    - "let's switch"
    - "instead"
    - "wait"
    - "never mind"
    - "forget that"
    - "change of plans"

# =============================================================================
# SECTION 4: Context Loading Rules by Intent
# =============================================================================

context_rules:
  # Base rules applied to all intents
  base:
    always_load:
      - component: SYS_BASE
        reason: "Required for Claude Code operation"
      - component: TOOL_DEFS
        reason: "Required for tool usage"
      - component: SEC_RULES
        reason: "Security is always required"

    conditional_load:
      - component: GIT_STATUS
        condition: "is_development_context"
        reason: "Git context for development tasks"
      - component: PROJ_CTX
        condition: "file_exists(output_folder/project-context.md)"
        reason: "Project rules and coding standards"

  # Intent-specific rules
  AGENT_ACTIVATE:
    description: "Load only the specific agent requested"
    load:
      - component: AGENT_FILE
        selector: detected_agent
        fallback: AGENT_INDEX
        reason: "Agent persona for interaction"
      - component: SKILL_LIST
        variant: minimal
        reason: "Agent may invoke skills"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - WF_FILE
      - WF_STEP
      - PARTY_PRESETS
      - KNOWLEDGE
      - FILES_MANIFEST

    progressive: []

  WORKFLOW_EXECUTE:
    description: "Load workflow entry, current step, and primary agent"
    load:
      - component: WF_FILE
        selector: detected_workflow
        reason: "Workflow definition and instructions"
      - component: WF_STEP
        selector: current_step_only
        reason: "Current step instructions"
      - component: AGENT_FILE
        selector: workflow_primary_agent
        reason: "Primary agent for workflow"
      - component: SKILL_LIST
        variant: full
        reason: "Workflow may invoke other skills"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - FILES_MANIFEST
      - PARTY_PRESETS
      - Other workflows

    progressive:
      - component: WF_STEP
        strategy: load_next_on_completion
        reason: "Load steps as workflow progresses"
      - component: KNOWLEDGE
        strategy: load_on_reference
        reason: "Load knowledge when needed"

  PARTY_MODE:
    description: "Load agent summaries, full file only when speaking"
    load:
      - component: PARTY_ORCHESTRATOR
        reason: "Orchestration rules for multi-agent"
      - component: AGENT_SUM
        selector: participating_agents
        reason: "Identity summaries for all agents"
      - component: SKILL_LIST
        variant: minimal
        reason: "May switch to workflow"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - WF_FILE
      - WF_STEP
      - FILES_MANIFEST
      - Full AGENT_FILEs initially

    conditional:
      - component: PARTY_PRESETS
        condition: using_preset
        reason: "Preset definitions when using presets"
      - component: AGENT_FILE
        condition: agent_is_speaking
        strategy: load_and_cache
        reason: "Full persona when agent speaks"

    progressive:
      - component: AGENT_FILE
        strategy: load_on_first_speak
        reason: "Cache agent file when first contributing"

  QUICK_CHAT:
    description: "Minimal context for simple questions"
    load:
      - component: SKILL_LIST
        variant: minimal
        reason: "May want to invoke skill"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - WF_FILE
      - WF_STEP
      - AGENT_FILE
      - PARTY_PRESETS
      - KNOWLEDGE
      - FILES_MANIFEST
      - GIT_STATUS  # Unless question is about code

    conditional:
      - component: PROJ_CTX
        condition: question_about_project
        reason: "Project context if question relates"

    progressive: []

  RESEARCH:
    description: "Load research tools and knowledge as needed"
    load:
      - component: SKILL_LIST
        variant: full
        reason: "Research workflows available"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - PARTY_PRESETS
      - FILES_MANIFEST

    conditional:
      - component: WF_FILE
        condition: using_research_workflow
        reason: "Structured research if workflow chosen"
      - component: AGENT_FILE
        condition: agent_specified
        reason: "Agent if research requires specialist"

    progressive:
      - component: KNOWLEDGE
        strategy: load_on_reference
        reason: "Domain knowledge as needed"

  PROJECT_MGMT:
    description: "Load Abdul and project management context"
    load:
      - component: AGENT_FILE
        selector: abdul
        reason: "Project manager agent"
      - component: SKILL_LIST
        variant: full
        reason: "May need various workflows"
      - component: WF_INDEX
        reason: "Know available workflows"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - FILES_MANIFEST
      - PARTY_PRESETS
      - KNOWLEDGE

    conditional:
      - component: WF_FILE
        condition: workflow_selected
        reason: "Load workflow when selected"

    progressive:
      - component: WF_FILE
        strategy: load_on_selection
        reason: "Load workflow when user chooses"

  CODE_DEV:
    description: "Load dev agent, story context, and project rules"
    load:
      - component: AGENT_FILE
        selector: dev
        reason: "Developer agent"
      - component: PROJ_CTX
        reason: "Coding standards and patterns"
      - component: GIT_STATUS
        reason: "Current code state"
      - component: SKILL_LIST
        variant: minimal
        reason: "May invoke test/review workflows"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - FILES_MANIFEST
      - PARTY_PRESETS
      - KNOWLEDGE

    conditional:
      - component: WF_FILE
        condition: executing_story
        selector: dev-story workflow
        reason: "Story execution workflow"
      - component: WF_STEP
        condition: executing_story
        reason: "Current story step"

    progressive:
      - component: WF_STEP
        strategy: load_on_task_completion
        reason: "Progress through story tasks"

  DOCUMENTATION:
    description: "Load tech writer and documentation context"
    load:
      - component: AGENT_FILE
        selector: tech-writer
        reason: "Documentation specialist"
      - component: SKILL_LIST
        variant: minimal
        reason: "May use doc workflows"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - FILES_MANIFEST
      - PARTY_PRESETS
      - KNOWLEDGE

    conditional:
      - component: PROJ_CTX
        condition: documenting_project
        reason: "Project context for accurate docs"
      - component: GIT_STATUS
        condition: documenting_code
        reason: "Code state for API docs"

    progressive: []

  SECURITY_OPS:
    description: "Load security agents and workflows progressively"
    load:
      - component: AGENT_FILE
        selector: security_lead_agent
        reason: "Primary security agent"
      - component: SKILL_LIST
        variant: full
        reason: "Security workflows available"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - Non-security agents
      - Non-security workflows

    conditional:
      - component: WF_FILE
        condition: workflow_identified
        reason: "Security workflow when identified"
      - component: PARTY_PRESETS
        condition: team_requested
        reason: "Security team preset"
      - component: FILES_MANIFEST
        condition: integrity_check_requested
        reason: "For security verification"

    progressive:
      - component: AGENT_FILE
        selector: additional_security_agents
        strategy: load_as_needed
        reason: "Specialists as needed"
      - component: KNOWLEDGE
        strategy: load_on_reference
        reason: "Security knowledge bases"

  INTEL_OPS:
    description: "Load intel agents and OSINT knowledge"
    load:
      - component: AGENT_FILE
        selector: osint-lead
        reason: "Intel operations lead"
      - component: SKILL_LIST
        variant: full
        reason: "Intel workflows available"

    skip:
      - AGENT_MANIFEST
      - WF_MANIFEST
      - Non-intel agents
      - Non-intel workflows

    conditional:
      - component: WF_FILE
        condition: workflow_identified
        reason: "Intel workflow when identified"
      - component: PARTY_PRESETS
        condition: team_requested
        reason: "Intel team preset"

    progressive:
      - component: AGENT_FILE
        selector: additional_intel_agents
        strategy: load_as_needed
        reason: "Specialists as needed"
      - component: KNOWLEDGE
        selector: osint_knowledge
        strategy: load_on_reference
        reason: "OSINT knowledge base"

# =============================================================================
# SECTION 5: Ambiguity Handling
# =============================================================================

ambiguity_handling:
  # When confidence is below threshold
  low_confidence_strategy:
    action: default_to_minimal
    default_intent: QUICK_CHAT
    load_components:
      - SYS_BASE
      - TOOL_DEFS
      - SEC_RULES
      - SKILL_LIST (minimal)
    prompt_clarification: true
    clarification_message: >
      I'd like to help, but I want to load the right context.
      What would you like to do?

  # When two intents are close in score
  ambiguous_intents:
    score_gap_threshold: 0.2
    secondary_score_minimum: 0.4
    action: ask_clarification

    clarification_templates:
      AGENT_ACTIVATE_vs_WORKFLOW_EXECUTE: >
        Would you like to chat with {agent} directly, or run a specific workflow?
      CODE_DEV_vs_SECURITY_OPS: >
        Are you looking to write/review code, or perform a security assessment?
      PARTY_MODE_vs_AGENT_ACTIVATE: >
        Would you like a group discussion (party mode) or to work with just one agent?
      WORKFLOW_EXECUTE_vs_QUICK_CHAT: >
        Would you like to run a structured workflow, or just get a quick answer?
      SECURITY_OPS_vs_INTEL_OPS: >
        Is this about defending systems (security) or gathering intelligence (OSINT)?

  # Ambiguity additions (minimal extra context for alternative intents)
  ambiguity_additions:
    AGENT_ACTIVATE:
      - AGENT_INDEX  # Quick lookup if intent changes
    WORKFLOW_EXECUTE:
      - WF_INDEX  # Quick lookup if intent changes
    PARTY_MODE:
      - AGENT_INDEX  # Know available agents

# =============================================================================
# SECTION 6: Intent Refinement Protocol
# =============================================================================

refinement_protocol:
  # When to re-evaluate intent
  refinement_triggers:
    - type: explicit_pivot
      patterns: ["actually", "let's switch", "instead", "wait", "never mind"]
      action: full_redetection

    - type: command_invocation
      pattern: "^/"
      action: switch_to_WORKFLOW_EXECUTE

    - type: agent_mention
      condition: "not currently in AGENT_ACTIVATE"
      action: evaluate_for_AGENT_ACTIVATE

    - type: turn_count
      every_n_turns: 5
      action: background_evaluation

    - type: topic_shift
      detection: keyword_category_change
      action: evaluate_new_intent

  # How to handle intent changes
  intent_change_handling:
    # Strong new signal
    high_confidence_change:
      threshold: 0.6
      action: switch_intent
      context_adjustment: differential_load

    # Weak signal - might be noise
    low_confidence_change:
      threshold: 0.4
      action: keep_current_if_stronger
      buffer: 0.2  # Current must be this much stronger

    # Unclear
    unclear_change:
      action: flag_ambiguous
      prompt_user: true

  # Context adjustment on refinement
  context_adjustment:
    strategy: differential
    rules:
      - add: new_required - old_required
      - keep: old_required & new_required
      - deprioritize: old_required - new_required
      - never_remove_while_cached: true

