# BMAD Team Orchestration Template Selection Workflow
# Provides pre-configured multi-team orchestration templates for common scenarios
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Team Orchestration Templates
    id: select-template
    version: "2.0.0"
    description: "Select and invoke pre-configured team orchestration templates for multi-module projects"
    category: "team-orchestration"
    estimated_duration: "5-15 minutes"
    complexity: "medium"

  # Workflow Inputs
  inputs:
    - name: scenario_type
      type: string
      required: false
      options: ["security_incident", "compliance_audit", "strategic_initiative", "threat_assessment", "legal_matter", "multi_domain"]
    - name: urgency_level
      type: string
      required: true
      default: "normal"
      options: ["low", "normal", "high", "critical", "emergency"]
    - name: scope
      type: string
      required: false
      options: ["internal", "client", "regulatory", "strategic", "operational"]
    - name: stakeholders
      type: array
      required: false
      description: "Key stakeholders to involve"

  # Workflow Outputs
  outputs:
    - name: selected_template
      type: object
      description: "Selected orchestration template"
    - name: team_assignments
      type: object
      description: "Specific team and agent assignments"
    - name: coordination_plan
      type: object
      description: "Coordination and communication plan"
    - name: execution_roadmap
      type: array
      description: "Step-by-step execution plan"

# Workflow Steps
steps:
  - number: 1
    name: "Scenario Analysis"
    description: "Analyze requirements and match to orchestration templates"
    action: "analyze_scenario"
    logic: |
      1. Parse input requirements and context
      2. Identify key stakeholders and constraints
      3. Assess scope and complexity
      4. Determine coordination requirements
      5. Match requirements to available templates

  - number: 2
    name: "Template Presentation"
    description: "Present relevant orchestration templates"
    action: "present_templates"
    logic: |
      1. Filter templates by relevance score
      2. Present top matching templates
      3. Highlight key differences and benefits
      4. Allow user selection or customization
      5. Provide template preview and details

  - number: 3
    name: "Template Customization"
    description: "Customize selected template for specific requirements"
    action: "customize_template"
    logic: |
      1. Load base template configuration
      2. Apply scenario-specific customizations
      3. Adjust team assignments based on availability
      4. Configure communication protocols
      5. Set timeline and milestone adjustments

  - number: 4
    name: "Team Orchestration Setup"
    description: "Initialize multi-team coordination"
    action: "setup_orchestration"
    logic: |
      1. Create coordination workspace
      2. Assign team leads and coordination roles
      3. Establish communication channels
      4. Set up progress tracking and reporting
      5. Initialize cross-team dependencies

  - number: 5
    name: "Execute Orchestration"
    description: "Launch coordinated multi-team execution"
    action: "execute_coordination"
    output_format: |
      ## 🎭 Team Orchestration Activated

      **Template:** {selected_template.name}
      **Scenario:** {scenario_type} | **Urgency:** {urgency_level}

      ### Orchestration Overview
      {selected_template.description}

      **Coordination Approach:** {coordination_approach}
      **Expected Duration:** {estimated_duration}
      **Success Criteria:** {success_criteria}

      ---

      ## 👥 Team Assignments

      ### Primary Coordination
      **Orchestration Lead:** Abdul (Master Project Manager)
      **Deputy Coordinator:** {deputy_coordinator}

      ### Team Assignments
      {for team in team_assignments}
      #### {team.name}
      **Role:** {team.role_in_orchestration}
      **Lead Agent:** {team.lead_agent}
      **Supporting Agents:** {team.supporting_agents}
      **Responsibilities:**
      {for responsibility in team.responsibilities}
      - {responsibility}
      {/for}
      **Deliverables:** {team.expected_deliverables}
      {/for}

      ---

      ## 📋 Execution Roadmap

      ### Phase 1: Initialization ({phase1_duration})
      {for step in phase1_steps}
      **{step.order}.** {step.title} (Owner: {step.owner})
      {step.description}
      {/for}

      ### Phase 2: Coordinated Execution ({phase2_duration})
      {for step in phase2_steps}
      **{step.order}.** {step.title} (Owner: {step.owner})
      {step.description}
      {/for}

      ### Phase 3: Integration & Completion ({phase3_duration})
      {for step in phase3_steps}
      **{step.order}.** {step.title} (Owner: {step.owner})
      {step.description}
      {/for}

      ---

      ## 🔄 Coordination Protocols

      ### Communication Schedule
      {for meeting in communication_schedule}
      **{meeting.type}:** {meeting.frequency}
      - **Participants:** {meeting.participants}
      - **Purpose:** {meeting.purpose}
      - **Format:** {meeting.format}
      {/for}

      ### Decision Making
      **Decision Authority:** {decision_authority}
      **Escalation Path:** {escalation_path}
      **Conflict Resolution:** {conflict_resolution_process}

      ### Progress Tracking
      **Reporting Frequency:** {reporting_frequency}
      **Status Dashboard:** {dashboard_location}
      **Milestone Reviews:** {milestone_review_schedule}

      ---

      ## 🎯 Next Steps

      1. **[L]** Launch coordinated execution
      2. **[M]** Modify team assignments or timeline
      3. **[C]** Customize coordination protocols
      4. **[S]** Set up alternative orchestration approach

# Orchestration Templates
orchestration_templates:
  security_incident_response:
    name: "Security Incident Response Orchestration"
    description: "Coordinated response to security incidents involving all relevant teams"
    scenario_types: ["security_incident", "cyber_attack", "data_breach"]
    urgency_levels: ["high", "critical", "emergency"]

    team_configuration:
      primary_team: "cybersec-team"
      supporting_teams: ["intel-team", "legal-team", "strategy-team"]

    coordination_approach: "incident_command_system"
    estimated_duration: "3-72 hours"

    phases:
      - name: "Immediate Response"
        duration: "0-4 hours"
        focus: "containment_and_assessment"

      - name: "Investigation & Analysis"
        duration: "4-24 hours"
        focus: "threat_analysis_and_attribution"

      - name: "Recovery & Communication"
        duration: "24-72 hours"
        focus: "system_recovery_and_stakeholder_communication"

  compliance_audit_coordination:
    name: "Compliance Audit Coordination"
    description: "Multi-team coordination for regulatory compliance audits"
    scenario_types: ["compliance_audit", "regulatory_review", "certification"]
    urgency_levels: ["normal", "high"]

    team_configuration:
      primary_team: "legal-team"
      supporting_teams: ["cybersec-team", "strategy-team"]

    coordination_approach: "structured_collaboration"
    estimated_duration: "2-8 weeks"

  strategic_initiative_launch:
    name: "Strategic Initiative Launch"
    description: "Cross-functional coordination for strategic initiatives"
    scenario_types: ["strategic_initiative", "business_transformation", "new_market_entry"]
    urgency_levels: ["normal", "high"]

    team_configuration:
      primary_team: "strategy-team"
      supporting_teams: ["legal-team", "cybersec-team", "intel-team"]

    coordination_approach: "agile_coordination"
    estimated_duration: "4-16 weeks"

  threat_assessment_collaboration:
    name: "Comprehensive Threat Assessment"
    description: "Multi-perspective threat analysis and response planning"
    scenario_types: ["threat_assessment", "risk_evaluation", "vulnerability_analysis"]
    urgency_levels: ["normal", "high", "critical"]

    team_configuration:
      primary_team: "intel-team"
      supporting_teams: ["cybersec-team", "strategy-team", "legal-team"]

    coordination_approach: "collaborative_analysis"
    estimated_duration: "1-4 weeks"

  legal_crisis_management:
    name: "Legal Crisis Management"
    description: "Coordinated response to legal challenges and disputes"
    scenario_types: ["legal_crisis", "litigation_threat", "regulatory_enforcement"]
    urgency_levels: ["high", "critical"]

    team_configuration:
      primary_team: "legal-team"
      supporting_teams: ["strategy-team", "intel-team", "cybersec-team"]

    coordination_approach: "crisis_management"
    estimated_duration: "1-12 weeks"

  multi_domain_project:
    name: "Multi-Domain Project Coordination"
    description: "Complex projects requiring all team expertise"
    scenario_types: ["multi_domain", "complex_project", "enterprise_initiative"]
    urgency_levels: ["normal", "high"]

    team_configuration:
      primary_team: "strategy-team"
      supporting_teams: ["cybersec-team", "intel-team", "legal-team"]

    coordination_approach: "matrix_coordination"
    estimated_duration: "6-24 weeks"

# Coordination Approaches
coordination_approaches:
  incident_command_system:
    description: "Hierarchical command structure for emergency response"
    characteristics: ["centralized_command", "clear_chain_of_command", "rapid_decision_making"]
    best_for: ["emergency_response", "time_critical_situations", "high_stakes_scenarios"]

    communication_frequency: "continuous_during_active_phase"
    decision_making: "centralized_with_delegation"
    reporting_structure: "hierarchical"

  structured_collaboration:
    description: "Systematic collaboration with defined roles and processes"
    characteristics: ["defined_roles", "structured_processes", "regular_checkpoints"]
    best_for: ["compliance_projects", "audit_preparation", "process_improvement"]

    communication_frequency: "scheduled_regular_meetings"
    decision_making: "consensus_with_lead_authority"
    reporting_structure: "matrix"

  agile_coordination:
    description: "Flexible, iterative approach with regular adaptation"
    characteristics: ["iterative_planning", "regular_adaptation", "cross_functional_teams"]
    best_for: ["strategic_initiatives", "innovation_projects", "adaptive_planning"]

    communication_frequency: "daily_standups_weekly_reviews"
    decision_making: "collaborative_with_clear_ownership"
    reporting_structure: "flat_with_leads"

  collaborative_analysis:
    description: "Joint analysis and decision-making across teams"
    characteristics: ["shared_analysis", "collective_intelligence", "consensus_building"]
    best_for: ["complex_analysis", "multi_perspective_assessment", "knowledge_synthesis"]

    communication_frequency: "regular_collaboration_sessions"
    decision_making: "consensus_based"
    reporting_structure: "peer_to_peer"

  crisis_management:
    description: "Rapid response with clear escalation and communication"
    characteristics: ["rapid_response", "clear_escalation", "stakeholder_communication"]
    best_for: ["crisis_situations", "reputation_management", "damage_control"]

    communication_frequency: "real_time_during_crisis"
    decision_making: "executive_authority_with_expert_input"
    reporting_structure: "crisis_command"

  matrix_coordination:
    description: "Complex coordination across multiple dimensions"
    characteristics: ["multi_dimensional_coordination", "shared_resources", "complex_dependencies"]
    best_for: ["enterprise_projects", "multi_stakeholder_initiatives", "complex_transformations"]

    communication_frequency: "structured_multi_level_communication"
    decision_making: "distributed_with_coordination_oversight"
    reporting_structure: "multi_dimensional_matrix"

# Template Selection Logic
template_selection_logic:
  scenario_matching:
    weights:
      scenario_type_match: 40
      urgency_alignment: 25
      team_expertise_match: 20
      complexity_appropriateness: 15

  customization_factors:
    - "available_team_capacity"
    - "specific_stakeholder_requirements"
    - "timeline_constraints"
    - "resource_limitations"
    - "regulatory_requirements"

  success_criteria:
    - "clear_role_definition"
    - "effective_communication_protocols"
    - "appropriate_decision_making_structure"
    - "realistic_timeline_and_milestones"
    - "measurable_success_metrics"

# Integration Points
integrations:
  intelligent_routing:
    purpose: "Optimize team and agent assignments"
    path: "core/workflows/intelligent-routing"

  project_manager:
    purpose: "Create projects for orchestrated initiatives"
    path: "project-manager/create-project"

  cross_module_consultation:
    purpose: "Facilitate cross-team collaboration"
    path: "cross-module/consultation"

# Quality Assurance
quality_metrics:
  template_appropriateness:
    - "Template matches scenario requirements"
    - "Team assignments are optimal"
    - "Coordination approach is suitable"
    - "Timeline is realistic"

  orchestration_effectiveness:
    - "Clear role definitions established"
    - "Communication protocols defined"
    - "Decision-making authority clarified"
    - "Progress tracking configured"

  stakeholder_alignment:
    - "Stakeholder expectations managed"
    - "Communication needs addressed"
    - "Escalation paths established"
    - "Success criteria agreed upon"