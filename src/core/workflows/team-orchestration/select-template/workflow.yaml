# Select Team Orchestration Template Workflow
name: select-template
description: "Select and invoke a team orchestration template for multi-module projects"
author: "BMad"

# Critical variables from config
config_source: "{project-root}/src/core/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/src/core/workflows/team-orchestration/select-template"
instructions: "{installed_path}/instructions.md"

# Available templates
templates:
  secure-software:
    path: "{project-root}/src/core/workflows/team-orchestration/secure-software/workflow.yaml"
  incident-response:
    path: "{project-root}/src/core/workflows/team-orchestration/incident-response/workflow.yaml"
  strategic-decision:
    path: "{project-root}/src/core/workflows/team-orchestration/strategic-decision/workflow.yaml"
  compliance-first:
    path: "{project-root}/src/core/workflows/team-orchestration/compliance-first/workflow.yaml"

# Related workflows
phase_gate: "{project-root}/src/core/workflows/team-orchestration/phase-gate/workflow.yaml"
conflict_resolution: "{project-root}/src/core/workflows/team-orchestration/conflict-resolution/workflow.yaml"

standalone: true
