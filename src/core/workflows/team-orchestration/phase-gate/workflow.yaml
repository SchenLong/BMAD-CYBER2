# BMAD Phase Gate Validation Workflow
# Validates phase gate requirements before project phase transitions
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Check Phase Gate
    id: phase-gate
    version: "2.0.0"
    description: "Validate phase gate requirements before project phase transitions with multi-team review"
    category: "quality-assurance"
    estimated_duration: "10-30 minutes"
    complexity: "medium"

  # Workflow Inputs
  inputs:
    - name: project_id
      type: string
      required: true
      description: "Project undergoing phase gate review"
    - name: current_phase
      type: string
      required: true
      options: ["initiation", "planning", "execution", "monitoring", "closure"]
    - name: target_phase
      type: string
      required: true
      options: ["planning", "execution", "monitoring", "closure", "archive"]
    - name: gate_type
      type: string
      required: true
      options: ["standard", "quality", "security", "compliance", "stakeholder", "comprehensive"]
    - name: stakeholder_signoff_required
      type: boolean
      required: false
      default: false

  # Workflow Outputs
  outputs:
    - name: gate_status
      type: string
      description: "Overall gate validation status"
      options: ["passed", "conditional_pass", "failed", "requires_review"]
    - name: validation_results
      type: object
      description: "Detailed validation results by criteria"
    - name: action_items
      type: array
      description: "Required actions before phase transition"
    - name: team_signoffs
      type: object
      description: "Signoff status from each relevant team"
    - name: recommendations
      type: array
      description: "Recommendations for next phase success"

# Workflow Steps
steps:
  - number: 1
    name: "Gate Criteria Definition"
    description: "Define specific criteria for the phase gate validation"
    action: "define_criteria"
    logic: |
      1. Load phase gate requirements for current transition
      2. Identify teams required for validation
      3. Define success criteria and metrics
      4. Establish validation methodology
      5. Set acceptance thresholds

  - number: 2
    name: "Project Deliverable Assessment"
    description: "Assess completion and quality of phase deliverables"
    action: "assess_deliverables"
    logic: |
      1. Review all required deliverables for current phase
      2. Validate completeness and quality standards
      3. Check stakeholder acceptance and approval
      4. Identify any gaps or deficiencies
      5. Calculate deliverable completion score

  - number: 3
    name: "Multi-Team Validation"
    description: "Conduct validation review with relevant teams"
    action: "multi_team_validation"
    logic: |
      For each relevant team:
      1. Review team-specific deliverables and criteria
      2. Assess quality and compliance standards
      3. Validate readiness for next phase
      4. Identify risks and mitigation requirements
      5. Provide team signoff recommendation

  - number: 4
    name: "Risk and Readiness Assessment"
    description: "Evaluate risks and readiness for phase transition"
    action: "assess_readiness"
    logic: |
      1. Analyze project health and progress metrics
      2. Assess team capacity and capability for next phase
      3. Identify potential risks and blockers
      4. Evaluate stakeholder alignment and support
      5. Review resource availability and allocation

  - number: 5
    name: "Gate Decision Synthesis"
    description: "Synthesize all inputs and make gate decision"
    action: "synthesize_decision"
    logic: |
      1. Aggregate all validation results and team input
      2. Apply gate criteria and decision rules
      3. Identify critical path issues and dependencies
      4. Generate action items for any gaps
      5. Formulate final gate recommendation

  - number: 6
    name: "Present Gate Results"
    description: "Present comprehensive phase gate validation results"
    action: "present_results"
    output_format: |
      ## 🚪 Phase Gate Validation Results

      **Project:** {project_name} (ID: {project_id})
      **Phase Transition:** {current_phase} → {target_phase}
      **Gate Type:** {gate_type}
      **Validation Date:** {current_date}

      ---

      ## 🎯 Gate Decision

      ### **Status: {gate_status}**

      {if gate_status == "passed"}
      ✅ **GATE PASSED** - Project is ready to proceed to {target_phase} phase.
      {elif gate_status == "conditional_pass"}
      ⚠️ **CONDITIONAL PASS** - Project may proceed with specific conditions and action items.
      {elif gate_status == "failed"}
      ❌ **GATE FAILED** - Critical issues must be resolved before phase transition.
      {else}
      🔍 **REQUIRES REVIEW** - Additional stakeholder review required for decision.
      {/if}

      **Overall Score:** {overall_score}/100
      **Confidence Level:** {confidence_level}%

      ---

      ## 📊 Validation Summary

      ### Deliverable Assessment
      **Completion Rate:** {deliverable_completion}%
      **Quality Score:** {deliverable_quality}/10
      **Stakeholder Approval:** {stakeholder_approval_status}

      ### Team Validation Results
      {for team in team_validations}
      #### {team.name} Team
      **Status:** {team.validation_status}
      **Score:** {team.score}/100
      **Signoff:** {team.signoff_status}

      **Key Findings:**
      {for finding in team.key_findings}
      - {finding}
      {/for}

      {if team.concerns}
      **Concerns:**
      {for concern in team.concerns}
      - {concern.description} (Priority: {concern.priority})
      {/for}
      {/if}
      {/for}

      ### Risk Assessment
      **Overall Risk Level:** {overall_risk_level}
      **Critical Risks:** {critical_risk_count}
      **Mitigation Coverage:** {mitigation_coverage}%

      ---

      ## ⚠️ Critical Issues

      {for issue in critical_issues}
      ### {issue.priority} Priority: {issue.title}
      **Description:** {issue.description}
      **Impact:** {issue.impact}
      **Required Action:** {issue.required_action}
      **Owner:** {issue.action_owner}
      **Target Resolution:** {issue.target_date}
      {/for}

      ---

      ## 📋 Action Items

      ### Must Complete Before Phase Transition
      {for action in mandatory_actions}
      - **{action.title}** (Owner: {action.owner}, Due: {action.due_date})
        {action.description}
      {/for}

      ### Recommended for Next Phase Success
      {for action in recommended_actions}
      - **{action.title}** (Owner: {action.owner}, Due: {action.due_date})
        {action.description}
      {/for}

      ### Monitoring and Follow-up
      {for action in monitoring_actions}
      - **{action.title}** (Owner: {action.owner}, Frequency: {action.frequency})
        {action.description}
      {/for}

      ---

      ## 🎯 Next Phase Readiness

      ### {target_phase} Phase Preparation
      **Readiness Score:** {next_phase_readiness}/100

      **Team Capacity Assessment:**
      {for team in teams}
      - **{team.name}:** {team.capacity_status} ({team.utilization}% current utilization)
      {/for}

      **Resource Allocation for {target_phase}:**
      {for resource in resource_allocation}
      - **{resource.type}:** {resource.allocation} ({resource.availability_status})
      {/for}

      **Key Success Factors for {target_phase}:**
      {for factor in success_factors}
      - {factor}
      {/for}

      ---

      ## 📈 Recommendations

      ### Immediate Recommendations
      {for rec in immediate_recommendations}
      - {rec.description} (Impact: {rec.impact})
      {/for}

      ### Strategic Recommendations
      {for rec in strategic_recommendations}
      - {rec.description} (Impact: {rec.impact})
      {/for}

      ### Process Improvement Opportunities
      {for opportunity in process_improvements}
      - {opportunity.description} (Effort: {opportunity.effort}, Benefit: {opportunity.benefit})
      {/for}

      ---

      ## 🔄 Next Steps

      {if gate_status == "passed"}
      1. **[P]** Proceed to {target_phase} phase
      2. **[I]** Initialize {target_phase} activities
      3. **[M]** Monitor recommended actions
      {elif gate_status == "conditional_pass"}
      1. **[A]** Complete mandatory action items
      2. **[R]** Re-validate gate criteria
      3. **[P]** Proceed upon satisfactory completion
      {elif gate_status == "failed"}
      1. **[F]** Focus on critical issues resolution
      2. **[E]** Execute action plan
      3. **[S]** Schedule gate re-evaluation
      {else}
      1. **[R]** Conduct stakeholder review
      2. **[D]** Make final gate decision
      3. **[C]** Communicate decision and rationale
      {/if}

      **Gate Review Completed by:** Abdul (Master Project Manager)

# Phase Gate Criteria
phase_gate_criteria:
  initiation_to_planning:
    deliverables:
      - "project_charter_approved"
      - "stakeholder_identification_complete"
      - "initial_requirements_gathered"
      - "team_assignments_confirmed"

    quality_criteria:
      - "clear_project_objectives_defined"
      - "success_criteria_established"
      - "resource_requirements_estimated"
      - "initial_risk_assessment_completed"

    team_validations:
      strategy_team: ["strategic_alignment", "stakeholder_analysis"]
      legal_team: ["legal_considerations", "compliance_requirements"]
      cybersec_team: ["security_requirements", "risk_assessment"]
      intel_team: ["information_requirements", "threat_landscape"]

  planning_to_execution:
    deliverables:
      - "detailed_project_plan_approved"
      - "work_breakdown_structure_complete"
      - "resource_allocation_finalized"
      - "communication_plan_established"

    quality_criteria:
      - "realistic_timeline_with_milestones"
      - "clear_roles_and_responsibilities"
      - "risk_mitigation_strategies_defined"
      - "quality_assurance_processes_established"

    team_validations:
      all_teams: ["plan_review", "capacity_confirmation", "dependency_validation"]

  execution_to_monitoring:
    deliverables:
      - "initial_deliverables_completed"
      - "team_coordination_functioning"
      - "progress_tracking_operational"
      - "stakeholder_communication_active"

    quality_criteria:
      - "deliverable_quality_meets_standards"
      - "team_performance_satisfactory"
      - "timeline_adherence_acceptable"
      - "risk_management_effective"

  monitoring_to_closure:
    deliverables:
      - "all_project_deliverables_completed"
      - "stakeholder_acceptance_obtained"
      - "documentation_finalized"
      - "lessons_learned_documented"

    quality_criteria:
      - "success_criteria_met"
      - "stakeholder_satisfaction_achieved"
      - "knowledge_transfer_completed"
      - "post_project_support_arranged"

# Validation Algorithms
validation_algorithms:
  deliverable_scoring:
    completion_weight: 40
    quality_weight: 35
    stakeholder_acceptance_weight: 25

  team_validation_scoring:
    technical_assessment: 30
    risk_evaluation: 25
    readiness_confirmation: 25
    recommendation_confidence: 20

  overall_gate_scoring:
    deliverable_score: 40
    team_validation_average: 35
    risk_assessment: 15
    stakeholder_alignment: 10

  decision_thresholds:
    passed: 85
    conditional_pass: 70
    requires_review: 50
    failed: "below_50"

# Risk Assessment Framework
risk_categories:
  technical_risks:
    - "technical_complexity_underestimated"
    - "skill_gaps_identified"
    - "technology_dependencies_uncertain"
    - "integration_challenges_anticipated"

  resource_risks:
    - "team_capacity_overcommitted"
    - "key_personnel_unavailable"
    - "budget_constraints_identified"
    - "external_dependencies_unreliable"

  stakeholder_risks:
    - "stakeholder_alignment_unclear"
    - "changing_requirements_anticipated"
    - "communication_gaps_identified"
    - "decision_authority_ambiguous"

  timeline_risks:
    - "aggressive_timeline_concerns"
    - "dependency_chain_vulnerabilities"
    - "external_milestone_dependencies"
    - "resource_contention_anticipated"

# Quality Metrics
quality_metrics:
  gate_effectiveness:
    - "Appropriate criteria applied"
    - "Thorough team validation conducted"
    - "Risks adequately assessed"
    - "Clear decision rationale provided"

  validation_completeness:
    - "All required deliverables reviewed"
    - "Team signoffs obtained"
    - "Action items clearly defined"
    - "Next phase readiness assessed"

  decision_quality:
    - "Decision aligns with evidence"
    - "Risks appropriately weighted"
    - "Stakeholder interests considered"
    - "Long-term project success optimized"

# Integration Points
integrations:
  project_registry:
    purpose: "Access project data and status"
    path: "{output_folder}/project-registry.yaml"

  team_workflows:
    purpose: "Team-specific validation processes"
    paths:
      - "cybersec-team/workflows/"
      - "intel-team/workflows/"
      - "legal-team/workflows/"
      - "strategy-team/workflows/"

  project_status:
    purpose: "Current project health metrics"
    path: "project-manager/project-status"