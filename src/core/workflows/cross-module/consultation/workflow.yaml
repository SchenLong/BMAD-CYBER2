    primary_domains:
      - "security_architecture"
      - "threat_assessment"
      - "vulnerability_analysis"
      - "compliance_requirements"
      - "incident_response"
    consultation_strengths:
      - "Technical risk evaluation"
      - "Security implications analysis"
      - "Compliance impact assessment"
      - "Threat landscape analysis"

  intel-team:
    primary_domains:
      - "threat_intelligence"
      - "osint_research"
      - "actor_attribution"
      - "reconnaissance_analysis"
      - "information_gathering"
    consultation_strengths:
      - "Threat actor analysis"
      - "Information validation"
      - "Competitive intelligence"
      - "Situational awareness"

  legal-team:
    primary_domains:
      - "legal_implications"
      - "regulatory_compliance"
      - "contract_analysis"
      - "dispute_resolution"
      - "cross_border_law"
    consultation_strengths:
      - "Legal risk assessment"
      - "Regulatory impact analysis"
      - "Compliance requirements"
      - "Jurisdictional considerations"

  strategy-team:
    primary_domains:
      - "strategic_analysis"
      - "stakeholder_management"
      - "risk_assessment"
      - "decision_frameworks"
      - "communication_strategy"
    consultation_strengths:
      - "Strategic implications"
      - "Stakeholder impact analysis"
      - "Decision frameworks"
      - "Communication planning"

# Collaboration Patterns
collaboration_patterns:
  security_legal:
    common_scenarios:
      - "Incident response legal implications"
      - "Compliance audit preparation"
      - "Data breach notification requirements"
    consultation_focus: "Legal compliance of security measures"

  security_intel:
    common_scenarios:
      - "Threat actor attribution"
      - "Attack campaign analysis"
      - "Security intelligence integration"
    consultation_focus: "Threat landscape and attack vectors"

  security_strategy:
    common_scenarios:
      - "Security program strategy"
      - "Risk communication to stakeholders"
      - "Security investment decisions"
    consultation_focus: "Business alignment of security initiatives"

  intel_legal:
    common_scenarios:
      - "Intelligence gathering legality"
      - "Evidence admissibility"
      - "Privacy and surveillance laws"
    consultation_focus: "Legal boundaries of intelligence activities"

  intel_strategy:
    common_scenarios:
      - "Competitive intelligence ethics"
      - "Strategic intelligence priorities"
      - "Intelligence-driven decision making"
    consultation_focus: "Strategic application of intelligence"

  legal_strategy:
    common_scenarios:
      - "Legal strategy development"
      - "Regulatory strategy"
      - "Stakeholder legal communication"
    consultation_focus: "Strategic legal decision making"

# Quality Assurance
quality_metrics:
  consultation_completeness:
    - "All relevant teams consulted"
    - "Key questions addressed"
    - "Consensus level documented"
    - "Action items defined"

  output_quality:
    - "Clear recommendations provided"
    - "Rationale documented"
    - "Implementation guidance included"
    - "Follow-up steps defined"

  process_efficiency:
    - "Consultation completed within timeline"
    - "All teams provided meaningful input"
    - "Conflicts resolved or documented"
    - "Clear next steps established"

# Integration Points
integrations:
  intelligent_routing:
    purpose: "Identify relevant consulting teams"
    path: "core/workflows/intelligent-routing"

  project_registry:
    purpose: "Link consultations to active projects"
    path: "{output_folder}/project-registry.yaml"

  team_manifests:
    purpose: "Access team capabilities and agents"
    path: "{project-root}/_bmad/_config/"