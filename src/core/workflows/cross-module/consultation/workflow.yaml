# BMAD Cross-Module Consultation Workflow
# Facilitates expertise sharing and collaboration between specialized teams
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Cross-Module Consultation
    id: cross-module-consultation
    version: "2.0.0"
    description: "Facilitates multi-disciplinary expertise sharing and collaborative problem-solving across all BMAD teams"
    category: "cross-team-coordination"
    estimated_duration: "10-30 minutes"
    complexity: "high"

  # Workflow Inputs
  inputs:
    - name: consultation_topic
      type: text
      required: true
      description: "The topic or problem requiring multi-disciplinary input"
    - name: primary_team
      type: string
      required: true
      options: ["cybersec-team", "intel-team", "legal-team", "strategy-team"]
      description: "Team leading the consultation"
    - name: consultation_type
      type: string
      required: true
      options: ["expertise_request", "second_opinion", "collaborative_analysis", "risk_assessment", "decision_support"]
      description: "Type of consultation needed"
    - name: urgency
      type: string
      required: true
      default: "normal"
      options: ["low", "normal", "high", "critical"]
    - name: context_documents
      type: array
      required: false
      description: "Reference documents or context materials"
    - name: specific_questions
      type: array
      required: false
      description: "Specific questions for consulting teams"

  # Workflow Outputs
  outputs:
    - name: consultation_summary
      type: text
      description: "Summary of consultation findings"
    - name: team_recommendations
      type: object
      description: "Recommendations from each consulting team"
    - name: action_items
      type: array
      description: "Follow-up actions identified"
    - name: consensus_level
      type: string
      description: "Level of agreement between teams"
    - name: next_steps
      type: array
      description: "Recommended next steps"

# Workflow Steps
steps:
  - number: 1
    name: "Consultation Planning"
    description: "Analyze consultation requirements and plan approach"
    action: "plan_consultation"
    logic: |
      1. Analyze consultation topic for key domains
      2. Identify which teams should be consulted
      3. Determine consultation format and timeline
      4. Prepare briefing materials and questions
      5. Set expectations and success criteria

  - number: 2
    name: "Team Identification"
    description: "Identify relevant teams and agents for consultation"
    action: "identify_consulting_teams"
    logic: |
      Use intelligent routing to determine:
      1. Which teams have relevant expertise
      2. Specific agents within teams to involve
      3. Order of consultation based on expertise relevance
      4. Potential collaboration synergies

  - number: 3
    name: "Context Preparation"
    description: "Prepare context and briefing materials for consulting teams"
    action: "prepare_context"
    logic: |
      1. Create standardized briefing document
      2. Extract key questions for each team
      3. Identify domain-specific considerations
      4. Prepare any technical documentation needed
      5. Set consultation parameters and constraints

  - number: 4
    name: "Multi-Team Consultation"
    description: "Conduct consultation with each relevant team"
    action: "conduct_consultations"
    logic: |
      For each consulting team:
      1. Present briefing and context
      2. Ask team-specific questions
      3. Gather domain expertise and insights
      4. Identify potential risks or concerns
      5. Collect recommendations and advice

  - number: 5
    name: "Cross-Team Analysis"
    description: "Analyze and synthesize input from all consulting teams"
    action: "synthesize_input"
    logic: |
      1. Identify common themes and agreements
      2. Highlight areas of disagreement or concern
      3. Analyze trade-offs between recommendations
      4. Assess feasibility and implementation challenges
      5. Identify additional expertise needed

  - number: 6
    name: "Consensus Building"
    description: "Work toward consensus or clearly identify trade-offs"
    action: "build_consensus"
    logic: |
      1. Present summary of all team input
      2. Facilitate discussion of disagreements
      3. Explore compromise solutions
      4. Document areas of consensus
      5. Clearly articulate remaining disagreements

  - number: 7
    name: "Recommendations Synthesis"
    description: "Create integrated recommendations and action plan"
    action: "create_recommendations"
    output_format: |
      ## 🤝 Cross-Module Consultation Results

      **Topic:** {consultation_topic}
      **Led by:** {primary_team}
      **Consultation Type:** {consultation_type}

      ### Executive Summary
      {consultation_summary}

      ### Team Input Summary

      #### Cybersecurity Perspective
      **Team:** cybersec-team
      **Key Insights:** {cybersec_insights}
      **Recommendations:** {cybersec_recommendations}
      **Risk Factors:** {cybersec_risks}

      #### Intelligence Perspective
      **Team:** intel-team
      **Key Insights:** {intel_insights}
      **Recommendations:** {intel_recommendations}
      **Risk Factors:** {intel_risks}

      #### Legal Perspective
      **Team:** legal-team
      **Key Insights:** {legal_insights}
      **Recommendations:** {legal_recommendations}
      **Risk Factors:** {legal_risks}

      #### Strategic Perspective
      **Team:** strategy-team
      **Key Insights:** {strategy_insights}
      **Recommendations:** {strategy_recommendations}
      **Risk Factors:** {strategy_risks}

      ### Consensus Analysis
      **Agreement Level:** {consensus_level}
      **Areas of Consensus:**
      {for item in consensus_areas}
      - {item}
      {/for}

      **Areas of Disagreement:**
      {for item in disagreement_areas}
      - {item.topic}: {item.positions}
      {/for}

      ### Integrated Recommendations
      {for recommendation in integrated_recommendations}
      {recommendation.priority}. **{recommendation.title}**
         - **Rationale:** {recommendation.rationale}
         - **Supporting Teams:** {recommendation.supporting_teams}
         - **Implementation:** {recommendation.implementation}
         - **Timeline:** {recommendation.timeline}
      {/for}

      ### Action Items
      {for action in action_items}
      - **{action.title}** (Owner: {action.owner}, Due: {action.due_date})
        {action.description}
      {/for}

      ### Next Steps
      1. **[I]** Implement recommendations as presented
      2. **[M]** Modify recommendations based on discussion
      3. **[F]** Follow up consultation on specific areas
      4. **[E]** Escalate disagreements for higher-level decision

# Consultation Types and Approaches
consultation_types:
  expertise_request:
    description: "Request specific expertise from other teams"
    approach: "sequential_consultation"
    expected_duration: "10-15 minutes"
    output_focus: "domain_expertise"

  second_opinion:
    description: "Validate approach or decision with other perspectives"
    approach: "parallel_review"
    expected_duration: "5-10 minutes"
    output_focus: "validation_feedback"

  collaborative_analysis:
    description: "Joint analysis of complex multi-disciplinary problem"
    approach: "collaborative_session"
    expected_duration: "20-30 minutes"
    output_focus: "integrated_solution"

  risk_assessment:
    description: "Multi-perspective risk evaluation"
    approach: "risk_matrix_development"
    expected_duration: "15-20 minutes"
    output_focus: "risk_mitigation"

  decision_support:
    description: "Support for strategic decision making"
    approach: "structured_decision_analysis"
    expected_duration: "15-25 minutes"
    output_focus: "decision_framework"

# Team Expertise Matrix
team_expertise:
