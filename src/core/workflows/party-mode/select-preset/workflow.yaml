# BMAD Party Mode Preset Selection Workflow
# Pre-configured agent group selections for Party Mode collaborative sessions
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Party Mode Presets
    id: select-preset
    version: "2.0.0"
    description: "Select pre-configured cross-module agent groups for Party Mode sessions"
    category: "collaborative-orchestration"
    estimated_duration: "2-5 minutes"
    complexity: "low"

  # Workflow Inputs
  inputs:
    - name: discussion_topic
      type: text
      required: false
      description: "Topic or challenge to discuss"
    - name: session_type
      type: string
      required: false
      options: ["brainstorming", "problem_solving", "strategic_planning", "crisis_response", "analysis", "decision_making"]
    - name: expertise_needed
      type: array
      required: false
      options: ["security", "intelligence", "legal", "strategy", "technical", "creative", "analytical"]
    - name: group_size_preference
      type: string
      required: false
      options: ["focused_3_5", "balanced_6_8", "comprehensive_9_12", "full_spectrum_all"]
      default: "balanced_6_8"

  # Workflow Outputs
  outputs:
    - name: selected_preset
      type: object
      description: "Selected preset configuration"
    - name: agent_lineup
      type: array
      description: "Specific agents included in the session"
    - name: facilitation_approach
      type: string
      description: "Recommended facilitation methodology"
    - name: session_structure
      type: object
      description: "Suggested session structure and timing"

# Workflow Steps
steps:
  - number: 1
    name: "Session Requirements Analysis"
    description: "Analyze requirements to recommend optimal presets"
    action: "analyze_requirements"
    logic: |
      1. Parse discussion topic for domain keywords
      2. Identify required expertise areas
      3. Assess collaboration complexity
      4. Determine optimal group dynamics
      5. Match requirements to available presets

  - number: 2
    name: "Preset Recommendations"
    description: "Present relevant preset options"
    action: "recommend_presets"
    logic: |
      1. Rank presets by relevance score
      2. Present top 3-4 matching presets
      3. Highlight unique value of each preset
      4. Show agent composition and expertise
      5. Provide customization options

  - number: 3
    name: "Preset Selection & Customization"
    description: "Select and customize chosen preset"
    action: "customize_preset"
    logic: |
      1. Load selected preset configuration
      2. Apply topic-specific customizations
      3. Adjust agent selection based on availability
      4. Configure session parameters
      5. Prepare facilitation guidelines

  - number: 4
    name: "Launch Party Mode Session"
    description: "Initialize collaborative session with selected agents"
    action: "launch_session"
    output_format: |
      ## 🎉 Party Mode Session Initialized

      **Preset:** {selected_preset.name}
      **Session Type:** {session_type}
      **Topic:** {discussion_topic}

      ---

      ## 👥 Agent Lineup

      {for agent in agent_lineup}
      ### {agent.name} ({agent.team})
      **Role:** {agent.role_in_session}
      **Expertise:** {agent.key_expertise}
      **Contribution Focus:** {agent.expected_contribution}
      {/for}

      ---

      ## 🎭 Session Configuration

      **Facilitation Approach:** {facilitation_approach}
      **Group Size:** {agent_lineup.length} agents
      **Expected Duration:** {estimated_session_duration}
      **Interaction Style:** {interaction_style}

      ### Session Structure
      {for phase in session_structure.phases}
      **Phase {phase.number}: {phase.name}** ({phase.duration})
      {phase.description}
      {/for}

      ---

      ## 🚀 Ready to Begin!

      **All agents are now active and ready for collaborative discussion.**

      Session will begin with introductions and topic framing, then proceed through structured collaborative exploration of: {discussion_topic}

      **[BEGIN SESSION]** - Start Party Mode discussion now
      **[MODIFY LINEUP]** - Adjust agent selection
      **[CHANGE APPROACH]** - Select different facilitation method

# Party Mode Presets
party_mode_presets:
  security_war_council:
    name: "Security War Council"
    description: "Elite security and intelligence team for threat response and analysis"
    focus_areas: ["threat_analysis", "incident_response", "security_strategy", "risk_assessment"]
    group_size: "focused_3_5"

    agent_composition:
      cybersec_team: ["security-architect", "threat-analyst", "penetration-tester"]
      intel_team: ["osint-lead", "threat-actor-profiler"]
      legal_team: ["compliance-guardian"]
      strategy_team: ["crisis-strategist"]

    facilitation_approach: "tactical_briefing"
    interaction_style: "structured_military_briefing"
    best_for: ["security_incidents", "threat_assessment", "vulnerability_analysis", "incident_response"]

  executive_advisory_board:
    name: "Executive Advisory Board"
    description: "Strategic leadership team for high-level decision making and planning"
    focus_areas: ["strategic_planning", "stakeholder_management", "executive_decisions", "governance"]
    group_size: "balanced_6_8"

    agent_composition:
      strategy_team: ["the-master-strategist", "political-strategist", "ethics-advisor", "communications-director"]
      legal_team: ["counsel", "corporate-governance-counsel"]
      cybersec_team: ["security-architect"]
      intel_team: ["intelligence-director"]

    facilitation_approach: "boardroom_discussion"
    interaction_style: "executive_consultation"
    best_for: ["strategic_initiatives", "policy_decisions", "governance_matters", "crisis_leadership"]

  intelligence_fusion_center:
    name: "Intelligence Fusion Center"
    description: "Multi-discipline intelligence analysis and synthesis team"
    focus_areas: ["intelligence_analysis", "threat_attribution", "research", "investigation"]
    group_size: "comprehensive_9_12"

    agent_composition:
      intel_team: ["osint-lead", "threat-actor-profiler", "dark-web-analyst", "social-media-analyst", "technical-researcher", "geospatial-analyst"]
      cybersec_team: ["threat-analyst", "incident-responder"]
      legal_team: ["intelligence-law-specialist"]
      strategy_team: ["strategic-analyst"]

    facilitation_approach: "intelligence_briefing"
    interaction_style: "collaborative_analysis"
    best_for: ["complex_investigations", "threat_attribution", "competitive_intelligence", "situational_awareness"]

  legal_defense_team:
    name: "Legal Defense Team"
    description: "Comprehensive legal counsel for complex matters and disputes"
    focus_areas: ["legal_strategy", "compliance", "dispute_resolution", "risk_mitigation"]
    group_size: "balanced_6_8"

    agent_composition:
      legal_team: ["counsel", "covenant", "liberty", "europa", "advocate", "compliance-guardian"]
      strategy_team: ["strategic-advisor", "communications-director"]
      intel_team: ["intelligence-analyst"]

    facilitation_approach: "legal_council_meeting"
    interaction_style: "structured_legal_analysis"
    best_for: ["legal_disputes", "compliance_issues", "contract_negotiations", "regulatory_matters"]

  innovation_think_tank:
    name: "Innovation Think Tank"
    description: "Creative and strategic minds for breakthrough thinking and innovation"
    focus_areas: ["innovation", "creative_problem_solving", "strategic_thinking", "future_planning"]
    group_size: "balanced_6_8"

    agent_composition:
      strategy_team: ["the-visionary", "innovation-catalyst", "strategic-futurist", "design-thinking-facilitator"]
      intel_team: ["trend-analyst", "technology-researcher"]
      cybersec_team: ["emerging-threat-analyst"]
      legal_team: ["innovation-law-specialist"]

    facilitation_approach: "design_thinking_workshop"
    interaction_style: "creative_collaboration"
    best_for: ["innovation_projects", "future_planning", "creative_problem_solving", "breakthrough_thinking"]

  crisis_response_team:
    name: "Crisis Response Team"
    description: "Rapid response team for crisis management and damage control"
    focus_areas: ["crisis_management", "damage_control", "stakeholder_communication", "rapid_response"]
    group_size: "focused_3_5"

    agent_composition:
      strategy_team: ["crisis-manager", "communications-director", "stakeholder-coordinator"]
      legal_team: ["crisis-legal-counsel"]
      cybersec_team: ["incident-commander"]
      intel_team: ["situation-analyst"]

    facilitation_approach: "crisis_command_structure"
    interaction_style: "rapid_decision_making"
    best_for: ["crisis_situations", "reputation_management", "emergency_response", "damage_control"]

  compliance_audit_team:
    name: "Compliance Audit Team"
    description: "Regulatory compliance and audit preparation specialists"
    focus_areas: ["regulatory_compliance", "audit_preparation", "policy_development", "risk_assessment"]
    group_size: "balanced_6_8"

    agent_composition:
      legal_team: ["compliance-guardian", "regulatory-specialist", "audit-coordinator"]
      cybersec_team: ["compliance-security-analyst", "policy-enforcement-specialist"]
      strategy_team: ["governance-advisor", "risk-strategist"]
      intel_team: ["regulatory-intelligence-analyst"]

    facilitation_approach: "compliance_review_process"
    interaction_style: "systematic_analysis"
    best_for: ["compliance_projects", "regulatory_preparation", "policy_development", "audit_readiness"]

  competitive_intelligence_unit:
    name: "Competitive Intelligence Unit"
    description: "Market intelligence and competitive analysis specialists"
    focus_areas: ["competitive_analysis", "market_intelligence", "strategic_positioning", "business_intelligence"]
    group_size: "balanced_6_8"

    agent_composition:
      intel_team: ["competitive-intelligence-analyst", "market-researcher", "business-intelligence-specialist"]
      strategy_team: ["competitive-strategist", "market-strategist", "positioning-expert"]
      legal_team: ["competitive-law-specialist"]
      cybersec_team: ["corporate-security-analyst"]

    facilitation_approach: "intelligence_analysis_session"
    interaction_style: "analytical_discussion"
    best_for: ["competitive_analysis", "market_research", "strategic_positioning", "business_intelligence"]

  all_hands_summit:
    name: "All Hands Summit"
    description: "Full spectrum expertise for comprehensive analysis and decision making"
    focus_areas: ["comprehensive_analysis", "multi_perspective_planning", "major_decisions", "organizational_alignment"]
    group_size: "full_spectrum_all"

    agent_composition:
      all_teams: ["representative_agents_from_all_specializations"]

    facilitation_approach: "large_group_facilitation"
    interaction_style: "structured_multi_track_discussion"
    best_for: ["major_organizational_decisions", "comprehensive_strategic_planning", "complex_multi_domain_challenges"]

# Facilitation Approaches
facilitation_approaches:
  tactical_briefing:
    description: "Military-style structured briefing and analysis"
    characteristics: ["hierarchical_information_flow", "clear_action_items", "situation_assessment"]
    interaction_patterns: ["briefing", "analysis", "recommendations", "decision"]
    timing_structure: "15min_briefing_30min_analysis_15min_recommendations"

  boardroom_discussion:
    description: "Executive-level strategic discussion and decision making"
    characteristics: ["peer_level_dialogue", "strategic_focus", "consensus_building"]
    interaction_patterns: ["presentation", "discussion", "debate", "consensus"]
    timing_structure: "20min_context_40min_discussion_20min_decisions"

  intelligence_briefing:
    description: "Analytical intelligence sharing and synthesis"
    characteristics: ["data_driven", "collaborative_analysis", "evidence_based"]
    interaction_patterns: ["intelligence_sharing", "analysis", "synthesis", "assessment"]
    timing_structure: "30min_intelligence_45min_analysis_15min_synthesis"

  legal_council_meeting:
    description: "Structured legal analysis and strategy development"
    characteristics: ["systematic_analysis", "risk_assessment", "precedent_review"]
    interaction_patterns: ["issue_framing", "legal_analysis", "options_assessment", "strategy"]
    timing_structure: "15min_framing_45min_analysis_20min_strategy"

  design_thinking_workshop:
    description: "Creative problem solving and innovation methodology"
    characteristics: ["human_centered", "iterative", "creative_exploration"]
    interaction_patterns: ["empathize", "define", "ideate", "prototype", "test"]
    timing_structure: "20min_empathize_20min_define_30min_ideate_10min_next_steps"

  crisis_command_structure:
    description: "Rapid response crisis management approach"
    characteristics: ["urgency_driven", "clear_command", "action_oriented"]
    interaction_patterns: ["situation_assessment", "options_generation", "decision", "action_planning"]
    timing_structure: "10min_assessment_20min_options_10min_decision_20min_planning"

# Quality Assurance
quality_metrics:
  preset_appropriateness:
    - "Preset matches session requirements"
    - "Agent expertise aligns with topic"
    - "Group size is optimal for interaction"
    - "Facilitation approach is suitable"

  session_effectiveness:
    - "Clear objectives established"
    - "Appropriate interaction structure"
    - "Balanced participation opportunities"
    - "Actionable outcomes expected"

  agent_synergy:
    - "Complementary expertise represented"
    - "Productive interaction dynamics"
    - "Balanced perspectives included"
    - "Creative tension for innovation"

# Integration Points
integrations:
  party_mode_execution:
    purpose: "Launch actual Party Mode session"
    path: "../workflow.md"

  agent_manifest:
    purpose: "Verify agent availability and capabilities"
    path: "{project-root}/_bmad/_config/agent-manifest.csv"

  intelligent_routing:
    purpose: "Optimize agent selection based on topic analysis"
    path: "core/workflows/intelligent-routing"