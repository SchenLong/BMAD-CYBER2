# What's Next Workflow - Intelligent Project Routing
name: whats-next
description: "Analyze project state and recommend next action with appropriate agent"
author: "BMad"

# Critical variables from config
config_source: "{project-root}/src/core/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/src/core/workflows/project-manager/whats-next"
instructions: "{installed_path}/instructions.md"

# Project registry location
registry_file: "{output_folder}/project-registry.yaml"

# Module workflow status file patterns
status_file_patterns:
  bmm: "{planning_artifacts}/bmm-workflow-status.yaml"
  bmgd: "{planning_artifacts}/bmgd-workflow-status.yaml"

# Sprint status location
sprint_status: "{implementation_artifacts}/sprint-status.yaml"

standalone: true
