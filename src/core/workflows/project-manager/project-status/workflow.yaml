# Project Status Dashboard Workflow
name: project-status
description: "Generate comprehensive project status dashboard"
author: "BMad"

# Critical variables from config
config_source: "{project-root}/src/core/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# Workflow components
installed_path: "{project-root}/src/core/workflows/project-manager/project-status"
instructions: "{installed_path}/instructions.md"

# Project registry location
registry_file: "{output_folder}/project-registry.yaml"

# Expertise map for cross-module recommendations
expertise_map: "{project-root}/src/core/workflows/project-manager/data/module-expertise-map.yaml"

standalone: true
