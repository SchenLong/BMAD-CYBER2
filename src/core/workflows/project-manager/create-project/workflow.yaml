# BMAD Project Creation Workflow
# Creates and initializes new projects with multi-team coordination capabilities
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Create New Project
    id: create-project
    version: "2.0.0"
    description: "Creates and initializes new projects with proper team coordination and tracking"
    category: "project-management"
    estimated_duration: "5-10 minutes"
    complexity: "medium"

  # Workflow Inputs
  inputs:
    - name: project_name
      type: text
      required: true
      description: "Name of the new project"
    - name: project_description
      type: text
      required: true
      description: "Detailed description of project objectives"
    - name: project_type
      type: string
      required: true
      options: ["security_assessment", "intelligence_operation", "legal_matter", "strategic_initiative", "multi_disciplinary", "compliance_project"]
    - name: primary_team
      type: string
      required: false
      options: ["cybersec-team", "intel-team", "legal-team", "strategy-team", "multi-team"]
    - name: timeline
      type: object
      required: false
      description: "Project timeline with key milestones"
    - name: stakeholders
      type: array
      required: false
      description: "Key project stakeholders"
    - name: success_criteria
      type: text
      required: false
      description: "Definition of project success"

  # Workflow Outputs
  outputs:
    - name: project_id
      type: string
      description: "Unique project identifier"
    - name: project_folder
      type: string
      description: "Project workspace folder path"
    - name: assigned_teams
      type: array
      description: "Teams assigned to the project"
    - name: project_lead
      type: string
      description: "Primary project lead agent"
    - name: project_registry_entry
      type: object
      description: "Complete project registry entry"

# Workflow Steps
steps:
  - number: 1
    name: "Project Analysis"
    description: "Analyze project requirements and determine team assignments"
    action: "analyze_project"
    logic: |
      1. Parse project description for domain keywords
      2. Identify required expertise areas
      3. Assess project complexity and scope
      4. Determine multi-team coordination needs
      5. Evaluate timeline and resource requirements

  - number: 2
    name: "Team Assignment"
    description: "Assign appropriate teams using intelligent routing"
    action: "assign_teams"
    integration: "intelligent-routing"
    logic: |
      1. Use keyword mapping to identify relevant teams
      2. Determine primary and supporting teams
      3. Consider workload distribution
      4. Identify potential collaboration benefits
      5. Assign specific agents within teams

  - number: 3
    name: "Project Structure Creation"
    description: "Create project folder structure and initialize workspace"
    action: "create_structure"
    logic: |
      1. Generate unique project ID
      2. Create project folder in output directory
      3. Initialize project documentation structure
      4. Set up team collaboration spaces
      5. Create tracking and reporting templates

  - number: 4
    name: "Registry Registration"
    description: "Register project in the central registry"
    action: "register_project"
    logic: |
      1. Load existing project registry
      2. Create new project entry
      3. Set as active project
      4. Update registry metadata
      5. Save updated registry

  - number: 5
    name: "Team Notification"
    description: "Notify assigned teams and establish coordination"
    action: "notify_teams"
    logic: |
      1. Generate team notification summaries
      2. Create project briefing documents
      3. Establish communication channels
      4. Set up coordination meetings
      5. Initialize progress tracking

  - number: 6
    name: "Project Initialization Summary"
    description: "Present project initialization results"
    action: "present_summary"
    output_format: |
      ## 🚀 Project Created Successfully

      **Project:** {project_name}
      **Project ID:** {project_id}
      **Type:** {project_type}

      ### Project Overview
      {project_description}

      ### Team Assignments
      **Primary Team:** {primary_team}

      **Assigned Teams:**
      {for team in assigned_teams}
      - **{team.name}** - {team.role}
        - Lead Agent: {team.lead_agent}
        - Supporting Agents: {team.supporting_agents}
        - Responsibilities: {team.responsibilities}
      {/for}

      ### Project Structure
      **Workspace:** `{project_folder}`
      **Documentation:** `{project_folder}/docs/`
      **Team Collaboration:** `{project_folder}/teams/`
      **Reports:** `{project_folder}/reports/`

      ### Next Steps
      1. **[S]** Start project with initial team meeting
      2. **[P]** Set up detailed project plan
      3. **[T]** Configure team collaboration tools
      4. **[M]** Modify team assignments if needed

      ### Timeline
      {if timeline}
      **Start Date:** {timeline.start_date}
      **Key Milestones:**
      {for milestone in timeline.milestones}
      - {milestone.date}: {milestone.description}
      {/for}
      {/if}

      **Project is now active and ready for execution.**

# Project Types and Team Mapping
project_type_mappings:
  security_assessment:
    primary_team: "cybersec-team"
    supporting_teams: ["intel-team", "legal-team"]
    typical_duration: "2-4 weeks"
    key_deliverables: ["security_report", "vulnerability_assessment", "remediation_plan"]

  intelligence_operation:
    primary_team: "intel-team"
    supporting_teams: ["cybersec-team", "legal-team"]
    typical_duration: "1-6 weeks"
    key_deliverables: ["intelligence_report", "threat_assessment", "attribution_analysis"]

  legal_matter:
    primary_team: "legal-team"
    supporting_teams: ["strategy-team", "intel-team"]
    typical_duration: "2-12 weeks"
    key_deliverables: ["legal_analysis", "compliance_review", "risk_assessment"]

  strategic_initiative:
    primary_team: "strategy-team"
    supporting_teams: ["legal-team", "cybersec-team"]
    typical_duration: "4-16 weeks"
    key_deliverables: ["strategic_plan", "stakeholder_analysis", "implementation_roadmap"]

  multi_disciplinary:
    primary_team: "strategy-team"
    supporting_teams: ["cybersec-team", "intel-team", "legal-team"]
    typical_duration: "6-20 weeks"
    key_deliverables: ["integrated_analysis", "multi_team_recommendations", "coordinated_response"]

  compliance_project:
    primary_team: "legal-team"
    supporting_teams: ["cybersec-team", "strategy-team"]
    typical_duration: "4-12 weeks"
    key_deliverables: ["compliance_assessment", "gap_analysis", "remediation_plan"]

# Project Folder Structure Template
folder_structure:
  root: "{output_folder}/projects/{project_id}-{project_name_slug}"
  subdirectories:
    - "docs/"
    - "docs/briefings/"
    - "docs/reports/"
    - "docs/analysis/"
    - "teams/"
    - "teams/cybersec/"
    - "teams/intel/"
    - "teams/legal/"
    - "teams/strategy/"
    - "coordination/"
    - "coordination/meetings/"
    - "coordination/decisions/"
    - "deliverables/"
    - "archive/"

  initial_files:
    - "project-charter.md"
    - "README.md"
    - "coordination/project-plan.md"
    - "coordination/team-assignments.md"
    - "coordination/progress-tracker.md"

# Registry Schema
project_registry_schema:
  registry_metadata:
    version: "2.0.0"
    last_updated: "{current_timestamp}"
    active_project: "{project_id}"

  project_entry:
    project_id: "{project_id}"
    name: "{project_name}"
    description: "{project_description}"
    type: "{project_type}"
    status: "active"
    created_date: "{current_date}"
    last_accessed: "{current_timestamp}"

    teams:
      primary: "{primary_team}"
      assigned: "{assigned_teams}"

    timeline:
      start_date: "{start_date}"
      estimated_completion: "{estimated_completion}"
      milestones: "{project_milestones}"

    workspace:
      folder: "{project_folder}"
      structure_version: "2.0.0"

    metadata:
      created_by: "abdul"
      bmad_version: "2.0.0"
      last_status_update: "{current_timestamp}"

# Coordination Setup
coordination_setup:
  communication_channels:
    - type: "project_briefing"
      participants: "all_assigned_teams"
      frequency: "initial"
    - type: "status_updates"
      participants: "team_leads"
      frequency: "weekly"
    - type: "cross_team_sync"
      participants: "collaboration_agents"
      frequency: "bi_weekly"

  tracking_mechanisms:
    - "progress_milestones"
    - "deliverable_tracking"
    - "team_workload_monitoring"
    - "cross_team_dependencies"
    - "stakeholder_communication"

  escalation_procedures:
    - level: "team_lead"
      triggers: ["milestone_delay", "resource_constraint"]
    - level: "abdul"
      triggers: ["cross_team_conflict", "scope_change"]
    - level: "executive"
      triggers: ["critical_delay", "major_issue"]

# Quality Assurance
quality_checks:
  project_setup:
    - "Unique project ID generated"
    - "Appropriate teams assigned"
    - "Folder structure created"
    - "Registry updated successfully"

  team_coordination:
    - "All assigned teams notified"
    - "Communication channels established"
    - "Initial project briefing completed"
    - "Tracking mechanisms activated"

  documentation:
    - "Project charter created"
    - "Team assignments documented"
    - "Success criteria defined"
    - "Timeline established"

# Integration Points
integrations:
  intelligent_routing:
    purpose: "Team assignment optimization"
    path: "core/workflows/intelligent-routing"

  assign_task:
    purpose: "Individual task assignment within project"
    path: "project-manager/assign-task"

  cross_module_consultation:
    purpose: "Inter-team collaboration within project"
    path: "cross-module/consultation"