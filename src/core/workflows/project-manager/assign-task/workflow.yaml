# BMAD Task Assignment Workflow
# Intelligent task delegation to appropriate agents across all teams
# Version: 2.0.0

schema_version: "1.0"
format_version: "workflow.yaml"

# Workflow Metadata
workflow:
  metadata:
    name: Assign Task to Agent
    id: assign-task
    version: "2.0.0"
    description: "Intelligently assigns tasks to the most appropriate agents across all BMAD teams"
    category: "project-management"
    estimated_duration: "2-5 minutes"
    complexity: "medium"

  # Workflow Inputs
  inputs:
    - name: task_description
      type: text
      required: true
      description: "Detailed description of the task to be assigned"
    - name: task_priority
      type: string
      required: true
      default: "normal"
      options: ["low", "normal", "high", "critical"]
    - name: deadline
      type: date
      required: false
      description: "Task deadline if applicable"
    - name: required_expertise
      type: array
      required: false
      description: "Specific expertise areas required"
    - name: team_preference
      type: string
      required: false
      options: ["cybersec-team", "intel-team", "legal-team", "strategy-team", "any"]
    - name: deliverables
      type: text
      required: false
      description: "Expected deliverables and format"

  # Workflow Outputs
  outputs:
    - name: assigned_agent
      type: string
      description: "Primary agent assigned to the task"
    - name: supporting_agents
      type: array
      description: "Supporting agents for collaboration"
    - name: task_id
      type: string
      description: "Unique task identifier"
    - name: assignment_rationale
      type: text
      description: "Explanation of assignment decision"
    - name: estimated_completion
      type: date
      description: "Estimated completion date"

# Workflow Steps
steps:
  - number: 1
    name: "Task Analysis"
    description: "Analyze the task requirements and context"
    action: "analyze_task"
    logic: |
      1. Parse task description for key requirements
      2. Identify domain expertise needed
      3. Assess task complexity and scope
      4. Determine collaboration requirements
      5. Extract deliverable specifications

  - number: 2
    name: "Agent Capability Mapping"
    description: "Map task requirements to agent capabilities"
    action: "map_capabilities"
    logic: |
      1. Load agent manifest from all teams
      2. Match required expertise to agent specializations
      3. Consider agent current workload
      4. Assess availability based on priority
      5. Identify potential collaboration benefits

  - number: 3
    name: "Team Routing Analysis"
    description: "Determine optimal team assignment using intelligent routing"
    action: "route_to_team"
    integration: "intelligent-routing"
    logic: |
      1. Use keyword mapping system to identify best team
      2. Consider cross-team collaboration opportunities
      3. Evaluate multi-disciplinary requirements
      4. Apply priority and urgency factors

  - number: 4
    name: "Agent Selection"
    description: "Select specific agent(s) for task assignment"
    action: "select_agents"
    logic: |
      Primary Agent Selection:
      1. Rank agents by expertise match
      2. Consider availability and workload
      3. Apply specialty matching algorithms
      4. Factor in task priority

      Supporting Agent Selection:
      1. Identify complementary skills needed
      2. Consider cross-team collaboration value
      3. Select up to 2 supporting agents

  - number: 5
    name: "Create Task Assignment"
    description: "Formalize task assignment with tracking"
    action: "create_assignment"
    logic: |
      1. Generate unique task ID
      2. Create task record with metadata
      3. Establish tracking milestones
      4. Set up progress monitoring
      5. Configure notification triggers

  - number: 6
    name: "Present Assignment Plan"
    description: "Present assignment recommendation to user"
    action: "present_assignment"
    output_format: |
      ## 📋 Task Assignment Plan

      **Task:** {task_description}
      **Priority:** {task_priority}
      **Task ID:** {task_id}

      ### Primary Assignment
      **Agent:** {assigned_agent}
      **Team:** {agent_team}
      **Expertise Match:** {expertise_score}%
      **Rationale:** {assignment_rationale}

      ### Supporting Team
      {for agent in supporting_agents}
      - **{agent}** - {agent_role}
      {/for}

      ### Timeline
      **Estimated Completion:** {estimated_completion}
      {if deadline}**Deadline:** {deadline}{/if}

      ### Deliverables
      {deliverables}

      ### Next Steps
      1. **[C]** Confirm assignment and proceed
      2. **[M]** Modify assignment or team selection
      3. **[D]** Add more detail to task requirements
      4. **[S]** Schedule task for later assignment

# Agent Selection Algorithms
selection_algorithms:
  expertise_matching:
    description: "Match task requirements to agent expertise"
    weight: 40
    factors:
      - domain_knowledge
      - tool_proficiency
      - experience_level
      - success_rate

  workload_balancing:
    description: "Consider current agent workload"
    weight: 25
    factors:
      - current_tasks
      - priority_conflicts
      - availability_window
      - capacity_utilization

  collaboration_optimization:
    description: "Optimize for team collaboration"
    weight: 20
    factors:
      - cross_team_synergy
      - communication_efficiency
      - shared_context
      - complementary_skills

  priority_alignment:
    description: "Align with task priority and urgency"
    weight: 15
    factors:
      - agent_specialization_depth
      - response_time_capability
      - escalation_authority
      - resource_access

# Team-Specific Assignment Rules
team_assignment_rules:
  cybersec-team:
    lead_indicators:
      - security_assessment_required
      - technical_vulnerability_analysis
      - threat_modeling_needed
      - compliance_review_required

    agent_specializations:
      security-architect: ["architecture", "design", "strategy"]
      threat-analyst: ["analysis", "intelligence", "research"]
      penetration-tester: ["testing", "assessment", "validation"]
      compliance-guardian: ["compliance", "audit", "policy"]
      incident-responder: ["response", "investigation", "forensics"]

  intel-team:
    lead_indicators:
      - information_gathering_required
      - research_investigation_needed
      - threat_actor_analysis
      - osint_capabilities_required

    agent_specializations:
      osint-lead: ["coordination", "strategy", "methodology"]
      threat-actor-profiler: ["attribution", "analysis", "profiling"]
      dark-web-analyst: ["underground", "cryptocurrency", "anonymity"]
      social-media-analyst: ["socmint", "influence", "monitoring"]
      technical-researcher: ["technical", "infrastructure", "tools"]

  legal-team:
    lead_indicators:
      - legal_analysis_required
      - contract_work_needed
      - compliance_review_required
      - dispute_resolution_needed

    agent_specializations:
      counsel: ["coordination", "strategy", "general_counsel"]
      covenant: ["contracts", "agreements", "negotiation"]
      liberty: ["us_law", "federal", "state"]
      europa: ["eu_law", "cross_border", "international"]
      advocate: ["litigation", "disputes", "resolution"]

  strategy-team:
    lead_indicators:
      - strategic_analysis_required
      - stakeholder_management_needed
      - decision_support_required
      - communication_strategy_needed

    agent_specializations:
      the-master-strategist: ["strategy", "planning", "analysis"]
      political-strategist: ["politics", "influence", "negotiation"]
      ethics-advisor: ["ethics", "values", "dilemmas"]
      communications-director: ["messaging", "presentations", "crisis"]
      stakeholder-mediator: ["mediation", "relationships", "conflict"]

# Task Tracking System
task_tracking:
  status_levels:
    - "assigned"
    - "in_progress"
    - "review"
    - "completed"
    - "on_hold"
    - "cancelled"

  milestone_types:
    - "initial_analysis"
    - "progress_checkpoint"
    - "draft_review"
    - "final_delivery"
    - "post_completion_review"

  notification_triggers:
    - "assignment_created"
    - "status_change"
    - "deadline_approaching"
    - "milestone_reached"
    - "collaboration_request"

# Integration Points
integrations:
  project_registry:
    purpose: "Link tasks to active projects"
    path: "{output_folder}/project-registry.yaml"

  agent_manifest:
    purpose: "Access current agent capabilities"
    path: "{project-root}/_bmad/_config/agent-manifest.csv"

  workflow_manifest:
    purpose: "Reference available workflows"
    path: "{project-root}/_bmad/_config/workflow-manifest.csv"

  intelligent_routing:
    purpose: "Leverage routing intelligence"
    path: "core/workflows/intelligent-routing"

# Quality Assurance
quality_assurance:
  assignment_validation:
    - "Selected agent has required expertise"
    - "Workload is reasonable for timeline"
    - "Collaboration needs are addressed"
    - "Deliverables are clearly defined"

  tracking_requirements:
    - "Unique task ID generated"
    - "Milestones established"
    - "Progress monitoring configured"
    - "Notification rules set"

  escalation_triggers:
    - "No suitable agent available"
    - "Conflicting priority assignments"
    - "Resource constraints identified"
    - "Cross-team coordination required"