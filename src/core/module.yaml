# Core Infrastructure Module Configuration
# This file defines the core BMAD infrastructure (always installed)

code: "core"
name: "BMAD Core Infrastructure"
default_selected: true
required: true

# Welcome message shown during installation
prompt:
  - "BMAD Core Infrastructure"
  - ""
  - "Core infrastructure includes:"
  - ""
  - "  Orchestration:"
  - "  - Abdul (Project Manager - Cross-Module Coordination)"
  - "  - BMAD Master (System Orchestrator)"
  - ""
  - "  Core Workflows:"
  - "  - Party Mode (Multi-Agent Discussions)"
  - "  - Project Manager (Task Assignment & Status)"
  - "  - Team Orchestration (Cross-Module Workflows)"
  - "  - Brainstorming (Creative Sessions)"
  - ""
  - "  Infrastructure:"
  - "  - Schema definitions for cross-module data"
  - "  - Decision frameworks and phase gates"
  - "  - Party mode presets for team assembly"
  - ""
  - "This module is required and automatically installed."

# Core config values are automatically inherited from installer:
## user_name
## communication_language
## document_output_language

# ============================================================================
# CONFIGURATION FIELDS
# ============================================================================

# STATIC: Module identification (no installation prompts - always required)
module_code:
  result: "core"

module_version:
  result: "6.0.0"

# STATIC: Module paths
agents_path:
  result: "{project-root}/src/core/agents"

workflows_path:
  result: "{project-root}/src/core/workflows"

schemas_path:
  result: "{project-root}/src/core/schemas"

tasks_path:
  result: "{project-root}/src/core/tasks"

resources_path:
  result: "{project-root}/src/core/resources"

# STATIC: Party mode configuration
party_mode_presets:
  result: "{project-root}/src/core/workflows/party-mode/presets"

# STATIC: Team orchestration data
orchestration_data:
  result: "{project-root}/src/core/workflows/team-orchestration/data"
