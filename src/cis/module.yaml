# CIS (Creative Innovation Studio) Module Configuration
# This file defines installation questions and module configuration values

code: "cis"
name: "Creative Innovation Studio"
default_selected: false

# Welcome message shown during installation
prompt:
  - "Creative Innovation Studio (CIS) Module Installation"
  - ""
  - "This module provides 6 creative and innovation agents:"
  - ""
  - "  Innovation & Creativity:"
  - "  - Victor (Innovation Strategist - Strategic Innovation)"
  - "  - Dr. Quinn (Creative Problem Solver - Lateral Thinking)"
  - "  - Maya (Design Thinking Coach - Human-Centered Design)"
  - ""
  - "  Communication & Presentation:"
  - "  - Marcus (Storyteller - Narrative Craft)"
  - "  - Aria (Presentation Master - Visual Communication)"
  - "  - Alex (Brainstorming Coach - Ideation Facilitation)"
  - ""
  - "4 workflows for brainstorming, innovation, and creative sessions."

# Core config values are automatically inherited from installer:
## user_name
## communication_language
## document_output_language

# ============================================================================
# CONFIGURATION FIELDS
# ============================================================================

# INTERACTIVE: Primary output location
output_folder:
  prompt: "Where should CIS save creative session outputs?"
  default: "_bmad-output/creative"
  result: "{project-root}/{value}"

# STATIC: Module identification
module_code:
  result: "cis"

module_version:
  result: "1.0.0"

# STATIC: Module paths
agents_path:
  result: "{project-root}/src/cis/agents"

workflows_path:
  result: "{project-root}/src/cis/workflows"

# STATIC: Automatic subdirectory configuration
brainstorming:
  result: "{output_folder}/brainstorming"

innovation:
  result: "{output_folder}/innovation"

presentations:
  result: "{output_folder}/presentations"
