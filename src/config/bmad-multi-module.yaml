# BMAD CYBERCOMMAND Multi-Module Distribution v2.0.0
# Comprehensive package containing all 4 specialized team modules

code: "bmad-cybercommand"
name: "BMAD CYBERCOMMAND Multi-Module Distribution"
version: "2.0.0"
default_selected: true
type: "multi-module"
category: "bmad-cybercommand"

npm:
  scope: "@bmad-cybercommand"
  package_name: "multi-module"
  full_name: "@bmad-cybercommand/multi-module"
  registry: "https://registry.npmjs.org"
  access: "public"

repository:
  type: "git"
  url: "https://github.com/bmad-code-org/BMAD-CYBERCOMMAND.git"
  directory: "."
  branch: "main"

keywords:
  - "bmad"
  - "agent"
  - "workflow"
  - "multi-module"
  - "cybersecurity"
  - "intelligence"
  - "legal"
  - "strategy"
  - "specialized-teams"

