# BMAD Specialized Teams - Conflict Detection & Resolution Specifications
# Comprehensive specification for preventing and resolving module conflicts
# Author: Winston (System Architect)
# Version: 1.0.0

version: "1.0.0"
specification_type: "bmad_conflict_detection"
target_ecosystem: "bmad-specialized-teams"

# =============================================================================
# CONFLICT CATEGORIES & DETECTION
# =============================================================================

conflict_categories:
  naming_conflicts:
    description: "Conflicts arising from duplicate names across modules"
    severity_levels:
      critical: "Core system integrity at risk"
      high: "Module functionality compromised"
      medium: "Reduced functionality or confusion"
      low: "Cosmetic issues only"

  dependency_conflicts:
    description: "Conflicts in module dependency requirements"
    impact_scope: "cross_module_functionality"

  resource_conflicts:
    description: "Competition for shared system resources"
    impact_scope: "system_performance"

  configuration_conflicts:
    description: "Conflicting configuration requirements"
    impact_scope: "user_experience"

# =============================================================================
# NAMING CONFLICT DETECTION
# =============================================================================

naming_conflicts:
  agent_name_conflicts:
    detection_scope: "global"
    detection_timing: "pre_install"
    enforcement_level: "strict"

    conflict_types:
      exact_duplicate:
        pattern: "agent_name_A == agent_name_B"
        severity: "critical"
        action: "block_installation"
        resolution_required: true

        detection_algorithm: |
          1. Extract all agent names from installing module
          2. Query global agent registry for existing names
          3. Perform case-insensitive comparison
          4. Report any matches as critical conflicts

        exceptions:
          intentional_duplicates:
            allowed: false
            reasoning: "Agent names must be globally unique for system stability"

      case_variations:
        pattern: "agent_name_A.lower() == agent_name_B.lower()"
        severity: "high"
        action: "block_installation"
        reasoning: "Case variations cause confusion and platform incompatibilities"

      reserved_name_violations:
        pattern: "agent_name in RESERVED_NAMES"
        severity: "critical"
        action: "block_installation"

        reserved_names:
          core_agents:
            - "abdul"
            - "bmad-master"
          system_reserved:
            - "admin"
            - "root"
            - "system"
            - "bmad"
          future_reserved:
            - "orchestrator"
            - "coordinator"
            - "manager"

  workflow_id_conflicts:
    detection_scope: "global"
    naming_convention: "{module_code}:{workflow_name}"
    enforcement: "namespace_prefix_required"

    conflict_types:
      namespace_collision:
        pattern: "workflow_id_A == workflow_id_B"
        severity: "high"
        action: "block_installation"

        prevention_strategy:
          method: "mandatory_namespace_prefix"
          format: "{module_code}:{workflow_name}"
          validation: "pre_install_check"

      cross_reference_conflicts:
        pattern: "workflow_A references non_existent_workflow_B"
        severity: "medium"
        action: "warn_and_disable_feature"

        detection_algorithm: |
          1. Parse all workflow definitions in installing module
          2. Extract cross-workflow references
          3. Verify referenced workflows exist in installed modules
          4. Report missing dependencies

  output_path_conflicts:
    detection_scope: "filesystem"
    conflict_sensitivity: "case_insensitive"  # For cross-platform compatibility

    conflict_types:
      direct_path_collision:
        pattern: "normalize_path(path_A) == normalize_path(path_B)"
        severity: "high"
        action: "block_installation"

        resolution_options:
          user_customization:
            prompt: "Output path '{path}' is already in use. Choose alternative:"
            suggestions:
              - "{original_path}-{module_name}"
              - "{original_path}-v{module_version}"
              - "custom_user_input"

      subdirectory_conflicts:
        pattern: "path_A is subdirectory of path_B OR path_B is subdirectory of path_A"
        severity: "medium"
        action: "warn_and_allow"
        monitoring: "runtime_file_access_conflicts"

# =============================================================================
# DEPENDENCY CONFLICT DETECTION
# =============================================================================

dependency_conflicts:
  version_conflicts:
    detection_timing: "pre_install"
    resolution_strategy: "dependency_resolution_algorithm"

    conflict_types:
      core_version_mismatch:
        description: "Module requires different core version than installed"
        severity: "critical"
        blocking: true

        detection_logic: |
          required_core = module.dependencies.core.version
          installed_core = system.core.version
          if not version_satisfies(installed_core, required_core):
              return CONFLICT_CORE_VERSION_MISMATCH

        resolution_strategies:
          upgrade_core:
            feasibility_check: "is_core_upgrade_available"
            user_prompt: "Upgrade BMAD Core from {current} to {required}?"
            automatic: false
            risk_level: "medium"

          block_module_install:
            condition: "core_upgrade_not_available OR user_declines_upgrade"
            message: "Cannot install {module} - requires core {required}, found {current}"

      peer_dependency_conflicts:
        description: "Module A requires Module B v1.x, but v2.x is installed"
        severity: "high"
        blocking: false  # Warning with reduced functionality

        conflict_matrix:
          version_ranges:
            compatible: "same_major_version"
            potentially_compatible: "different_major_with_runtime_check"
            incompatible: "explicitly_marked_incompatible"

        resolution_strategies:
          version_upgrade:
            description: "Upgrade requesting module to support newer dependency"
            feasibility: "check_module_compatibility_matrix"

          version_downgrade:
            description: "Downgrade dependency to requested version"
            feasibility: "check_if_safe_downgrade_available"
            risk_assessment: "analyze_breaking_changes"

          parallel_installation:
            description: "Install both versions side-by-side"
            status: "not_currently_supported"
            future_feature: "version_2.1.0_target"

  circular_dependencies:
    detection_algorithm: "depth_first_search_with_cycle_detection"

    conflict_types:
      direct_circular:
        pattern: "Module A → Module B → Module A"
        severity: "critical"
        action: "block_installation"

      indirect_circular:
        pattern: "Module A → Module B → Module C → Module A"
        severity: "critical"
        action: "block_installation"

      workflow_circular:
        pattern: "Workflow A triggers Workflow B triggers Workflow A"
        severity: "high"
        action: "warn_and_disable_circular_workflows"

    detection_implementation: |
      def detect_circular_dependencies(modules):
          visited = set()
          recursion_stack = set()

          for module in modules:
              if detect_cycle_dfs(module, visited, recursion_stack):
                  return CONFLICT_CIRCULAR_DEPENDENCY

          return NO_CONFLICT

# =============================================================================
# RESOURCE CONFLICT DETECTION
# =============================================================================

resource_conflicts:
  memory_conflicts:
    detection_timing: "pre_install + runtime"
    threshold_monitoring: true

    conflict_types:
      memory_exhaustion:
        threshold: "system_memory_usage > 80%"
        severity: "medium"
        action: "warn_user"

        estimation_algorithm: |
          estimated_usage = base_core_memory + sum(module.estimated_memory for module in installing_modules)
          if estimated_usage > system.available_memory * 0.8:
              return CONFLICT_MEMORY_EXHAUSTION

      memory_leak_detection:
        detection: "runtime_monitoring"
        threshold: "module_memory_growth > 50% over 1 hour"
        severity: "high"
        action: "log_warning_and_suggest_restart"

  file_system_conflicts:
    detection_scope: "module_installation_paths"
    permissions_check: true

    conflict_types:
      write_permission_conflicts:
        pattern: "module.output_path not writable"
        severity: "high"
        action: "block_installation"

        resolution: |
          1. Check directory permissions
          2. Attempt to create test file
          3. If failed, prompt user to:
             a) Choose different output directory
             b) Fix permissions
             c) Run as administrator (not recommended)

      disk_space_conflicts:
        threshold: "available_disk_space < estimated_module_size * 2"
        severity: "medium"
        action: "warn_user"

  network_resource_conflicts:
    relevance: "intel_team_cybersec_team_modules"
    detection_timing: "runtime"

    conflict_types:
      port_binding_conflicts:
        current_status: "no_modules_bind_ports"
        future_consideration: "web_interface_modules"

      api_rate_limiting:
        modules_affected: ["intel-team"]
        detection: "monitor_external_api_calls"
        mitigation: "shared_rate_limit_pool"

# =============================================================================
# CONFIGURATION CONFLICT DETECTION
# =============================================================================

configuration_conflicts:
  settings_conflicts:
    detection_scope: "user_configuration_files"
    conflict_resolution: "last_writer_wins_with_backup"

    conflict_types:
      overlapping_settings:
        pattern: "module_A.config.setting_X conflicts with module_B.config.setting_X"
        severity: "medium"
        action: "warn_and_merge_with_precedence"

        precedence_rules:
          1: "user_explicit_override"
          2: "module_specific_setting"
          3: "global_default_setting"

      incompatible_configurations:
        examples:
          - "legal_team.jurisdiction = 'US' conflicts with intel_team.privacy_mode = 'EU_STRICT'"
        detection: "semantic_configuration_analysis"
        resolution: "user_guided_resolution"

  party_mode_preset_conflicts:
    detection_scope: "cross_module_presets"
    conflict_sensitivity: "agent_availability"

    conflict_types:
      missing_agent_references:
        pattern: "preset references agent from uninstalled module"
        severity: "low"
        action: "disable_preset_with_notification"

        conflict_resolution: |
          1. Scan all Party Mode presets
          2. Check agent availability for each preset
          3. Mark presets as "partially available" if some agents missing
          4. Provide user option to install missing modules

      conflicting_preset_names:
        pattern: "preset_name_A == preset_name_B from different sources"
        severity: "medium"
        action: "namespace_presets_with_source_prefix"

# =============================================================================
# CONFLICT RESOLUTION ALGORITHMS
# =============================================================================

resolution_algorithms:
  dependency_resolution:
    algorithm_type: "backtracking_with_preference_ordering"

    preference_ordering:
      1: "maintain_existing_stable_versions"
      2: "prefer_latest_compatible_versions"
      3: "minimize_number_of_changes"
      4: "prefer_security_updates"

    resolution_steps: |
      1. Analyze current installation state
      2. Determine compatibility matrix for all modules
      3. Generate possible resolution scenarios
      4. Rank scenarios by preference ordering
      5. Present top 3 options to user
      6. Execute chosen resolution with rollback plan

  conflict_mediation:
    human_intervention_required:
      triggers:
        - "no_automatic_resolution_available"
        - "security_implications_detected"
        - "user_data_migration_required"

    automated_resolution:
      scope: "low_risk_conflicts_only"
      safeguards:
        - "always_create_backup_before_resolution"
        - "rollback_on_resolution_failure"
        - "user_confirmation_for_significant_changes"

# =============================================================================
# DETECTION IMPLEMENTATION SPECIFICATIONS
# =============================================================================

implementation_specifications:
  detection_pipeline:
    phases:
      1: "static_analysis"
      2: "dependency_graph_analysis"
      3: "configuration_validation"
      4: "resource_estimation"
      5: "conflict_reporting"

    static_analysis:
      inputs: ["module.yaml", "agent definitions", "workflow definitions"]
      outputs: ["agent_registry", "workflow_registry", "dependency_graph"]

      validation_steps:
        - "parse_module_metadata"
        - "extract_agent_names"
        - "extract_workflow_ids"
        - "validate_naming_conventions"
        - "check_reserved_names"

    dependency_graph_analysis:
      algorithm: "topological_sort_with_cycle_detection"
      complexity: "O(V + E) where V=modules, E=dependencies"

      analysis_steps:
        - "build_dependency_graph"
        - "detect_circular_dependencies"
        - "validate_version_constraints"
        - "identify_missing_dependencies"

  conflict_reporting:
    output_format: "structured_json_with_human_readable_messages"

    report_structure:
      conflicts:
        - conflict_id: "unique_identifier"
          type: "naming_conflict | dependency_conflict | resource_conflict"
          severity: "critical | high | medium | low"
          description: "human_readable_description"
          affected_modules: ["module1", "module2"]
          resolution_options: ["option1", "option2", "option3"]
          recommended_action: "specific_recommendation"

      summary:
        total_conflicts: "integer"
        blocking_conflicts: "integer"
        warning_conflicts: "integer"
        auto_resolvable_conflicts: "integer"

    example_report: |
      {
        "conflicts": [
          {
            "conflict_id": "AGENT_001",
            "type": "naming_conflict",
            "severity": "critical",
            "description": "Agent name 'cipher' conflicts between cybersec-team and custom-module",
            "affected_modules": ["cybersec-team", "custom-module"],
            "resolution_options": [
              "Rename agent in custom-module",
              "Choose different module",
              "Contact module author for resolution"
            ],
            "recommended_action": "Rename agent in custom-module to 'custom-cipher'"
          }
        ],
        "summary": {
          "total_conflicts": 1,
          "blocking_conflicts": 1,
          "warning_conflicts": 0,
          "auto_resolvable_conflicts": 0
        }
      }

# =============================================================================
# RUNTIME CONFLICT MONITORING
# =============================================================================

runtime_monitoring:
  continuous_checks:
    frequency: "startup + periodic"
    monitoring_scope: ["agent_availability", "workflow_integrity", "resource_usage"]

    check_types:
      agent_availability_monitor:
        frequency: "startup"
        check: "all_registered_agents_respond_to_health_check"
        failure_action: "mark_agent_unavailable_and_disable_dependent_features"

      workflow_integrity_monitor:
        frequency: "startup + workflow_execution"
        check: "workflow_dependencies_still_available"
        failure_action: "graceful_degradation_with_user_notification"

      resource_usage_monitor:
        frequency: "every_5_minutes"
        metrics: ["memory_usage", "cpu_usage", "disk_io"]
        alert_thresholds:
          memory: "system_memory > 85%"
          cpu: "sustained_cpu > 90% for 10 minutes"
          disk: "disk_usage_growth > 1GB/hour"

  conflict_recovery:
    automatic_recovery:
      scope: "transient_conflicts_only"
      strategies:
        - "restart_affected_agents"
        - "reload_configuration"
        - "clear_temporary_resources"

    manual_recovery:
      triggers:
        - "persistent_conflicts"
        - "data_integrity_concerns"
        - "security_implications"

      recovery_procedures:
        - "guided_troubleshooting_wizard"
        - "rollback_to_last_known_good_state"
        - "emergency_safe_mode_operation"

# =============================================================================
# TESTING & VALIDATION
# =============================================================================

testing_specifications:
  conflict_detection_tests:
    unit_tests:
      agent_name_conflict_detection:
        test_cases:
          - name: "exact_duplicate_detection"
            setup: "Two modules with agent named 'cipher'"
            expected: "CONFLICT_AGENT_NAME_DUPLICATE"

          - name: "case_variation_detection"
            setup: "Agent 'Cipher' and 'cipher'"
            expected: "CONFLICT_AGENT_NAME_CASE_VARIATION"

          - name: "reserved_name_detection"
            setup: "Module with agent named 'abdul'"
            expected: "CONFLICT_RESERVED_NAME_VIOLATION"

      dependency_conflict_detection:
        test_cases:
          - name: "circular_dependency_detection"
            setup: "Module A depends on B, B depends on A"
            expected: "CONFLICT_CIRCULAR_DEPENDENCY"

          - name: "version_conflict_detection"
            setup: "Module requires core v7.0, installed v6.0"
            expected: "CONFLICT_CORE_VERSION_MISMATCH"

  integration_tests:
    multi_module_conflict_scenarios:
      - scenario: "all_four_teams_installation"
        modules: ["cybersec-team", "intel-team", "legal-team", "strategy-team"]
        expected_conflicts: 0
        expected_warnings: 0

      - scenario: "conflicting_custom_modules"
        modules: ["cybersec-team", "test-module-with-conflicts"]
        expected_conflicts: 3
        expected_warnings: 1

  performance_tests:
    conflict_detection_performance:
      small_installation: "4 modules, <100ms detection time"
      medium_installation: "10 modules, <500ms detection time"
      large_installation: "20 modules, <2s detection time"

# =============================================================================
# ERROR HANDLING & RECOVERY
# =============================================================================

error_handling:
  detection_failures:
    timeout_handling:
      timeout_threshold: "30_seconds_for_conflict_detection"
      fallback_action: "allow_installation_with_runtime_monitoring"
      risk_mitigation: "enhanced_runtime_conflict_checking"

    resource_exhaustion:
      memory_limit: "detection_process_max_256mb"
      fallback_action: "simplified_detection_algorithm"
      degraded_mode: "basic_name_conflict_checking_only"

  resolution_failures:
    partial_resolution:
      strategy: "resolve_what_possible_warn_about_rest"
      user_guidance: "provide_manual_resolution_steps"

    rollback_requirements:
      trigger_conditions:
        - "resolution_introduces_new_conflicts"
        - "system_instability_detected"
        - "user_requests_rollback"

      rollback_scope:
        - "restore_previous_module_state"
        - "revert_configuration_changes"
        - "clear_partial_installation_artifacts"

# =============================================================================
# DOCUMENTATION & USER GUIDANCE
# =============================================================================

user_guidance:
  conflict_prevention:
    best_practices:
      - "Install official modules before custom modules"
      - "Keep all modules at same major version when possible"
      - "Review conflict reports before proceeding with installation"
      - "Create backups before major module changes"

    naming_guidelines:
      for_module_developers:
        - "Use module-specific prefixes for agents"
        - "Follow semantic versioning strictly"
        - "Test against all official modules before release"
        - "Document any known conflicts in module README"

  troubleshooting_guide:
    common_conflicts:
      agent_name_conflicts:
        problem: "Installation blocked due to agent name conflict"
        diagnosis: "Check error message for conflicting modules and agent names"
        solutions:
          1: "Rename agent in custom module"
          2: "Choose different module that doesn't conflict"
          3: "Contact module author for resolution"

      dependency_conflicts:
        problem: "Module requires different core version"
        diagnosis: "Check required vs installed core versions"
        solutions:
          1: "Upgrade BMAD Core to required version"
          2: "Find alternative module that supports current core version"
          3: "Wait for module update to support current core version"

