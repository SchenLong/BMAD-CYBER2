# BMAD Security Hardening Configuration
# Generated by Bastion (Security Architect) - Story 4.1
# Version: 1.0.0

schema_version: "1.0"
security_hardening_version: "1.0.0"
generated_by: "bastion-security-architect"
generation_timestamp: "2026-01-24T13:00:00Z"

# ===================================================================
# CREDENTIAL AND SECRET MANAGEMENT
# ===================================================================
credential_management:
  storage_policy: "external_only"

  # Files that must NEVER be committed
  sensitive_files:
    - ".bmad-key"
    - ".bmad-token"
    - "*.pem"
    - "*.p12"
    - "*.pfx"
    - "**/id_rsa*"
    - "**/id_dsa*"
    - "**/id_ecdsa*"
    - "**/id_ed25519*"
    - "**/.aws/credentials"
    - "**/.gcp/credentials.json"
    - "**/service-account*.json"

  # Environment variables that should be externalized
  sensitive_env_vars:
    - "BMAD_API_KEY"
    - "BMAD_SECRET_KEY"
    - "BMAD_ENCRYPTION_KEY"
    - "OPENAI_API_KEY"
    - "ANTHROPIC_API_KEY"
    - "GROQ_API_KEY"
    - "TOGETHER_API_KEY"
    - "GITHUB_TOKEN"
    - "AWS_ACCESS_KEY_ID"
    - "AWS_SECRET_ACCESS_KEY"
    - "GCP_SERVICE_ACCOUNT_KEY"

  # Credential validation patterns
  credential_patterns:
    openai_api_key: "sk-[a-zA-Z0-9]{48}"
    github_pat: "ghp_[a-zA-Z0-9]{36}"
    aws_access_key: "AKIA[0-9A-Z]{16}"
    jwt_token: "ey[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*\\.[A-Za-z0-9_-]*"

# ===================================================================
# CODE SECURITY POLICIES
# ===================================================================
code_security:
  prohibited_patterns:
    # Command injection risks
    - pattern: "execSync\\([^)]*\\$\\{[^}]+\\}"
      description: "Potential command injection via template literals"
      severity: "high"

    - pattern: "eval\\("
      description: "Use of eval() function"
      severity: "critical"

    - pattern: "Function\\(.*\\)"
      description: "Dynamic function creation"
      severity: "high"

    # Hardcoded secrets
    - pattern: "(password|secret|key|token)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"
      description: "Potential hardcoded credentials"
      severity: "high"

    # Insecure data handling
    - pattern: "JSON\\.parse\\([^)]*req\\."
      description: "Unsafe JSON parsing of request data"
      severity: "medium"

  safe_practices:
    - "Use parameterized queries for all database operations"
    - "Validate all input data using schema validation"
    - "Use environment variables for all configuration"
    - "Implement proper error handling without data leakage"
    - "Use secure random generators for tokens/keys"

# ===================================================================
# ACCESS CONTROL AND PERMISSIONS
# ===================================================================
access_control:
  file_permissions:
    config_files: "0644"  # Read/write owner, read-only group/others
    script_files: "0755"  # Execute for owner, read-only for others
    credential_files: "0600"  # Read/write owner only
    log_files: "0640"     # Read/write owner, read-only group

  directory_permissions:
    config_directories: "0755"
    log_directories: "0750"
    temp_directories: "0700"

  security_boundaries:
    - "Separate development and production environments"
    - "Implement principle of least privilege"
    - "Regular access reviews and credential rotation"
    - "Multi-factor authentication for all admin access"

# ===================================================================
