# BMAD Specialized Teams - Installation Validation Logic
# Comprehensive specification for module installation validation and safety
# Author: BlackUnicorn.Tech
# Version: 1.0.0

version: "1.0.0"
specification_type: "bmad_installation_validation"
target_ecosystem: "bmad-specialized-teams"

# =============================================================================
# VALIDATION PIPELINE OVERVIEW
# =============================================================================

validation_pipeline:
  description: "Multi-stage validation process ensuring safe module installation"
  stages:
    1: "pre_validation"      # Before any installation steps
    2: "compatibility_check" # Dependency and version validation
    3: "conflict_detection"  # Name and resource conflict checking
    4: "resource_verification" # System resource and permission validation
    5: "installation_safety" # Final safety checks before installation
    6: "post_install_verification" # Verification after installation completes

  failure_handling:
    philosophy: "fail_fast_and_safe"
    rollback_strategy: "automatic_on_validation_failure"
    user_experience: "clear_error_messages_with_actionable_solutions"

# =============================================================================
# STAGE 1: PRE-VALIDATION
# =============================================================================

pre_validation:
  description: "Initial system state and module validity checks"
  blocking: true  # Must pass to proceed

  checks:
    system_environment:
      nodejs_version:
        requirement: ">= 18.0.0"
        check_method: "process.version"
        failure_action: "block_with_upgrade_guidance"
        error_message: "Node.js {required} or later required. Found: {current}. Please upgrade Node.js."

      npm_version:
        requirement: ">= 8.0.0"
        check_method: "npm --version"
        failure_action: "warn_with_guidance"
        error_message: "NPM {required} recommended for optimal experience. Found: {current}"

      disk_space:
        requirement: ">= 500MB available"
        check_method: "filesystem_space_check"
        failure_action: "block_with_cleanup_guidance"
        error_message: "Insufficient disk space. Need {required}, found {available}. Please free up space."

    bmad_core_presence:
      core_installation:
        requirement: "bmad:core installed and functional"
        check_method: "verify_core_module_exists"
        failure_action: "block_with_core_installation_guidance"
        error_message: "BMAD Core not found. Install BMAD Core before adding specialized team modules."

      core_version:
        requirement: ">= 6.0.0"
        check_method: "parse_core_module_version"
        failure_action: "block_with_upgrade_guidance"
        error_message: "BMAD Core {required} or later required. Found: {current}. Please upgrade BMAD Core."

    module_package_integrity:
      package_signature:
        requirement: "valid_npm_package_signature"
        check_method: "verify_package_integrity"
        failure_action: "block_installation"
        error_message: "Package integrity verification failed. Download may be corrupted."

      module_yaml_validity:
        requirement: "valid_module_yaml_format"
        check_method: "parse_and_validate_module_yaml"
        failure_action: "block_installation"
        error_message: "Invalid module.yaml format. This package may be corrupted or incompatible."

  implementation:
    check_order:
      1: "system_environment"
      2: "bmad_core_presence"
      3: "module_package_integrity"

    failure_recovery:
      automatic_fixes:
        - "npm_cache_clean_on_integrity_failure"
        - "temporary_directory_cleanup"

      user_guidance:
        system_issues: "Provide detailed system requirement documentation"
        core_issues: "Link to BMAD Core installation/upgrade procedures"
        package_issues: "Suggest re-download from official source"

# =============================================================================
# STAGE 2: COMPATIBILITY CHECK
# =============================================================================

compatibility_check:
  description: "Version compatibility and dependency resolution validation"
  blocking: true  # Critical for system stability

  checks:
    core_version_compatibility:
      method: "semantic_version_range_check"
      requirement_source: "module.yaml.dependencies.core.version"

      validation_logic: |
        required_core = parse_version_requirement(module.dependencies.core.version)
        installed_core = get_installed_core_version()

        if not satisfies_version_range(installed_core, required_core):
            return ValidationFailure(
                code="CORE_VERSION_INCOMPATIBLE",
                message=f"Core version {installed_core} doesn't satisfy requirement {required_core}",
                resolution="upgrade_core_or_find_compatible_module_version"
            )

    peer_dependency_compatibility:
      scope: "installed_team_modules"
      validation_approach: "compatibility_matrix_lookup"

      compatibility_matrix_check: |
        def validate_peer_compatibility(installing_module, installed_modules):
            for installed_module in installed_modules:
                compatibility = lookup_compatibility(installing_module, installed_module)

                if compatibility == "incompatible":
                    return ValidationFailure(
                        code="PEER_INCOMPATIBLE",
                        modules=[installing_module.name, installed_module.name],
                        resolution_options=["upgrade_modules", "remove_conflicting_module"]
                    )
                elif compatibility == "warning":
                    return ValidationWarning(
                        code="PEER_VERSION_SKEW",
                        message="Modules may have reduced cross-functionality"
                    )

    dependency_graph_validation:
      check: "circular_dependency_detection"
      algorithm: "depth_first_search"

      circular_dependency_check: |
        def detect_circular_dependencies(modules_with_new):
            graph = build_dependency_graph(modules_with_new)

            visited = set()
            recursion_stack = set()

            for module in graph.nodes():
                if detect_cycle_dfs(module, graph, visited, recursion_stack):
                    cycle = extract_cycle(recursion_stack)
                    return ValidationFailure(
                        code="CIRCULAR_DEPENDENCY",
                        cycle=cycle,
                        resolution="contact_support_design_issue"
                    )

  resolution_strategies:
    core_upgrade_required:
      automatic: false
      user_prompt: "Upgrade BMAD Core from {current} to {required}?"
      impact_assessment:
        - "estimate_upgrade_time"
        - "check_breaking_changes"
        - "verify_backup_available"

    peer_version_conflicts:
      resolution_options:
        1:
          strategy: "upgrade_conflicting_module"
          feasibility_check: "compatible_version_available"
          user_impact: "minimal"

        2:
          strategy: "find_alternative_module_version"
          feasibility_check: "multiple_versions_available"
          user_impact: "may_lose_latest_features"

        3:
          strategy: "accept_reduced_functionality"
          feasibility_check: "cross_module_features_optional"
          user_impact: "some_party_mode_presets_unavailable"

# =============================================================================
# STAGE 3: CONFLICT DETECTION
# =============================================================================

conflict_detection:
  description: "Comprehensive conflict checking across all naming and resource domains"
  blocking: "critical_conflicts_only"

  checks:
    agent_name_conflicts:
      scope: "global_agent_registry"
      enforcement: "strict_uniqueness"

      detection_algorithm: |
        def check_agent_name_conflicts(installing_module):
            installing_agents = extract_agent_names(installing_module)
            global_registry = load_global_agent_registry()

            conflicts = []
            for agent_name in installing_agents:
                if agent_name in global_registry:
                    conflicts.append({
                        'agent_name': agent_name,
                        'existing_module': global_registry[agent_name].module,
                        'severity': 'critical'
                    })

            return conflicts

    workflow_id_conflicts:
      scope: "global_workflow_registry"
      enforcement: "namespace_validation"

      validation_logic: |
        def validate_workflow_ids(installing_module):
            workflows = extract_workflow_ids(installing_module)

            for workflow_id in workflows:
                if not workflow_id.startswith(f"{installing_module.code}:"):
                    return ValidationFailure(
                        code="WORKFLOW_NAMESPACE_VIOLATION",
                        workflow_id=workflow_id,
                        required_prefix=f"{installing_module.code}:"
                    )

    output_path_conflicts:
      scope: "filesystem_paths"
      case_sensitivity: "case_insensitive"  # Cross-platform compatibility

      path_conflict_check: |
        def check_output_path_conflicts(installing_module):
            proposed_paths = extract_output_paths(installing_module)
            existing_paths = get_all_module_output_paths()

            conflicts = []
            for proposed_path in proposed_paths:
                normalized_proposed = normalize_path(proposed_path)

                for existing_path in existing_paths:
                    normalized_existing = normalize_path(existing_path)

                    if paths_conflict(normalized_proposed, normalized_existing):
                        conflicts.append({
                            'proposed': proposed_path,
                            'existing': existing_path,
                            'conflict_type': determine_conflict_type(normalized_proposed, normalized_existing)
                        })

    party_mode_preset_conflicts:
      scope: "cross_module_presets"
      validation: "agent_availability_check"

      preset_validation: |
        def validate_party_mode_presets(installing_module, existing_modules):
            all_modules = existing_modules + [installing_module]
            preset_conflicts = []

            for preset in load_party_mode_presets():
                required_agents = extract_required_agents(preset)
                available_agents = get_available_agents(all_modules)

                missing_agents = set(required_agents) - set(available_agents)
                if missing_agents:
                    preset_conflicts.append({
                        'preset_name': preset.name,
                        'missing_agents': list(missing_agents),
                        'severity': 'warning'  # Degrades functionality but doesn't block
                    })

  conflict_resolution:
    automatic_resolution:
      enabled_for: ["low_severity_conflicts", "path_conflicts_with_user_customization"]

      resolution_strategies:
        path_conflicts:
          strategy: "append_module_suffix"
          implementation: "{original_path}-{module_name}"
          user_notification: true

        preset_conflicts:
          strategy: "disable_incompatible_presets"
          user_notification: true
          recovery: "install_missing_modules_later"

    manual_resolution_required:
      triggers:
        - "agent_name_conflicts"
        - "workflow_id_conflicts"
        - "critical_resource_conflicts"

      resolution_workflow:
        1: "present_conflict_details_to_user"
        2: "offer_resolution_options_with_impact_analysis"
        3: "user_selects_resolution_strategy"
        4: "implement_resolution_with_confirmation"
        5: "verify_resolution_effectiveness"

# =============================================================================
# STAGE 4: RESOURCE VERIFICATION
# =============================================================================

resource_verification:
  description: "System resource and permission validation"
  blocking: "resource_critical_failures_only"

  checks:
    filesystem_permissions:
      write_access_verification:
        target_directories:
          - "module_installation_path"
          - "output_directories"
          - "configuration_directories"

        verification_method: |
          def verify_filesystem_permissions(paths):
              permission_failures = []

              for path_info in paths:
                  try:
                      # Test write access
                      test_file = os.path.join(path_info.path, '.bmad_write_test')
                      with open(test_file, 'w') as f:
                          f.write('test')
                      os.unlink(test_file)

                  except PermissionError:
                      permission_failures.append({
                          'path': path_info.path,
                          'purpose': path_info.purpose,
                          'recommended_action': 'fix_permissions_or_choose_alternative'
                      })

              return permission_failures

      directory_creation:
        requirement: "can_create_required_directories"
        fallback: "prompt_user_for_alternative_locations"

    memory_estimation:
      baseline_requirement: "150MB (core) + 25MB per team module"
      estimation_method: "static_analysis_plus_historical_data"

      memory_check: |
        def estimate_memory_requirements(installing_modules):
            base_memory = 150  # MB for core
            module_memory = len(installing_modules) * 25  # MB per module
            estimated_total = base_memory + module_memory

            available_memory = get_system_memory() * 0.8  # 80% threshold

            if estimated_total > available_memory:
                return ValidationWarning(
                    code="HIGH_MEMORY_USAGE",
                    estimated=estimated_total,
                    available=available_memory,
                    recommendation="close_other_applications_or_add_memory"
                )

    network_requirements:
      modules_requiring_network:
        - "intel-team"  # OSINT operations
        - "cybersec-team"  # Threat feed updates

      network_validation: |
        def validate_network_requirements(installing_module):
            if installing_module.requires_network:
                # Test basic connectivity
                try:
                    test_connection()
                    return ValidationSuccess()
                except NetworkError:
                    return ValidationWarning(
                        code="NETWORK_UNAVAILABLE",
                        message="Module requires network access for full functionality",
                        impact="reduced_functionality_in_offline_mode"
                    )

# =============================================================================
# STAGE 5: INSTALLATION SAFETY
# =============================================================================

installation_safety:
  description: "Final safety checks before committing to installation"
  blocking: true

  checks:
    backup_verification:
      requirement: "backup_available_or_created"
      scope: "current_bmad_installation_state"

      backup_strategy: |
        def ensure_backup_available():
            backup_exists = check_for_recent_backup(max_age_hours=24)

            if not backup_exists:
                user_choice = prompt_user(
                    "No recent backup found. Create backup before installation?",
                    options=["create_backup", "proceed_without_backup", "cancel_installation"]
                )

                if user_choice == "create_backup":
                    create_installation_backup()
                elif user_choice == "cancel_installation":
                    raise InstallationCancelled("User chose to cancel for backup creation")

    rollback_plan_verification:
      requirement: "rollback_plan_prepared_and_tested"

      rollback_preparation: |
        def prepare_rollback_plan():
            rollback_plan = {
                'current_modules': get_installed_modules(),
                'current_configuration': backup_configuration(),
                'rollback_steps': generate_rollback_steps(),
                'estimated_rollback_time': estimate_rollback_time()
            }

            # Test rollback feasibility
            rollback_feasible = test_rollback_feasibility(rollback_plan)
            if not rollback_feasible:
                return ValidationFailure(
                    code="ROLLBACK_NOT_FEASIBLE",
                    message="Cannot ensure safe rollback. Installation blocked.",
                    resolution="contact_support_or_wait_for_backup_completion"
                )

    installation_lock_check:
      requirement: "no_concurrent_installations_running"

      lock_mechanism: |
        def acquire_installation_lock():
            lock_file = "/tmp/bmad_installation.lock"

            if os.path.exists(lock_file):
                lock_age = time.time() - os.path.getmtime(lock_file)

                if lock_age > 3600:  # 1 hour - assume stale
                    os.unlink(lock_file)
                else:
                    return ValidationFailure(
                        code="CONCURRENT_INSTALLATION",
                        message="Another installation is in progress",
                        resolution="wait_for_completion_or_cancel_other_installation"
                    )

            # Create lock file
            with open(lock_file, 'w') as f:
                f.write(f"{os.getpid()}\n{time.time()}\n")

    user_confirmation:
      requirement: "explicit_user_confirmation_for_significant_changes"

      confirmation_required_for:
        - "major_version_upgrades"
        - "modules_with_warnings"
        - "installations_affecting_multiple_modules"

      confirmation_process: |
        def get_user_confirmation(installation_plan):
            summary = generate_installation_summary(installation_plan)
            risks = assess_installation_risks(installation_plan)

            confirmation_prompt = f"""
            Installation Summary:
            {summary}

            Identified Risks:
            {risks}

            Do you want to proceed with this installation?
            """

            user_response = prompt_user_yes_no(confirmation_prompt)
            if not user_response:
                raise InstallationCancelled("User declined installation confirmation")

# =============================================================================
# STAGE 6: POST-INSTALL VERIFICATION
# =============================================================================

post_install_verification:
  description: "Verification that installation completed successfully"
  blocking: false  # Issues here trigger rollback rather than blocking

  checks:
    module_loading_verification:
      requirement: "installed_module_loads_successfully"

      loading_test: |
        def verify_module_loading(installed_module):
            try:
                # Attempt to load module
                module_instance = load_module(installed_module.code)

                # Verify agents are accessible
                agents = module_instance.get_agents()
                if not agents:
                    raise ModuleLoadingError("No agents found in installed module")

                # Verify workflows are accessible
                workflows = module_instance.get_workflows()
                if not workflows:
                    raise ModuleLoadingError("No workflows found in installed module")

                return VerificationSuccess()

            except Exception as e:
                return VerificationFailure(
                    code="MODULE_LOADING_FAILED",
                    error=str(e),
                    recommended_action="rollback_installation"
                )

    agent_registration_verification:
      requirement: "agents_registered_in_global_registry"

      registration_test: |
        def verify_agent_registration(installed_module):
            expected_agents = extract_agent_names(installed_module)
            global_registry = load_global_agent_registry()

            missing_agents = []
            for agent_name in expected_agents:
                if agent_name not in global_registry:
                    missing_agents.append(agent_name)

            if missing_agents:
                return VerificationFailure(
                    code="AGENT_REGISTRATION_INCOMPLETE",
                    missing_agents=missing_agents,
                    recommended_action="re_run_registration_or_rollback"
                )

    party_mode_preset_verification:
      requirement: "applicable_presets_functional"

      preset_test: |
        def verify_party_mode_presets(all_installed_modules):
            applicable_presets = get_applicable_presets(all_installed_modules)
            failed_presets = []

            for preset in applicable_presets:
                try:
                    validate_preset_agents_available(preset, all_installed_modules)
                except PresetValidationError as e:
                    failed_presets.append({
                        'preset_name': preset.name,
                        'error': str(e)
                    })

            if failed_presets:
                return VerificationWarning(
                    code="PRESET_VALIDATION_ISSUES",
                    failed_presets=failed_presets,
                    impact="reduced_cross_module_functionality"
                )

    configuration_integrity_verification:
      requirement: "module_configuration_valid_and_accessible"

      config_test: |
        def verify_configuration_integrity(installed_module):
            try:
                config = load_module_configuration(installed_module.code)
                validate_configuration_schema(config)
                test_configuration_access_permissions()

                return VerificationSuccess()

            except ConfigurationError as e:
                return VerificationFailure(
                    code="CONFIGURATION_INTEGRITY_FAILED",
                    error=str(e),
                    recommended_action="repair_configuration_or_rollback"
                )

  failure_handling:
    automatic_rollback:
      triggers:
        - "module_loading_verification_failed"
        - "critical_configuration_integrity_failed"

      rollback_process: |
        def automatic_rollback(installation_context):
            try:
                log_info(f"Starting automatic rollback for {installation_context.module}")

                # Remove installed files
                remove_module_files(installation_context.module)

                # Restore previous configuration
                restore_configuration(installation_context.backup)

                # Update global registries
                remove_from_global_registries(installation_context.module)

                # Verify rollback success
                verify_rollback_success(installation_context.previous_state)

                log_info("Automatic rollback completed successfully")

            except Exception as rollback_error:
                log_error(f"Rollback failed: {rollback_error}")
                enter_safe_mode()

    manual_intervention:
      triggers:
        - "automatic_rollback_failed"
        - "partial_installation_state_detected"

      intervention_process:
        1: "enter_bmad_safe_mode"
        2: "present_diagnostic_information_to_user"
        3: "offer_guided_recovery_options"
        4: "execute_user_selected_recovery_strategy"
        5: "verify_system_integrity_restored"

# =============================================================================
# ERROR HANDLING & USER EXPERIENCE
# =============================================================================

error_handling:
  error_classification:
    critical_errors:
      definition: "Errors that prevent safe installation or compromise system integrity"
      action: "block_installation"
      examples:
        - "core_version_incompatible"
        - "agent_name_conflicts"
        - "circular_dependencies"
        - "insufficient_permissions"

    warning_errors:
      definition: "Issues that reduce functionality but don't prevent installation"
      action: "warn_user_and_allow_installation"
      examples:
        - "peer_version_skew"
        - "high_memory_usage"
        - "network_unavailable"
        - "some_presets_unavailable"

    info_notifications:
      definition: "Informational messages about installation impacts"
      action: "log_and_notify_user"
      examples:
        - "new_features_available"
        - "configuration_migration_applied"
        - "performance_optimization_suggestions"

  user_communication:
    error_message_format:
      structure: |
        Error Code: {ERROR_CODE}
        Severity: {SEVERITY_LEVEL}

        Problem: {HUMAN_READABLE_DESCRIPTION}

        Impact: {WHAT_THIS_MEANS_FOR_USER}

        Resolution Options:
        1. {PRIMARY_RESOLUTION_WITH_STEPS}
        2. {ALTERNATIVE_RESOLUTION_WITH_STEPS}
        3. {LAST_RESORT_OPTION}

        Need Help? {LINK_TO_DOCUMENTATION_OR_SUPPORT}

    progress_reporting:
      granularity: "stage_level_with_substage_progress"
      format: "Stage {current}/{total}: {stage_name} - {substage_description} ({percentage}%)"

      progress_implementation: |
        def report_progress(stage, substage, percentage):
            progress_message = f"Stage {stage.number}/{TOTAL_STAGES}: {stage.name}"
            if substage:
                progress_message += f" - {substage.description}"
            if percentage is not None:
                progress_message += f" ({percentage}%)"

            update_progress_display(progress_message)
            log_progress(stage, substage, percentage)

# =============================================================================
# PERFORMANCE OPTIMIZATION
# =============================================================================

performance_optimization:
  parallel_validation:
    enabled: true
    parallel_checks:
      - "filesystem_permissions"
      - "network_connectivity"
      - "memory_estimation"

    sequential_checks:
      - "dependency_resolution"  # Requires results from previous checks
      - "conflict_detection"     # Requires dependency graph
      - "installation_safety"    # Requires all previous validations

  caching:
    validation_result_caching:
      cache_duration: "24_hours"
      cache_invalidation_triggers:
        - "core_module_version_change"
        - "system_configuration_change"
        - "module_installation_or_removal"

    dependency_graph_caching:
      cache_duration: "until_module_change"
      cache_location: "temporary_system_directory"

  early_termination:
    fail_fast_strategy: "stop_on_first_critical_error"
    continue_on_warnings: true
    batch_warning_reporting: true  # Collect all warnings before presenting

# =============================================================================
# TESTING & QUALITY ASSURANCE
# =============================================================================

testing_framework:
  validation_testing:
    unit_tests:
      coverage_requirement: "> 90%"
      test_categories:
        - "individual_validation_check_logic"
        - "error_handling_and_recovery"
        - "conflict_detection_accuracy"
        - "dependency_resolution_correctness"

    integration_tests:
      scenarios:
        - "clean_installation_on_fresh_system"
        - "upgrade_installation_with_existing_modules"
        - "conflict_resolution_workflows"
        - "rollback_and_recovery_procedures"

    stress_tests:
      scenarios:
        - "large_number_of_modules_installation"
        - "resource_constrained_environment"
        - "network_interruption_during_installation"
        - "disk_space_exhaustion_during_installation"

  automated_validation:
    continuous_integration:
      trigger: "every_module_update"
      test_matrix:
        - "all_supported_node_versions"
        - "all_supported_operating_systems"
        - "various_bmad_core_versions"

    compatibility_regression_testing:
      frequency: "weekly"
      scope: "all_module_combinations"
      failure_action: "alert_development_team"

# =============================================================================
# SECURITY CONSIDERATIONS
# =============================================================================

security:
  input_validation:
    module_package_verification:
      requirement: "cryptographic_signature_verification"
      trusted_sources: "official_bmad_registry"
      fallback_for_development: "explicit_user_confirmation"

    user_input_sanitization:
      scope: "all_user_provided_paths_and_configuration"
      protection_against:
        - "path_traversal_attacks"
        - "code_injection_via_configuration"
        - "privilege_escalation_attempts"

  privilege_handling:
    minimum_required_privileges: "user_level_permissions"
    privilege_escalation: "never_automatically_request_elevated_privileges"

    permission_validation: |
      def validate_security_permissions():
          # Ensure we're not running with unnecessary privileges
          if running_as_administrator() and not explicitly_required():
              return SecurityWarning(
                  "Running with elevated privileges not recommended",
                  "Consider running as regular user for security"
              )

          # Validate file system permissions are appropriately scoped
          validate_file_access_scope()

  audit_logging:
    log_level: "all_validation_decisions_and_security_events"
    log_format: "structured_json_with_timestamps"
    log_retention: "90_days_minimum"

    audit_events:
      - "validation_started_and_completed"
      - "security_checks_performed"
      - "privilege_requests_and_grants"
      - "file_system_access_patterns"
      - "network_connections_attempted"

# =============================================================================
# DOCUMENTATION & MAINTENANCE
# =============================================================================

documentation:
  user_documentation:
    installation_guide:
      target_audience: "bmad_users_installing_team_modules"
      content_includes:
        - "pre_installation_requirements"
        - "step_by_step_installation_process"
        - "troubleshooting_common_issues"
        - "post_installation_verification_steps"

    troubleshooting_guide:
      organization: "by_error_code_and_scenario"
      content_includes:
        - "error_code_reference"
        - "diagnostic_procedures"
        - "resolution_workflows"
