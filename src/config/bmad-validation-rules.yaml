# BMAD Validation Rules & Tooling Framework v2.0.0
# Comprehensive validation specification for agent distribution
# Designed by Winston (The Master Strategist) for Story 2.2

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://bmad.code/schemas/validation-rules-v2.0.0.json"

title: "BMAD Validation Rules Framework"
description: "Validation rules and tooling specification for BMAD agent distribution pipeline"
version: "2.0.0"

# ===== VALIDATION RULE CATEGORIES =====
rule_categories:
  structural:
    description: "YAML structure and format validation"
    priority: "critical"
    enforcement: "strict"

  semantic:
    description: "Content meaning and logic validation"
    priority: "high"
    enforcement: "strict"

  security:
    description: "Security and safety validation"
    priority: "critical"
    enforcement: "strict"

  quality:
    description: "Quality and best practice validation"
    priority: "medium"
    enforcement: "warning"

  performance:
    description: "Performance and efficiency validation"
    priority: "low"
    enforcement: "advisory"

# ===== STRUCTURAL VALIDATION RULES =====
structural_rules:
  yaml_syntax:
    rule_id: "STR_001"
    description: "Valid YAML syntax"
    category: "structural"
    priority: "critical"
    validation:
      type: "syntax"
      parser: "yaml"
      strict_mode: true

  required_sections:
    rule_id: "STR_002"
    description: "All required top-level sections present"
    category: "structural"
    priority: "critical"
    validation:
      type: "presence"
      required_keys:
        - "agent.metadata"
        - "agent.persona"
        - "agent.activation"
        - "agent.menu"
        - "agent.rules"
        - "agent.menu_handlers"
        - "agent.extraction"

  schema_compliance:
    rule_id: "STR_003"
    description: "Compliance with BMAD agent schema"
    category: "structural"
    priority: "critical"
    validation:
      type: "schema"
      schema_file: "src/config/bmad-agent-schema.yaml"
      strict_validation: true

  field_types:
    rule_id: "STR_004"
    description: "Correct data types for all fields"
    category: "structural"
    priority: "critical"
    validation:
      type: "type_checking"
      enforce_types: true
      null_handling: "strict"

  unique_identifiers:
    rule_id: "STR_005"
    description: "Unique agent and menu identifiers"
    category: "structural"
    priority: "critical"
    validation:
      type: "uniqueness"
      fields:
        - "agent.metadata.id"
        - "agent.metadata.name"
      scope: "package"

# ===== SEMANTIC VALIDATION RULES =====
semantic_rules:
  team_alignment:
    rule_id: "SEM_001"
    description: "Agent team assignment matches package"
    category: "semantic"
    priority: "high"
    validation:
      type: "cross_reference"
      field: "agent.metadata.team"
      reference: "package.team_designation"

  menu_consistency:
    rule_id: "SEM_002"
    description: "Menu items have valid handlers"
    category: "semantic"
    priority: "high"
    validation:
      type: "reference_integrity"
      source: "agent.menu"
      target: "agent.menu_handlers"
      check_attributes: ["exec", "action", "workflow"]

  activation_steps:
    rule_id: "SEM_003"
    description: "Activation steps are sequential and complete"
    category: "semantic"
    priority: "high"
    validation:
      type: "sequence"
      field: "agent.activation.steps"
      sequence_field: "number"
      start_value: 1
      allow_gaps: false

  config_references:
    rule_id: "SEM_004"
    description: "Configuration variable references are valid"
    category: "semantic"
    priority: "medium"
    validation:
      type: "variable_reference"
      pattern: "\\{[a-z_]+\\}"
      required_vars: ["user_name", "communication_language", "output_folder"]

  file_path_validity:
    rule_id: "SEM_005"
    description: "File paths in exec/data attributes are valid"
    category: "semantic"
    priority: "medium"
    validation:
      type: "path_validation"
      fields: ["menu.exec", "menu.data", "menu.tmpl"]
      path_format: "relative_or_absolute"
      check_existence: false  # Files may not exist during validation

# ===== SECURITY VALIDATION RULES =====
security_rules:
  prompt_injection_protection:
    rule_id: "SEC_001"
    description: "Prompt injection protection rules present"
    category: "security"
    priority: "critical"
    validation:
      type: "content_pattern"
      field: "agent.rules"
      required_patterns:
        - "PROMPT INJECTION PROTECTION"
        - "EXTERNAL CONTENT MANIPULATION PROTECTION"

  shell_command_restrictions:
    rule_id: "SEC_002"
    description: "Shell commands are restricted appropriately"
    category: "security"
    priority: "critical"
    validation:
      type: "security_scan"
      scan_fields: ["menu.action", "menu.exec", "persona.principles"]
      dangerous_patterns:
        - "rm -rf"
        - "sudo"
        - "eval"
        - "system("
        - "exec("
      risk_level: "high"

  sensitive_data_handling:
    rule_id: "SEC_003"
    description: "Sensitive data handling rules compliance"
    category: "security"
    priority: "high"
    validation:
      type: "compliance_check"
      compliance_framework: "bmad_security_standards"
      required_elements:
        - "data_classification_awareness"
        - "local_llm_option_mention"

  external_url_validation:
    rule_id: "SEC_004"
    description: "External URLs are safe and validated"
    category: "security"
    priority: "medium"
    validation:
      type: "url_validation"
      url_fields: ["menu.exec", "rules.content"]
      allowed_protocols: ["https"]
      blocked_domains: ["malware.com", "phishing.net"]

  privilege_escalation_check:
    rule_id: "SEC_005"
    description: "No unauthorized privilege escalation attempts"
    category: "security"
    priority: "critical"
    validation:
      type: "privilege_scan"
      scan_content: true
      escalation_indicators:
        - "chmod +x"
        - "setuid"
        - "sudo"
        - "root"
        - "admin"

# ===== QUALITY VALIDATION RULES =====
quality_rules:
  description_completeness:
    rule_id: "QUA_001"
    description: "Adequate description length and detail"
    category: "quality"
    priority: "medium"
    validation:
      type: "content_length"
      fields:
        - field: "agent.metadata.description"
          min_length: 10
          max_length: 500
        - field: "agent.persona.identity"
          min_length: 50
        - field: "agent.persona.principles"
          min_length: 20

  menu_item_coverage:
    rule_id: "QUA_002"
    description: "Adequate menu item coverage for agent role"
    category: "quality"
    priority: "medium"
    validation:
      type: "coverage"
      field: "agent.menu"
      min_items: 5
      max_items: 20
      required_items: ["MH", "CH", "DA"]

  persona_consistency:
    rule_id: "QUA_003"
    description: "Persona consistency across all sections"
    category: "quality"
    priority: "medium"
    validation:
      type: "consistency_check"
      fields: ["persona.role", "persona.identity", "persona.communication_style"]
      consistency_metrics: ["tone", "expertise_level", "terminology"]

  activation_clarity:
    rule_id: "QUA_004"
    description: "Clear and actionable activation steps"
    category: "quality"
    priority: "medium"
    validation:
      type: "readability"
      field: "agent.activation.steps[*].content"
      metrics: ["clarity", "actionability", "specificity"]

  rule_completeness:
    rule_id: "QUA_005"
    description: "Comprehensive rule coverage"
    category: "quality"
    priority: "low"
    validation:
      type: "rule_coverage"
      field: "agent.rules"
      required_rule_types: ["security", "operational", "communication"]
      min_security_rules: 2

# ===== PERFORMANCE VALIDATION RULES =====
performance_rules:
  agent_complexity:
    rule_id: "PER_001"
    description: "Agent complexity within acceptable bounds"
    category: "performance"
    priority: "low"
    validation:
      type: "complexity_analysis"
      metrics:
        - menu_item_count: { max: 20 }
        - rule_count: { max: 50 }
        - activation_step_count: { max: 15 }
        - persona_word_count: { max: 1000 }

  resource_usage:
    rule_id: "PER_002"
    description: "Estimated resource usage within limits"
    category: "performance"
    priority: "low"
    validation:
      type: "resource_estimation"
      metrics:
        - memory_usage: { max_mb: 10 }
        - processing_time: { max_seconds: 5 }
        - file_size: { max_kb: 100 }

# ===== VALIDATION TOOLING SPECIFICATION =====
validation_tooling:
  validator_engine:
    name: "BMAD Agent Validator"
    version: "2.0.0"
    language: "Python"
    dependencies:
      - "PyYAML >= 6.0"
      - "jsonschema >= 4.0"
      - "python-magic >= 0.4.27"
      - "click >= 8.0"

  command_line_interface:
    binary_name: "bmad-validate"
    commands:
      validate:
        description: "Validate single agent file"
        usage: "bmad-validate agent <file_path>"
        options:
          - "--schema-file": "Custom schema file path"
          - "--strict": "Enable strict validation mode"
          - "--output-format": "json|yaml|table"
          - "--fail-fast": "Stop on first error"

      validate_package:
        description: "Validate entire package"
        usage: "bmad-validate package <package_dir>"
        options:
          - "--recursive": "Validate subdirectories"
          - "--exclude": "Exclude patterns"
          - "--parallel": "Parallel validation"
          - "--report": "Generate validation report"

      validate_batch:
        description: "Validate multiple packages"
        usage: "bmad-validate batch <config_file>"
        options:
          - "--config": "Batch validation configuration"
          - "--output-dir": "Report output directory"
          - "--summary": "Generate summary report"

      check_compatibility:
        description: "Check version compatibility"
        usage: "bmad-validate compat <file1> <file2>"
        options:
          - "--version": "Target BMAD version"
          - "--upgrade": "Show upgrade path"

  validation_reports:
    formats:
      json:
        description: "Machine-readable JSON report"
        schema: "validation-report-schema.json"

      yaml:
        description: "Human-readable YAML report"
        template: "validation-report-template.yaml"

      html:
        description: "Interactive HTML dashboard"
        template: "validation-dashboard-template.html"

      csv:
        description: "Tabular CSV format for analytics"
        columns: ["file", "rule_id", "severity", "message", "line", "column"]

    report_sections:
      summary:
        - total_files: "Number of files validated"
        - total_errors: "Number of validation errors"
        - total_warnings: "Number of validation warnings"
        - validation_status: "Overall validation status"
        - quality_score: "Package quality score (0-100)"

      rule_breakdown:
        - by_category: "Errors grouped by rule category"
        - by_severity: "Errors grouped by severity level"
        - by_file: "Errors grouped by file"

      recommendations:
        - critical_fixes: "Must-fix critical issues"
        - suggested_improvements: "Quality improvement suggestions"
        - best_practices: "Best practice recommendations"

  integration_hooks:
    pre_commit:
      description: "Git pre-commit hook for validation"
      script_path: "hooks/pre-commit-validate"
      config_file: ".bmad-validate.yml"

    ci_cd:
      github_action:
        name: "BMAD Agent Validation"
        marketplace_url: "https://github.com/marketplace/actions/bmad-validate"
        config_file: ".github/workflows/bmad-validate.yml"

      jenkins:
        plugin_name: "bmad-validation-plugin"
        pipeline_stage: "validation"

    ide_plugins:
      vscode:
        extension_name: "bmad-agent-validator"
        marketplace_id: "bmad.agent-validator"

      intellij:
        plugin_name: "BMAD Agent Tools"
        plugin_id: "com.bmad.agent-tools"

# ===== VALIDATION CONFIGURATION =====
validation_config:
  default_severity_levels:
    critical: "fail_build"
    high: "fail_build"
    medium: "warning"
    low: "advisory"

  rule_customization:
    enable_custom_rules: true
    custom_rule_directory: ".bmad/validation-rules/"
    rule_inheritance: true

  exclusion_patterns:
    files:
      - "*.tmp"
      - "*.backup"
      - "draft-*"
    directories:
      - ".git/"
      - "node_modules/"
      - "temp/"

  performance_settings:
    parallel_validation: true
    max_workers: 4
    timeout_seconds: 30
    cache_validation_results: true
    cache_duration_hours: 24

# ===== ERROR CODES AND MESSAGES =====
error_codes:
  E001:
    message: "Invalid YAML syntax"
    severity: "critical"
    fix_suggestion: "Check YAML formatting and indentation"

  E002:
    message: "Required section missing: {section}"
    severity: "critical"
    fix_suggestion: "Add the required section to agent definition"

  W001:
    message: "Description too short (minimum {min_length} characters)"
    severity: "medium"
    fix_suggestion: "Expand description with more details"

  I001:
    message: "Consider adding more menu items for better usability"
    severity: "low"
    fix_suggestion: "Add 2-3 more specialized menu options"

# ===== VALIDATION EXAMPLES =====
validation_examples:
  valid_agent:
    description: "Example of a fully compliant agent"
    file_path: "examples/valid-agent.yaml"
    passes_all_rules: true

  common_errors:
    missing_sections:
      description: "Agent with missing required sections"
      file_path: "examples/errors/missing-sections.yaml"
      expected_errors: ["STR_002"]

    security_violation:
      description: "Agent with security rule violations"
      file_path: "examples/errors/security-violation.yaml"
      expected_errors: ["SEC_001", "SEC_002"]

    quality_issues:
      description: "Agent with quality issues"
      file_path: "examples/warnings/quality-issues.yaml"
      expected_warnings: ["QUA_001", "QUA_002"]