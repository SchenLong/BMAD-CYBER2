# BMB (BMAD Builder) Module Configuration
# This file defines installation questions and module configuration values

code: "bmb"
name: "BMAD Builder - Module & Workflow Creation"
default_selected: false

# Welcome message shown during installation
prompt:
  - "BMAD Builder (BMB) Module Installation"
  - ""
  - "This module provides 3 specialized builder agents:"
  - ""
  - "  Builders:"
  - "  - Agent Builder - Create new BMAD agents"
  - "  - Workflow Builder - Design workflow definitions"
  - "  - Module Builder - Package complete modules"
  - ""
  - "Use this module to extend the BMAD ecosystem."
  - "Create custom agents, workflows, and modules."

# Core config values are automatically inherited from installer:
## user_name
## communication_language
## document_output_language

# ============================================================================
# CONFIGURATION FIELDS
# ============================================================================

# INTERACTIVE: Primary output location
output_folder:
  prompt: "Where should BMB save generated modules and workflows?"
  default: "_bmad-output/builder"
  result: "{project-root}/{value}"

# STATIC: Module identification
module_code:
  result: "bmb"

module_version:
  result: "1.0.0"

# STATIC: Module paths
agents_path:
  result: "{project-root}/src/bmb/agents"

workflows_path:
  result: "{project-root}/src/bmb/workflows"

# STATIC: Automatic subdirectory configuration
generated_agents:
  result: "{output_folder}/agents"

generated_workflows:
  result: "{output_folder}/workflows"

generated_modules:
  result: "{output_folder}/modules"
